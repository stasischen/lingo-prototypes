<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A1 Friend + Reigns Pilot</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --ink: #1d2625;
      --muted: #64706d;
      --line: #d8d0c4;
      --paper: #fffdf8;
      --friend: #0f6b68;
      --friend-soft: #dff1ee;
      --accent: #9a5a2f;
      --accent-soft: #f5dfc8;
      --good: #17704b;
      --bad-soft: #f7e4cf;
      --shadow: 0 18px 40px rgba(57, 45, 32, .14);
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        linear-gradient(120deg, rgba(15, 107, 104, .06), transparent 34%),
        linear-gradient(240deg, rgba(154, 90, 47, .08), transparent 38%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    .app {
      width: min(100%, 760px);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: rgba(255, 253, 248, .72);
      border-left: 1px solid rgba(216, 208, 196, .7);
      border-right: 1px solid rgba(216, 208, 196, .7);
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: max(14px, env(safe-area-inset-top)) 18px 12px;
      background: rgba(247, 244, 238, .94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(216, 208, 196, .8);
    }
    .kicker {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 800;
    }
    h1 { margin: 4px 0 0; font-size: 20px; letter-spacing: 0; line-height: 1.2; }
    .progress { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-top: 12px; }
    .dot { height: 5px; border-radius: 999px; background: #ddd3c6; }
    .dot.active, .dot.done { background: var(--friend); }
    .scenario-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
    }
    .scenario-current {
      min-height: 38px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,253,248,.9);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 13px;
      font-weight: 850;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .scenario-current small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 780;
    }
    .scenario-picker-button {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      background: var(--friend);
      color: white;
      font-size: 13px;
      font-weight: 850;
      white-space: nowrap;
    }
    .view-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 12px;
    }
    .view-tab {
      min-height: 34px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255,253,248,.92);
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }
    .view-tab.active {
      background: var(--friend);
      border-color: var(--friend);
      color: white;
    }
    main { flex: 1; padding: 18px 18px 132px; display: flex; flex-direction: column; gap: 14px; }
    main.is-reviewing { padding-bottom: 24px; }
    .view-page { display: none; }
    .view-page.active { display: flex; flex-direction: column; gap: 14px; }
    .browser {
      display: none;
      padding: 2px 0 10px;
    }
    .browser.active { display: block; }
    .browser-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      margin-bottom: 12px;
    }
    .browser-title { margin: 0; font-size: 22px; line-height: 1.18; }
    .browser-count { color: var(--muted); font-size: 13px; font-weight: 760; margin-top: 4px; }
    .browser-close {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-size: 20px;
      font-weight: 850;
    }
    .filters {
      display: grid;
      grid-template-columns: 1fr 120px 150px 170px;
      gap: 8px;
      margin-bottom: 12px;
    }
    .filters input,
    .filters select {
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
    }
    .scenario-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .scenario-card {
      text-align: left;
      min-height: 112px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      box-shadow: 0 8px 18px rgba(57, 45, 32, .06);
      overflow-wrap: anywhere;
    }
    .scenario-card.active {
      border-color: #87c7bd;
      background: var(--friend-soft);
    }
    .scenario-card b { display: block; font-size: 15px; line-height: 1.25; }
    .scenario-meta { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.35; font-weight: 760; }
    .empty-state {
      padding: 18px;
      border-radius: 8px;
      border: 1px dashed var(--line);
      color: var(--muted);
      background: rgba(255,253,248,.72);
    }
    .screen { display: none; animation: rise .18s ease-out; }
    .screen.active { display: block; }
    @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .scene {
      min-height: 170px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(20, 81, 78, .08), rgba(154, 90, 47, .08)), var(--paper);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 18px;
      position: relative;
      overflow: hidden;
    }
    .scene::before {
      content: "";
      position: absolute;
      inset: auto 18px 22px;
      height: 46px;
      border: 1px solid rgba(29, 38, 37, .18);
      border-radius: 6px;
      background: rgba(255, 253, 248, .56);
    }
    .scene::after {
      content: "";
      position: absolute;
      right: 36px;
      bottom: 68px;
      width: 62px;
      height: 78px;
      border-radius: 30px 30px 8px 8px;
      background: linear-gradient(#205b57, #103d3b);
      box-shadow: -86px 18px 0 -15px #ad7a4d;
      opacity: .88;
    }
    .scene-title { position: relative; z-index: 1; font-size: 28px; line-height: 1.08; font-weight: 850; max-width: 250px; }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 10px 24px rgba(57, 45, 32, .08);
      padding: 16px;
    }
    .friend-line { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--friend); color: white;
      display: grid; place-items: center; font-weight: 900; box-shadow: inset 0 -5px 0 rgba(0,0,0,.12);
    }
    .friend-copy { color: var(--ink); line-height: 1.55; font-size: 16px; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 8px; }
    .dialogue { display: flex; flex-direction: column; gap: 12px; }
    .bubble { max-width: 86%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
    .bubble.staff { align-self: flex-start; }
    .bubble.learner { align-self: flex-end; background: var(--friend-soft); border-color: #b9ddd7; }
    .role { font-size: 12px; color: var(--muted); font-weight: 800; margin-bottom: 5px; }
    .ko { font-size: 22px; line-height: 1.3; font-weight: 760; letter-spacing: 0; }
    .zh { margin-top: 6px; color: var(--muted); font-size: 14px; }
    .spotlight { text-align: center; padding: 22px 14px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
    .spotlight .ko { font-size: 28px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .chip { padding: 10px 12px; background: var(--accent-soft); border: 1px solid #e0bd98; border-radius: 999px; color: #58331c; font-weight: 780; }
    .sheet { border-left: 4px solid var(--accent); }
    .sheet h2, .practice h2, .reigns h2 { margin: 0 0 10px; font-size: 18px; letter-spacing: 0; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid rgba(216, 208, 196, .72); }
    .row:first-of-type { border-top: 0; }
    .row b { min-width: 58px; }
    .choice-list { display: grid; gap: 10px; margin-top: 12px; }
    .choice { text-align: left; padding: 13px; border-radius: var(--radius); background: #fff; border: 1px solid var(--line); color: var(--ink); min-height: 56px; }
    .choice.selected.good { border-color: rgba(23,112,75,.45); background: #e4f3ec; }
    .choice.selected.warn { border-color: rgba(155,101,30,.45); background: var(--bad-soft); }
    .feedback { display: none; margin-top: 12px; padding: 12px; border-radius: var(--radius); background: var(--friend-soft); color: var(--ink); line-height: 1.45; border: 1px solid #b9ddd7; }
    .feedback.show { display: block; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .btn { min-height: 44px; border-radius: 8px; padding: 0 14px; background: var(--ink); color: white; font-weight: 800; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.secondary { background: #ede4d8; color: var(--ink); border: 1px solid var(--line); }
    .btn.ghost { background: transparent; color: var(--friend); border: 1px solid #b9ddd7; }
    .stage-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 999px; background: var(--friend-soft); color: var(--friend); font-size: 12px; font-weight: 850; margin-bottom: 10px; }
    .typebox { width: 100%; min-height: 48px; border-radius: 8px; border: 1px solid var(--line); padding: 12px; background: #fff; color: var(--ink); margin-top: 10px; }
    .reigns-board { display: grid; gap: 12px; }
    .chat-shell {
      height: clamp(430px, calc(100vh - 246px), 620px);
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      gap: 10px;
    }
    .chat-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      padding: 0 2px;
    }
    .chat-tools { display: flex; align-items: center; gap: 7px; }
    .toggle {
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,253,248,.9);
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }
    .toggle.active {
      background: var(--friend-soft);
      border-color: #b9ddd7;
      color: var(--friend);
    }
    .message-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      padding: 8px 2px 12px;
      overflow-y: auto;
    }
    .message {
      max-width: 84%;
      padding: 11px 12px;
      border-radius: 18px;
      border: 1px solid rgba(216, 208, 196, .82);
      background: #fff;
      box-shadow: 0 8px 18px rgba(57, 45, 32, .07);
      overflow-wrap: anywhere;
    }
    .message.staff { align-self: flex-start; border-bottom-left-radius: 6px; }
    .message.learner {
      align-self: flex-end;
      border-bottom-right-radius: 6px;
      background: var(--friend);
      border-color: var(--friend);
      color: white;
    }
    .message.friend {
      align-self: center;
      width: min(100%, 320px);
      max-width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--friend-soft);
      border-color: #b9ddd7;
      color: var(--ink);
      box-shadow: none;
    }
    .message .role { margin-bottom: 4px; }
    .message.learner .role { color: rgba(255,255,255,.74); }
    .message .ko { font-size: 19px; }
    .message.learner .ko { color: white; }
    .message.friend .role { display: none; }
    .message.friend .ko { font-size: 13px; line-height: 1.35; font-weight: 650; }
    .message .zh { font-size: 13px; }
    .message.learner .zh { color: rgba(255,255,255,.8); }
    .formula-inline {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }
    .formula-chip {
      min-height: 42px;
      padding: 6px;
      border-radius: 8px;
      background: rgba(255,253,248,.86);
      border: 1px solid #b9ddd7;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .formula-chip span { display: block; margin-top: 2px; color: var(--muted); font-weight: 700; }
    .message-actions { margin-top: 8px; }
    .speak-link {
      min-height: 32px;
      padding: 0 9px;
      border-radius: 999px;
      background: #ede4d8;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }
    .quick-replies {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 16px 16px 8px 8px;
      background: rgba(255,253,248,.92);
      box-shadow: 0 -8px 20px rgba(57, 45, 32, .08);
    }
    .quick-replies.is-hidden { display: none; }
    .quick-replies .choice {
      min-height: 46px;
      border-radius: 8px;
      padding: 10px 14px;
      box-shadow: 0 4px 12px rgba(57,45,32,.06);
      overflow-wrap: anywhere;
    }
    .choice-ko { display: block; }
    .choice-zh { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .typing-hint {
      display: none;
      align-self: start;
      width: fit-content;
      max-width: 92%;
      padding: 9px 11px;
      border-radius: 14px;
      background: var(--friend-soft);
      border: 1px solid #b9ddd7;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.4;
    }
    .typing-hint.show { display: block; }
    .hud { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 9px; font-size: 12px; color: var(--muted); }
    .stat b { display: block; margin-top: 3px; color: var(--ink); font-size: 16px; }
    .event-card {
      position: relative; padding: 16px; min-height: 190px; background: linear-gradient(180deg, #fffdf8, #f8efe4);
      border: 2px solid #cab99f; border-radius: 8px; box-shadow: var(--shadow);
    }
    .event-card::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(154,90,47,.25); border-radius: 5px; pointer-events: none; }
    .event-label { font-size: 12px; color: var(--accent); font-weight: 900; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }
    .npc { margin-top: 14px; padding: 12px; border-radius: 8px; background: rgba(15,107,104,.08); }
    .mini-thread { display: grid; gap: 8px; margin-top: 12px; }
    .mini-turn { padding: 9px 10px; border-radius: 8px; border: 1px solid rgba(216, 208, 196, .8); background: rgba(255,253,248,.72); font-size: 14px; line-height: 1.35; }
    .mini-turn b { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
    .followup { display: none; }
    .followup.show { display: grid; }
    .listen-only { border-color: #c8d7d4; background: #f3faf8; }
    .formula-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .formula-card { min-height: 78px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; text-align: left; }
    .formula-card b { display: block; font-size: 20px; line-height: 1.2; }
    .hand { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .transcript { display: grid; gap: 8px; }
    .transcript .mini-turn { background: #fff; }
    .transcript .bubble { max-width: 100%; width: 100%; box-shadow: none; }
    .transcript .ko { font-size: 18px; }
    .round-label { color: var(--muted); font-size: 13px; font-weight: 800; margin-bottom: 8px; }
    .play-slot { min-height: 52px; border: 1px dashed #b89977; border-radius: 8px; display: grid; place-items: center; color: var(--muted); background: rgba(255,253,248,.74); padding: 10px; text-align: center; }
    .wrap-list { display: grid; gap: 9px; margin: 12px 0 0; }
    .wrap-item { padding: 10px; border-radius: 8px; background: #fff; border: 1px solid var(--line); }
    .review-panel {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,253,248,.94);
      box-shadow: 0 10px 24px rgba(57, 45, 32, .08);
    }
    .review-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
    }
    .review-title { margin: 0; font-size: 20px; line-height: 1.2; }
    .review-summary { color: var(--muted); font-size: 13px; font-weight: 760; margin-top: 4px; }
    .review-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .review-controls select {
      min-height: 40px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
    }
    .review-badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--friend-soft);
      color: var(--friend);
      border: 1px solid #b9ddd7;
      font-size: 12px;
      font-weight: 850;
    }
    .badge.warn { background: var(--bad-soft); color: #8b4421; border-color: #e2b88f; }
    .review-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .review-card {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      overflow-wrap: anywhere;
    }
    .review-card h3 { margin: 0 0 8px; font-size: 15px; line-height: 1.25; }
    .review-card p { margin: 6px 0; line-height: 1.45; }
    .review-card ul { margin: 8px 0 0; padding-left: 18px; }
    .review-card li { margin: 4px 0; line-height: 1.35; }
    .review-text { font-size: 15px; line-height: 1.45; }
    .review-kicker { color: var(--muted); font-size: 12px; font-weight: 850; text-transform: uppercase; letter-spacing: .04em; }
    .friend-bar {
      position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 760px);
      padding: 10px 14px max(10px, env(safe-area-inset-bottom)); background: rgba(255,253,248,.96);
      border-top: 1px solid var(--line); display: grid; grid-template-columns: 34px 1fr auto; gap: 10px;
      align-items: center; z-index: 10; box-shadow: 0 -12px 26px rgba(57,45,32,.10);
    }
    .friend-bar .avatar { width: 34px; height: 34px; font-size: 13px; }
    .friend-bar.hidden { display: none; }
    .bar-text { font-size: 14px; line-height: 1.35; color: var(--ink); }
    .next { min-width: 58px; height: 40px; border-radius: 8px; background: var(--friend); color: white; font-weight: 850; }
    .next:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 620px) {
      .filters { grid-template-columns: 1fr 1fr; }
      .filters input { grid-column: 1 / -1; }
      .scenario-grid { grid-template-columns: 1fr; }
      .scenario-bar { grid-template-columns: 1fr; }
      .scenario-picker-button { width: 100%; }
      .view-tabs { grid-template-columns: 1fr; }
      .review-controls { grid-template-columns: 1fr; }
      .review-head { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="kicker">A1 Friend Pilot</div>
      <h1>飯店預約情境</h1>
      <div class="progress" aria-label="flow progress">
        <div class="dot active"></div><div class="dot"></div>
      </div>
      <div class="scenario-bar">
        <button class="scenario-current" type="button" id="currentScenarioButton">載入場景中</button>
      </div>
      <div class="view-tabs" aria-label="viewer sections">
        <button class="view-tab active" type="button" data-view="course">Course</button>
        <button class="view-tab" type="button" data-view="menu">Menu</button>
        <button class="view-tab" type="button" data-view="review">Learner Review</button>
      </div>
    </header>
    <main>
      <div class="view-page" id="menuView">
        <section class="browser active" id="scenarioBrowser" aria-label="scenario browser">
          <div class="browser-head">
            <div>
              <h2 class="browser-title">選擇練習場景</h2>
              <div class="browser-count" id="browserCount">載入中</div>
            </div>
            <button class="browser-close" type="button" id="closeScenarioBrowser" aria-label="close scenario browser">×</button>
          </div>
          <div class="filters">
            <input id="scenarioSearch" type="search" placeholder="搜尋標題、場景、地點">
            <select id="levelFilter" aria-label="level filter"></select>
          <select id="languageFilter" aria-label="target language filter"></select>
          <select id="learnerLanguageMenu" aria-label="learner language"></select>
          </div>
          <div class="scenario-grid" id="scenarioGrid"></div>
        </section>
      </div>
      <div class="view-page" id="reviewView">
        <section class="review-panel" id="learnerReviewPanel" aria-label="learner projection review panel">
          <div class="review-head">
            <div>
              <h2 class="review-title">10x10 Learner Review</h2>
              <div class="review-summary" id="reviewSummary">載入中</div>
            </div>
            <button class="browser-close" type="button" id="closeReviewPanel" aria-label="close learner review">×</button>
          </div>
          <div class="review-controls">
            <select id="reviewTargetLanguage" aria-label="target language"></select>
            <select id="reviewLearnerLanguage" aria-label="learner language"></select>
          </div>
          <div class="review-badges" id="reviewBadges"></div>
          <div class="review-grid" id="reviewGrid"></div>
        </section>
      </div>
      <div class="view-page active" id="courseView">
        <section class="screen active" data-title="櫃台對話" data-friend="到櫃台了。聽聽看他說什麼，挑一句回他。">
          <div class="chat-shell">
            <div class="chat-status">
              <span id="settingLabel">飯店櫃台</span>
              <div class="chat-tools">
                <button class="toggle" type="button" id="translationToggle" aria-pressed="false">翻譯</button>
                <button class="toggle" type="button" id="hintToggle" aria-pressed="false">提示</button>
                <button class="toggle active" type="button" id="audioToggle" aria-pressed="true">聲音</button>
                <span id="roundProgress">1 / 4</span>
              </div>
            </div>
            <div class="message-list" id="transcriptList" aria-live="polite"></div>
            <div class="typing-hint" id="dialogueFeedback"></div>
            <div class="quick-replies" id="responseHand"></div>
          </div>
        </section>
        <section class="screen" data-title="Wrap" data-friend="你剛剛走完一段對話。">
          <div class="card"><h2 id="wrapTitle">今天這段對話</h2><div class="wrap-list" id="wrapList"></div><div class="controls"><button class="btn" type="button" id="restart">再走一次</button></div></div>
        </section>
      </div>
    </main>
    <div class="friend-bar" aria-live="polite"><div class="avatar">F</div><div class="bar-text" id="friendText">到櫃台了。聽聽看他說什麼，挑一句回他。</div><button class="next" type="button" id="nextBtn">繼續</button></div>
  </div>
  <script>
    const screens = Array.from(document.querySelectorAll('.screen'));
    const dots = Array.from(document.querySelectorAll('.dot'));
    const nextBtn = document.getElementById('nextBtn');
    const friendText = document.getElementById('friendText');
    const title = document.querySelector('h1');
    let index = 0;
    let roundIndex = 0;
    let selectedResponse = null;
    let roundCommitted = false;
    let dialogueComplete = false;
    let showTranslations = false;
    let showHints = false;
    let autoSpeakStaff = true;
    let audioUnlocked = false;
    let pendingStaffSpeak = null;
    let visibleChoices = [];
    let scenarioManifest = null;
    let currentScenarioId = null;
    let currentEntryId = null;
    let learnerProjectionData = null;
    let awaitingAdvanceTap = false;
    let scenarioPack = null;
    let learnerScenarioPack = null;
    let learnerScenarioPackKey = '';
    let rounds = [];
    const browserState = { query: '', level: 'all', language: 'all' };
    const reviewState = { target: 'ko', learner: 'zh' };
    const transcript = [];
    let missesByRound = [];
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }
    function surfaceText(item) { return item && (item.surface || item.text || item.label || ''); }
    function translationText(item) { return item && (item.translation || item.zh || item.gloss || ''); }
    function speakText(item) { return item && (item.speak || surfaceText(item)); }
    function normalize(text) { return String(text || '').normalize('NFC').replace(/[.,!?，。！？\s]/g, '').trim(); }
    function supportText() { return scenarioPack && scenarioPack.support_text ? scenarioPack.support_text : '聽聽看對方說什麼，挑一句回他。'; }
    function roleDefault(role) {
      const defaults = {
        npc: { ko: '직원', ja: '店員', en: 'Staff', th: 'พนักงาน', es: 'Personal', fr: 'Personnel', de: 'Personal', it: 'Personale', zh: '店員', pt: 'Atendente' },
        learner: { ko: '나', ja: '自分', en: 'You', th: 'คุณ', es: 'Tú', fr: 'Vous', de: 'Du', it: 'Tu', zh: '你', pt: 'Você' }
      };
      return defaults[role][scenarioPack && scenarioPack.language] || defaults[role].zh;
    }
    function isForeignScriptRole(label) {
      const language = scenarioPack && scenarioPack.language;
      if (!label) return true;
      if (['zh', 'ja', 'ko', 'th'].includes(language)) return /[A-Za-zÀ-ÿ]/.test(label);
      return false;
    }
    function roleLabel(role) {
      const label = scenarioPack && scenarioPack.roles && scenarioPack.roles[role] ? scenarioPack.roles[role].label : '';
      return isForeignScriptRole(label) ? roleDefault(role) : label;
    }
    function npcLabel() { return roleLabel('npc'); }
    function learnerLabel() { return roleLabel('learner'); }
    function targetLangCode() {
      const map = {
        ko: 'ko-KR',
        ja: 'ja-JP',
        en: 'en-US',
        th: 'th-TH',
        es: 'es-ES',
        fr: 'fr-FR',
        de: 'de-DE',
        it: 'it-IT',
        zh: 'zh-CN',
        pt: 'pt-BR'
      };
      return map[scenarioPack && scenarioPack.language] || 'ko-KR';
    }
    function matchingLearnerTurn(turn) {
      if (!learnerScenarioPack || !scenarioPack || learnerScenarioPack.language === scenarioPack.language) return null;
      return (learnerScenarioPack.turns || []).find((candidate) => candidate.turn_id === turn.turn_id) || null;
    }
    function matchingLearnerChoice(turn, choice) {
      const learnerTurn = matchingLearnerTurn(turn);
      if (!learnerTurn || !learnerTurn.reply_set || !Array.isArray(learnerTurn.reply_set.choices)) return null;
      return learnerTurn.reply_set.choices.find((candidate) => candidate.id === choice.id) || null;
    }
    function learnerTranslationForTurn(turn) {
      const learnerTurn = matchingLearnerTurn(turn);
      return learnerTurn ? surfaceText(learnerTurn) : translationText(turn);
    }
    function learnerTranslationForChoice(turn, choice) {
      const learnerChoice = matchingLearnerChoice(turn, choice);
      return learnerChoice ? surfaceText(learnerChoice) : translationText(choice);
    }
    function buildRounds(pack) {
      function correctIds(turn) {
        const accepted = turn.reply_set && Array.isArray(turn.reply_set.accepted) ? turn.reply_set.accepted : [];
        return new Set([turn.reply_set.correct, ...accepted].filter(Boolean));
      }
      function correctChoice(turn) {
        const ids = correctIds(turn);
        return turn.reply_set.choices.find((choice) => ids.has(choice.id));
      }
      function isRedundantLearnerMirror(turn, previousTurn) {
        if (!previousTurn || turn.speaker !== 'learner') return false;
        const currentCorrect = correctChoice(turn);
        const previousCorrect = correctChoice(previousTurn);
        return currentCorrect && previousCorrect && normalize(surfaceText(currentCorrect)) === normalize(surfaceText(previousCorrect));
      }
      return pack.turns.filter((turn, index) => !isRedundantLearnerMirror(turn, pack.turns[index - 1])).map((turn) => {
        const correctIdSet = correctIds(turn);
        const speaker = turn.speaker || (turn.learning_role === 'production_target' ? 'learner' : 'npc');
        const closing = turn.closing && typeof turn.closing === 'object' ? turn.closing : null;
        const showClosing = closing && closing.learning_role === 'listen_only' && surfaceText(closing) && normalize(surfaceText(closing)) !== normalize(surfaceText(turn));
        return {
          id: turn.turn_id,
          act: turn.act,
          speaker,
          learningRole: turn.learning_role,
          staffKo: surfaceText(turn),
          staffZh: learnerTranslationForTurn(turn),
          staffSpeak: speakText(turn),
          hint: turn.friend && turn.friend.hint ? turn.friend.hint : supportText(),
          inlineExplain: turn.inline_explain || null,
          choices: turn.reply_set.choices.map((choice) => ({
            id: choice.id,
            text: surfaceText(choice),
            zh: learnerTranslationForChoice(turn, choice),
            speak: speakText(choice),
            good: correctIdSet.has(choice.id),
            feedback: choice.feedback,
            learningRole: choice.learning_role || null,
            contrastType: choice.contrast_type || null,
            endsDialogue: Boolean(choice.ends_dialogue)
          })),
          closing: showClosing ? {
            ko: surfaceText(closing),
            zh: translationText(closing),
            speak: speakText(closing)
          } : null
        };
      });
    }
    function shuffle(items) {
      const shuffled = [...items];
      for (let i = shuffled.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }
    function speakKo(text, rate = 0.88, options = {}) {
      if (!('speechSynthesis' in window)) {
        if (!options.silent) alert('這個瀏覽器不支援內建發音。');
        return false;
      }
      if (!options.queue) window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = targetLangCode();
      utterance.rate = rate;
      utterance.pitch = 1;
      if (typeof options.onend === 'function') utterance.onend = options.onend;
      if (typeof options.onerror === 'function') utterance.onerror = options.onerror;
      const voices = window.speechSynthesis.getVoices();
      const targetPrefix = targetLangCode().slice(0, 2).toLowerCase();
      const koVoice = voices.find((voice) => voice.lang && voice.lang.toLowerCase().startsWith(targetPrefix));
      if (koVoice) utterance.voice = koVoice;
      window.speechSynthesis.speak(utterance);
      return true;
    }
    function unlockAudio() {
      audioUnlocked = true;
      if (autoSpeakStaff && pendingStaffSpeak) {
        speakKo(pendingStaffSpeak, 0.88, { silent: true });
        pendingStaffSpeak = null;
      }
    }
    function autoPlayStaff(text) {
      if (!autoSpeakStaff || !text) return;
      pendingStaffSpeak = text;
      if (audioUnlocked) {
        speakKo(text, 0.88, { silent: true });
        pendingStaffSpeak = null;
      } else {
        friendText.textContent = '點「聲音」或任一處，就能聽職員念出來。';
      }
    }
    function renderDialogueRound() {
      const round = rounds[roundIndex];
      selectedResponse = null;
      roundCommitted = false;
      document.getElementById('roundProgress').textContent = `${roundIndex + 1} / ${rounds.length}`;
      let addedStaff = false;
      if (round.speaker !== 'learner' && !transcript.some((turn) => turn.round === roundIndex && turn.kind === 'staff')) {
        transcript.push({ round: roundIndex, kind: 'staff', role: npcLabel(), ko: round.staffKo, zh: round.staffZh, speak: round.staffSpeak || round.staffKo });
        addedStaff = true;
        if (round.inlineExplain) {
          transcript.push({
            round: roundIndex,
            kind: 'friend',
            role: 'Friend',
            ko: round.inlineExplain.explain || round.inlineExplain.title,
            formula: round.inlineExplain
          });
        }
      } else if (round.speaker === 'learner' && round.inlineExplain && !transcript.some((turn) => turn.round === roundIndex && turn.kind === 'friend')) {
        transcript.push({
          round: roundIndex,
          kind: 'friend',
          role: 'Friend',
          ko: round.inlineExplain.explain || round.inlineExplain.title,
          formula: round.inlineExplain
        });
      }
      friendText.textContent = showHints ? round.hint : supportText();
      const feedback = document.getElementById('dialogueFeedback');
      if (!feedback.dataset.keep) {
        feedback.textContent = '';
        feedback.classList.remove('show');
      }
      feedback.dataset.keep = '';
      const hand = document.getElementById('responseHand');
      visibleChoices = shuffle(round.choices);
      renderChoices();
      renderTranscript();
      updateNextButton();
      if (addedStaff) autoPlayStaff(round.staffSpeak || round.staffKo);
    }
    function renderChoices() {
      const hand = document.getElementById('responseHand');
      hand.classList.remove('is-hidden');
      hand.innerHTML = '';
      visibleChoices.forEach((choice) => {
        const button = document.createElement('button');
        button.className = 'choice';
        button.type = 'button';
        button.innerHTML = `<span class="choice-ko">${escapeHtml(choice.text)}</span>${shouldShowTranslation(choice.text, choice.zh) ? `<span class="choice-zh">${escapeHtml(choice.zh)}</span>` : ''}`;
        button.addEventListener('click', () => {
          if (roundCommitted) return;
          Array.from(hand.children).forEach((child) => child.classList.remove('selected', 'good', 'warn'));
          button.classList.add('selected', choice.good ? 'good' : 'warn');
          selectedResponse = choice;
          unlockAudio();
          const spokenText = choice.speak || choice.text;
          speakKo(spokenText);
          sendSelectedReply();
        });
        hand.appendChild(button);
      });
    }
    function renderTranscript() {
      const list = document.getElementById('transcriptList');
      if (!list) return;
      if (!transcript.length) {
        list.innerHTML = `<div class="message friend"><div class="ko">${escapeHtml(supportText())}</div></div>`;
        return;
      }
      list.innerHTML = transcript.map((turn) => {
        const roleClass = turn.kind || (turn.role === learnerLabel() ? 'learner' : (turn.role === 'Friend' ? 'friend' : 'staff'));
        const zh = shouldShowTranslation(turn.ko, turn.zh) ? `<div class="zh">${escapeHtml(turn.zh)}</div>` : '';
        const action = turn.speak ? `<div class="message-actions"><button class="speak-link" type="button" data-speak="${escapeHtml(turn.speak)}">${escapeHtml(chromeLabel('speak'))}</button></div>` : '';
        const formulaItems = turn.formula && Array.isArray(turn.formula.items) ? turn.formula.items : [];
        const formula = formulaItems.length ? `<div class="formula-inline">${formulaItems.map((item) => `<button class="formula-chip" type="button" data-speak="${escapeHtml(item.speak || item.surface)}">${escapeHtml(item.surface)}${shouldShowTranslation(item.surface, item.translation) ? `<span>${escapeHtml(item.translation)}</span>` : ''}</button>`).join('')}</div>` : '';
        const role = turn.role === 'Friend' ? '' : `<div class="role">${escapeHtml(turn.role)}</div>`;
        return `<div class="message ${escapeHtml(roleClass)}">${role}<div class="ko">${escapeHtml(turn.ko)}</div>${zh}${formula}${action}</div>`;
      }).join('');
      list.scrollTop = list.scrollHeight;
    }
    function seedOpeningMessages() {
      const openingMessages = scenarioPack && Array.isArray(scenarioPack.opening_messages) ? scenarioPack.opening_messages : [];
      openingMessages.forEach((message, openingIndex) => {
        const kind = message.speaker === 'learner' ? 'learner' : (message.speaker === 'friend' ? 'friend' : 'staff');
        const role = kind === 'learner' ? learnerLabel() : (kind === 'staff' ? npcLabel() : 'Friend');
        transcript.push({
          round: -1,
          openingIndex,
          kind,
          role,
          ko: message.surface,
          zh: message.translation,
          speak: message.speak || message.surface,
          learningRole: message.learning_role || null
        });
      });
    }
    function resetDialogue() {
      roundIndex = 0;
      dialogueComplete = false;
      awaitingAdvanceTap = false;
      transcript.length = 0;
      seedOpeningMessages();
      missesByRound = Array(rounds.length).fill(0);
      visibleChoices = [];
      document.getElementById('dialogueFeedback').dataset.keep = '';
      document.getElementById('responseHand').classList.remove('is-hidden');
      renderDialogueRound();
    }
    function updateNextButton() {
      const onDialogue = screens[index] && screens[index].dataset.title === '櫃台對話';
      if (onDialogue && !dialogueComplete) {
        nextBtn.disabled = !awaitingAdvanceTap;
        nextBtn.textContent = awaitingAdvanceTap ? '下一句' : '對話中';
        return;
      }
      nextBtn.disabled = false;
      nextBtn.textContent = index === screens.length - 1 ? '重來' : (onDialogue ? '整理' : '繼續');
    }
    function show(i) {
      index = Math.max(0, Math.min(i, screens.length - 1));
      screens.forEach((screen, idx) => screen.classList.toggle('active', idx === index));
      dots.forEach((dot, idx) => { dot.classList.toggle('active', idx === index); dot.classList.toggle('done', idx < index); });
      const screen = screens[index];
      title.textContent = screen.dataset.title === 'Wrap' ? (scenarioPack && scenarioPack.title ? scenarioPack.title : 'A1 Friend Pilot') : (scenarioPack && scenarioPack.title ? scenarioPack.title : 'A1 Friend Pilot');
      if (screen.dataset.title === '櫃台對話') {
        friendText.textContent = showHints && rounds[roundIndex] ? rounds[roundIndex].hint : supportText();
      } else {
        friendText.textContent = screen.dataset.friend || '';
      }
      if (screen.dataset.title === '櫃台對話' && transcript.length === 0 && !dialogueComplete) renderDialogueRound();
      updateNextButton();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    nextBtn.addEventListener('click', () => {
      if (nextBtn.disabled) return;
      if (awaitingAdvanceTap) {
        advanceDialogueRound();
        return;
      }
      if (index === screens.length - 1) {
        resetDialogue();
        show(0);
      } else {
        show(index + 1);
      }
    });
    document.querySelectorAll('.speak').forEach((button) => {
      button.addEventListener('click', () => {
        unlockAudio();
        speakKo(button.dataset.speak || button.textContent);
      });
    });
    document.getElementById('transcriptList').addEventListener('click', (event) => {
      const button = event.target.closest('.speak-link, .formula-chip');
      if (!button) return;
      unlockAudio();
      speakKo(button.dataset.speak || button.textContent);
    });
    function updateToggle(button, active) {
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    }
    function setTranslations(active) {
      showTranslations = active;
      updateToggle(document.getElementById('translationToggle'), showTranslations);
      renderTranscript();
      if (screens[index] && screens[index].dataset.title === '櫃台對話' && !awaitingAdvanceTap) renderChoices();
    }
    function setHints(active) {
      showHints = active;
      updateToggle(document.getElementById('hintToggle'), showHints);
      if (screens[index] && screens[index].dataset.title === '櫃台對話') {
        const round = rounds[roundIndex];
        friendText.textContent = showHints && round ? round.hint : supportText();
      }
    }
    document.getElementById('translationToggle').addEventListener('click', () => {
      setTranslations(!showTranslations);
    });
    document.getElementById('hintToggle').addEventListener('click', () => {
      setHints(!showHints);
    });
    document.getElementById('audioToggle').addEventListener('click', () => {
      if (!audioUnlocked) {
        unlockAudio();
        updateToggle(document.getElementById('audioToggle'), autoSpeakStaff);
        return;
      }
      autoSpeakStaff = !autoSpeakStaff;
      updateToggle(document.getElementById('audioToggle'), autoSpeakStaff);
      if (autoSpeakStaff && pendingStaffSpeak) {
        speakKo(pendingStaffSpeak, 0.88, { silent: true });
        pendingStaffSpeak = null;
      } else if (!autoSpeakStaff) {
        pendingStaffSpeak = null;
      }
    });
    function advanceDialogueRound() {
      if (!awaitingAdvanceTap) return;
      awaitingAdvanceTap = false;
      renderDialogueRound();
    }
    document.querySelector('.chat-shell').addEventListener('click', (event) => {
      if (!awaitingAdvanceTap) return;
      if (event.target.closest('button')) return;
      advanceDialogueRound();
    });
    function sendSelectedReply() {
      const feedback = document.getElementById('dialogueFeedback');
      if (roundCommitted) return;
      if (!selectedResponse) {
        feedback.textContent = '先選一句回應。';
        feedback.classList.add('show');
        return;
      }
      if (!selectedResponse.good) {
        feedback.textContent = selectedResponse.feedback;
        feedback.classList.add('show');
        missesByRound[roundIndex] += 1;
        if (missesByRound[roundIndex] >= 2) setHints(true);
        if (missesByRound[roundIndex] >= 3) setTranslations(true);
        return;
      }
      feedback.textContent = '';
      feedback.classList.remove('show');
      const round = rounds[roundIndex];
      roundCommitted = true;
      Array.from(document.getElementById('responseHand').children).forEach((button) => { button.disabled = true; });
      transcript.push({ round: roundIndex, kind: 'learner', role: learnerLabel(), ko: selectedResponse.text, zh: selectedResponse.zh, speak: selectedResponse.speak || selectedResponse.text });
      if (round.closing) transcript.push({ round: roundIndex, kind: 'staff', role: npcLabel(), ko: round.closing.ko, zh: round.closing.zh, speak: round.closing.speak });
      renderTranscript();
      if (round.closing && autoSpeakStaff && audioUnlocked) {
        speakKo(round.closing.speak || round.closing.ko, 0.88, { silent: true, queue: true });
      }
      if (selectedResponse.endsDialogue) {
        dialogueComplete = true;
        feedback.textContent = '';
        feedback.classList.remove('show');
        friendText.textContent = '這個選項也合理。按整理看今天用到的句子。';
        const hand = document.getElementById('responseHand');
        hand.innerHTML = '';
        hand.classList.add('is-hidden');
        updateNextButton();
      } else if (roundIndex < rounds.length - 1) {
        roundIndex += 1;
        awaitingAdvanceTap = true;
        const hand = document.getElementById('responseHand');
        hand.innerHTML = '';
        hand.classList.add('is-hidden');
        updateNextButton();
      } else {
        dialogueComplete = true;
        feedback.textContent = '';
        feedback.classList.remove('show');
        friendText.textContent = '按整理看今天用到的句子。';
        const hand = document.getElementById('responseHand');
        hand.innerHTML = '';
        hand.classList.add('is-hidden');
        updateNextButton();
      }
    }
    document.getElementById('restart').addEventListener('click', () => { resetDialogue(); show(0); });
    function renderWrap() {
      const list = document.getElementById('wrapList');
      const wrapTitle = document.getElementById('wrapTitle');
      if (!list || !scenarioPack) return;
      wrapTitle.textContent = scenarioPack.wrap_title || '今天這段對話';
      screens[1].dataset.friend = scenarioPack.wrap_friend || '你剛剛走完一段對話。';
      const seen = new Set();
      const items = [];
      const addItem = (surface, translation) => {
        if (!surface || seen.has(surface)) return;
        seen.add(surface);
        items.push({ surface, translation });
      };
      if (Array.isArray(scenarioPack.opening_messages)) {
        scenarioPack.opening_messages.forEach((message) => {
          if (message.learning_role === 'production_target') {
            addItem(surfaceText(message), translationText(message));
          }
        });
      }
      scenarioPack.turns.forEach((turn) => {
        if (turn.learning_role === 'listen_only') addItem(surfaceText(turn), translationText(turn));
        const acceptedIds = turn.reply_set && Array.isArray(turn.reply_set.accepted) ? turn.reply_set.accepted : [];
        const correctIds = new Set([turn.reply_set && turn.reply_set.correct, ...acceptedIds].filter(Boolean));
        const correctChoices = turn.reply_set && turn.reply_set.choices ? turn.reply_set.choices.filter((choice) => correctIds.has(choice.id)) : [];
        correctChoices.forEach((correctChoice) => {
          if (correctChoice.learning_role === 'production_target') {
            addItem(surfaceText(correctChoice), translationText(correctChoice));
          }
        });
        const closing = turn.closing && typeof turn.closing === 'object' ? turn.closing : null;
        if (closing && closing.learning_role === 'listen_only') {
          addItem(surfaceText(closing), translationText(closing));
        }
      });
      list.innerHTML = items.map((item) => `<div class="wrap-item"><b>${escapeHtml(item.surface)}</b><div class="meta">${escapeHtml(item.translation)}</div></div>`).join('');
    }
    function currentEntry() {
      if (!scenarioManifest) return null;
      return scenarioManifest.scenarios.find((scenario) => scenario.entry_id === currentEntryId) || null;
    }
    function updateCurrentScenarioButton() {
      const button = document.getElementById('currentScenarioButton');
      const entry = currentEntry();
      if (!button) return;
      if (!entry) {
        button.textContent = '尚未選擇場景';
        return;
      }
      button.innerHTML = `${escapeHtml(entry.label)}<small>${escapeHtml(entry.level.toUpperCase())} · ${escapeHtml(entry.language_label || entry.language)} · ${escapeHtml(entry.setting_label || entry.scenario_id)}</small>`;
    }
    function syncLearnerSelectors() {
      const menuSelect = document.getElementById('learnerLanguageMenu');
      const reviewSelect = document.getElementById('reviewLearnerLanguage');
      if (menuSelect && menuSelect.options.length && menuSelect.value !== reviewState.learner) {
        menuSelect.value = reviewState.learner;
      }
      if (reviewSelect && reviewSelect.options.length && reviewSelect.value !== reviewState.learner) {
        reviewSelect.value = reviewState.learner;
      }
    }
    async function applyLearnerLanguage(nextLearner) {
      const learner = nextLearner || document.getElementById('learnerLanguageMenu')?.value || document.getElementById('reviewLearnerLanguage')?.value || reviewState.learner;
      const changed = learner && learner !== reviewState.learner;
      if (learner) reviewState.learner = learner;
      syncLearnerSelectors();
      renderLearnerReview();
      if (!scenarioPack) return;
      const expectedKey = `${currentEntryId || scenarioPack.scenario_id || ''}:${reviewState.learner}`;
      if (changed || learnerScenarioPackKey !== expectedKey) {
        await refreshLearnerLanguageView();
      }
    }
    async function showView(viewName) {
      const activeView = ['course', 'menu', 'review'].includes(viewName) ? viewName : 'course';
      if (activeView === 'course') {
        await applyLearnerLanguage();
      } else {
        syncLearnerSelectors();
      }
      document.querySelectorAll('.view-page').forEach((page) => {
        page.classList.toggle('active', page.id === `${activeView}View`);
      });
      document.querySelectorAll('.view-tab').forEach((tab) => {
        tab.classList.toggle('active', tab.dataset.view === activeView);
      });
      document.querySelector('main').classList.toggle('is-reviewing', activeView !== 'course');
      document.querySelector('.friend-bar').classList.toggle('hidden', activeView !== 'course');
      if (activeView === 'menu') renderScenarioBrowser();
      if (activeView === 'review') renderLearnerReview();
    }
    function renderFilterOptions() {
      if (!scenarioManifest) return;
      const levelFilter = document.getElementById('levelFilter');
      const languageFilter = document.getElementById('languageFilter');
      const learnerLanguageMenu = document.getElementById('learnerLanguageMenu');
      const levels = Array.from(new Set(scenarioManifest.scenarios.map((scenario) => scenario.level))).sort();
      const languages = Array.from(new Map(scenarioManifest.scenarios.map((scenario) => [scenario.language, scenario.language_label || scenario.language])).entries())
        .sort((a, b) => a[1].localeCompare(b[1]));
      levelFilter.innerHTML = `<option value="all">全部級別</option>${levels.map((level) => `<option value="${escapeHtml(level)}">${escapeHtml(level.toUpperCase())}</option>`).join('')}`;
      languageFilter.innerHTML = `<option value="all">全部目標語言</option>${languages.map(([code, label]) => `<option value="${escapeHtml(code)}">${escapeHtml(label)}</option>`).join('')}`;
      learnerLanguageMenu.innerHTML = languages.map(([code, label]) => `<option value="${escapeHtml(code)}">${escapeHtml(label)} learner</option>`).join('');
      levelFilter.value = browserState.level;
      languageFilter.value = browserState.language;
      learnerLanguageMenu.value = reviewState.learner;
    }
    function filteredScenarios() {
      if (!scenarioManifest) return [];
      const query = browserState.query.trim().toLowerCase();
      return scenarioManifest.scenarios.filter((scenario) => {
        if (browserState.level !== 'all' && scenario.level !== browserState.level) return false;
        if (browserState.language !== 'all' && scenario.language !== browserState.language) return false;
        if (!query) return true;
        const haystack = [
          scenario.label,
          scenario.scenario_id,
          scenario.setting_label,
          scenario.language_label,
          scenario.source_status
        ].filter(Boolean).join(' ').toLowerCase();
        return haystack.includes(query);
      });
    }
    function renderScenarioBrowser() {
      const grid = document.getElementById('scenarioGrid');
      const count = document.getElementById('browserCount');
      if (!grid || !count || !scenarioManifest) return;
      const scenarios = filteredScenarios();
      const summary = scenarioManifest.summary || {};
      count.textContent = `${scenarios.length} / ${summary.total || scenarioManifest.scenarios.length} 個場景`;
      if (!scenarios.length) {
        grid.innerHTML = '<div class="empty-state">沒有符合條件的場景。</div>';
        return;
      }
      grid.innerHTML = scenarios.map((scenario) => {
        const active = scenario.entry_id === currentEntryId ? ' active' : '';
        const status = scenario.source_status ? ` · ${scenario.source_status}` : '';
        return `<button class="scenario-card${active}" type="button" data-entry-id="${escapeHtml(scenario.entry_id)}">
          <b>${escapeHtml(scenario.label)}</b>
          <div class="scenario-meta">${escapeHtml(scenario.level.toUpperCase())} · ${escapeHtml(scenario.language_label || scenario.language)} · ${escapeHtml(scenario.setting_label || scenario.scenario_id)}</div>
          <div class="scenario-meta">${escapeHtml(scenario.turns || 0)} turns${escapeHtml(status)}</div>
        </button>`;
      }).join('');
    }
    function languageLabel(code) {
      const labels = {
        ko: 'Korean',
        ja: 'Japanese',
        en: 'English',
        th: 'Thai',
        es: 'Spanish',
        fr: 'French',
        de: 'German',
        it: 'Italian',
        zh: 'Chinese',
        pt: 'Portuguese'
      };
      return labels[code] || String(code || '').toUpperCase();
    }
    function chromeLabel(key) {
      const labels = {
        speak: {
          ko: '듣기',
          ja: '再生',
          en: 'Play',
          th: 'ฟัง',
          es: 'Reproducir',
          fr: 'Écouter',
          de: 'Abspielen',
          it: 'Ascolta',
          zh: '發音',
          pt: 'Ouvir'
        }
      };
      return labels[key] && labels[key][reviewState.learner] ? labels[key][reviewState.learner] : labels[key].zh;
    }
    function shouldShowTranslation(surface, translation) {
      if (!showTranslations || !translation) return false;
      if (scenarioPack && scenarioPack.language === reviewState.learner) return false;
      if (scenarioPack && scenarioPack.language === 'en' && !learnerScenarioPack) return false;
      return normalize(surface) !== normalize(translation);
    }
    async function refreshLearnerLanguageView() {
      if (!scenarioPack) return;
      await loadLearnerScenarioPack();
      rounds = buildRounds(scenarioPack);
      missesByRound = Array(rounds.length).fill(0);
      renderWrap();
      showTranslations = scenarioPack.language !== reviewState.learner;
      updateToggle(document.getElementById('translationToggle'), showTranslations);
      resetDialogue();
      setTranslations(showTranslations);
      show(0);
    }
    function currentReviewPair() {
      if (!learnerProjectionData) return null;
      return learnerProjectionData.pairs.find((pair) => pair.target_language === reviewState.target && pair.learner_language === reviewState.learner) || null;
    }
    function renderReviewSelectors() {
      if (!learnerProjectionData) return;
      const targetSelect = document.getElementById('reviewTargetLanguage');
      const learnerSelect = document.getElementById('reviewLearnerLanguage');
      const options = learnerProjectionData.languages.map((code) => `<option value="${escapeHtml(code)}">${escapeHtml(languageLabel(code))}</option>`).join('');
      targetSelect.innerHTML = options;
      learnerSelect.innerHTML = options;
      targetSelect.value = reviewState.target;
      learnerSelect.value = reviewState.learner;
    }
    function renderLearnerReview() {
      const summary = document.getElementById('reviewSummary');
      const badges = document.getElementById('reviewBadges');
      const grid = document.getElementById('reviewGrid');
      if (!summary || !badges || !grid) return;
      if (!learnerProjectionData) {
        summary.textContent = 'Learner projection data is not loaded.';
        badges.innerHTML = '';
        grid.innerHTML = '';
        return;
      }
      renderReviewSelectors();
      const pair = currentReviewPair();
      const dataSummary = learnerProjectionData.summary || {};
      summary.textContent = `${dataSummary.cross_language_reviewed || 0}/90 reviewed · ${dataSummary.same_language_excluded || 0} diagonal excluded · native pending`;
      if (!pair) {
        badges.innerHTML = '<span class="badge warn">missing pair</span>';
        grid.innerHTML = '<div class="review-card">找不到這個 learner/target pair。</div>';
        return;
      }
      const isExcluded = pair.pair_mode === 'same_language_excluded';
      badges.innerHTML = [
        `<span class="badge">${escapeHtml(languageLabel(pair.learner_language))} → ${escapeHtml(languageLabel(pair.target_language))}</span>`,
        `<span class="badge${isExcluded ? ' warn' : ''}">${escapeHtml(pair.review_verdict)}</span>`,
        `<span class="badge">${escapeHtml(pair.target_surface_status)}</span>`,
        `<span class="badge warn">${escapeHtml(pair.native_status || 'native_pending')}</span>`
      ].join('');
      if (isExcluded) {
        grid.innerHTML = '<div class="review-card"><h3>Same-language diagonal</h3><p>這個 cell 在 10x10 learner projection 中明確排除；不需要 learner-language sidecar。</p></div>';
        return;
      }
      const explanations = (pair.sidecars.explanation && pair.sidecars.explanation.items) || [];
      const exercises = (pair.sidecars.exercise_prompt && pair.sidecars.exercise_prompt.items) || [];
      const uiLabels = (pair.sidecars.ui_i18n && pair.sidecars.ui_i18n.items) || [];
      const notes = pair.carried_notes || [];
      const explanationCards = explanations.slice(0, 4).map((item) => `
        <div class="review-card">
          <div class="review-kicker">${escapeHtml(item.learning_object_id)}</div>
          <h3>${escapeHtml(item.learner_heading || item.surface_title_ko || item.surface_id)}</h3>
          <p class="review-text">${escapeHtml(item.learner_explanation || '')}</p>
          <p><b>Evidence:</b> ${escapeHtml(item.evidence_text || '')}</p>
          <p><b>Terms:</b> ${escapeHtml((item.key_terms_ko || item.key_terms || []).join(', '))}</p>
        </div>`).join('');
      const exerciseCards = exercises.slice(0, 4).map((item) => {
        const choiceKey = Object.keys(item).find((key) => key.startsWith('choices_'));
        const answerKey = Object.keys(item).find((key) => key.startsWith('answer_key_'));
        const choices = choiceKey ? item[choiceKey] : [];
        const answer = answerKey ? item[answerKey] : '';
        return `<div class="review-card">
          <div class="review-kicker">${escapeHtml(item.exercise_type)}</div>
          <h3>${escapeHtml(item.exercise_id)}</h3>
          <p class="review-text">${escapeHtml(item.prompt || '')}</p>
          <p><b>Answer:</b> ${escapeHtml(answer)}</p>
          <ul>${choices.map((choice) => `<li>${escapeHtml(choice)}</li>`).join('')}</ul>
        </div>`;
      }).join('');
      const labelItems = uiLabels.slice(0, 8).map((item) => `<li><b>${escapeHtml(item.key)}</b>: ${escapeHtml(item.text)}</li>`).join('');
      const noteItems = notes.length ? notes.map((note) => `<li>${escapeHtml(note)}</li>`).join('') : '<li>No carried notes.</li>';
      grid.innerHTML = `
        <div class="review-card">
          <h3>Review Verdict</h3>
          <p><b>Semantic:</b> ${escapeHtml(pair.semantic_status || 'not recorded')}</p>
          <p><b>Pedagogy:</b> ${escapeHtml(pair.pedagogy_status || 'not recorded')}</p>
          <p><b>Exercise quality:</b> ${escapeHtml(pair.exercise_quality_status || 'not recorded')}</p>
          <p><b>Blocking issues:</b> ${escapeHtml((pair.blocking_issues || []).length)}</p>
          <ul>${noteItems}</ul>
        </div>
        <div class="review-card"><h3>UI Labels</h3><ul>${labelItems}</ul></div>
        ${explanationCards || '<div class="review-card">No explanations found.</div>'}
        ${exerciseCards || '<div class="review-card">No exercises found.</div>'}
      `;
    }
    function findParallelEntry(language) {
      const entry = currentEntry();
      if (!entry || !scenarioManifest) return null;
      return scenarioManifest.scenarios.find((scenario) => (
        scenario.level === entry.level
        && scenario.scenario_id === entry.scenario_id
        && scenario.language === language
      )) || null;
    }
    async function loadLearnerScenarioPack() {
      learnerScenarioPack = null;
      learnerScenarioPackKey = `${currentEntryId || scenarioPack?.scenario_id || ''}:${reviewState.learner || ''}`;
      if (!scenarioManifest || !scenarioPack || !reviewState.learner || reviewState.learner === scenarioPack.language) return;
      const learnerEntry = findParallelEntry(reviewState.learner);
      if (!learnerEntry) return;
      const response = await fetch(learnerEntry.path, { cache: 'no-store' });
      if (!response.ok) return;
      learnerScenarioPack = await response.json();
    }
    async function loadScenario(entry) {
      const response = await fetch(entry.path, { cache: 'no-store' });
      if (!response.ok) throw new Error(`scenario pack load failed: ${response.status}`);
      scenarioPack = await response.json();
      currentScenarioId = scenarioPack.scenario_id;
      currentEntryId = entry.entry_id || `${entry.level || 'a1'}:${entry.language || scenarioPack.language}:${scenarioPack.scenario_id}`;
      await loadLearnerScenarioPack();
      rounds = buildRounds(scenarioPack);
      missesByRound = Array(rounds.length).fill(0);
      document.getElementById('settingLabel').textContent = scenarioPack.setting_label || entry.label;
      document.querySelector('section[data-title="櫃台對話"]').dataset.friend = scenarioPack.support_text || supportText();
      title.textContent = scenarioPack.title || entry.label;
      updateCurrentScenarioButton();
      if (learnerProjectionData && learnerProjectionData.languages.includes(scenarioPack.language)) {
        reviewState.target = scenarioPack.language;
        renderLearnerReview();
      }
      renderScenarioBrowser();
      renderWrap();
      showTranslations = scenarioPack.language !== reviewState.learner;
      updateToggle(document.getElementById('translationToggle'), showTranslations);
      resetDialogue();
      setTranslations(showTranslations);
      show(0);
      await showView('course');
    }
    document.querySelectorAll('.view-tab').forEach((tab) => {
      tab.addEventListener('click', () => { void showView(tab.dataset.view); });
    });
    document.getElementById('currentScenarioButton').addEventListener('click', () => { void showView('menu'); });
    document.getElementById('closeScenarioBrowser').addEventListener('click', () => { void showView('course'); });
    document.getElementById('closeReviewPanel').addEventListener('click', () => { void showView('course'); });
    document.getElementById('reviewTargetLanguage').addEventListener('change', (event) => {
      reviewState.target = event.target.value;
      renderLearnerReview();
    });
    document.getElementById('reviewLearnerLanguage').addEventListener('change', async (event) => {
      await applyLearnerLanguage(event.target.value);
    });
    document.getElementById('scenarioSearch').addEventListener('input', (event) => {
      browserState.query = event.target.value;
      renderScenarioBrowser();
    });
    document.getElementById('levelFilter').addEventListener('change', (event) => {
      browserState.level = event.target.value;
      renderScenarioBrowser();
    });
    document.getElementById('languageFilter').addEventListener('change', (event) => {
      browserState.language = event.target.value;
      renderScenarioBrowser();
    });
    document.getElementById('learnerLanguageMenu').addEventListener('change', async (event) => {
      await applyLearnerLanguage(event.target.value);
    });
    document.getElementById('scenarioGrid').addEventListener('click', async (event) => {
      const button = event.target.closest('.scenario-card');
      if (!button || !scenarioManifest) return;
      const entry = scenarioManifest.scenarios.find((scenario) => scenario.entry_id === button.dataset.entryId);
      if (!entry || entry.entry_id === currentEntryId) {
        await showView('course');
        return;
      }
      try {
        await loadScenario(entry);
      } catch (error) {
        friendText.textContent = '這份練習資料載入失敗，先重新整理看看。';
        document.getElementById('dialogueFeedback').textContent = error.message;
        document.getElementById('dialogueFeedback').classList.add('show');
      }
    });
    async function init() {
      try {
        const manifestResponse = await fetch('scenario_manifest.v1.json', { cache: 'no-store' });
        if (!manifestResponse.ok) throw new Error(`scenario manifest load failed: ${manifestResponse.status}`);
        scenarioManifest = await manifestResponse.json();
        const learnerProjectionResponse = await fetch('data/a1_learner_projection_20260615.json', { cache: 'no-store' });
        if (learnerProjectionResponse.ok) {
          learnerProjectionData = await learnerProjectionResponse.json();
          renderReviewSelectors();
          renderLearnerReview();
        }
        renderFilterOptions();
        const params = new URLSearchParams(window.location.search);
        const requestedEntryId = params.get('entry') || params.get('scenario');
        const requestedScenarioId = params.get('scenario');
        const requestedLanguage = params.get('lang');
        const entry = scenarioManifest.scenarios.find((scenario) => scenario.entry_id === requestedEntryId)
          || scenarioManifest.scenarios.find((scenario) => scenario.scenario_id === requestedScenarioId && (!requestedLanguage || scenario.language === requestedLanguage))
          || scenarioManifest.scenarios.find((scenario) => scenario.entry_id === scenarioManifest.default_entry_id)
          || scenarioManifest.scenarios[0];
        await loadScenario(entry);
        await showView((requestedEntryId || requestedScenarioId) ? 'course' : 'menu');
      } catch (error) {
        friendText.textContent = '這份練習資料載入失敗，先重新整理看看。';
        const hand = document.getElementById('responseHand');
        hand.innerHTML = '';
        hand.classList.add('is-hidden');
        document.getElementById('dialogueFeedback').textContent = error.message;
        document.getElementById('dialogueFeedback').classList.add('show');
        nextBtn.disabled = true;
      }
    }
    init();
  </script>
</body>
</html>
