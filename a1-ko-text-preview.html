<script id="content-data" type="application/json">[{"name":"Unit 1","range":"L1–L10","source":"https://github.com/stasischen/release-aggregator/blob/main/docs/tasks/LESSON_RUNNER_20261024/A1-u01_TEXT_PREVIEW.md","markdown":"# A1 第 1 單元（L1–L10）文字定稿前預覽\n\n- 流程：每課 Sol 寫、Sonnet 審（c1–c5）→ 單元總審 Sonnet 兩輪（R1 修了 L10 兩處角色事實；R2 approve）。\n- 這份只有韓文＋初版翻譯；斷詞、i18n 等 A1 文字全部完成後才做。\n- 看完覺得哪課要改，直接說課號和問題就好。\n\n## Sonnet R2 留下的 5 個建議（不擋，等你決定）\n\n1. **L10 第 3 段**：애니 在 L7 已經把筆還給마이클，L10 又說要還筆；L7 借的橡皮擦沒還，可改成 `지우개`。\n2. **L2**：本課文法提到 `저／나`，但對話只用 `저`；要不要加一個自然的 `나`。\n3. **L5 第 2 段**：유키 說「오사카에 살아요」又提到家鄉（單元規則：家鄉只在 L1–L2），可刪。\n4. **L9**：外貌只講身高（L5 已講過），本課目標要另一個特徵，例如「머리가 길어요」。\n5. **L7 第 3 段**：在文具店買東西，又走一次 L3 的付款流程，沒用到本課的請求說法；可改成借或請人幫忙拿文具。\n\n---\n\n\n## 第 1 課\n\n課程 ID：`ko.a1.l001`\n\n**本課目標**\n\n> 能用「問候＋名字＋國家＋職業」完整自我介紹，並和初次見面的人互相問候、確認身分。\n\n### 對話\n\n## D1\n地點與情境：週二 18:55，下雨的中心大門口\n這段要完成的事：소라照名單迎接新生，確認身分並第一次問候。\n소라: 안녕하세요? 혹시 천이쥔 씨예요?\n애니: 네, 맞아요. 애니라고 불러 주세요. 안녕하세요?\n소라: 반갑습니다, 애니 씨. 저는 한국어 선생님 소라예요. 비가 많이 와요.\n애니: 네, 비가 와요. 오늘 잘 부탁드려요!\n\n## D2\n地點與情境：週二晚間，教室裡的第一堂課\n這段要完成的事：輪流做完整自我介紹（名字、國家、職業）。\n소라: 여러분, 환영해요. 저는 한국어 선생님 소라예요. 한국 사람이에요. 유키 씨 먼저 인사해요.\n유키: 네. 안녕하세요? 저는 유키예요. 일본 사람이에요. 병원 간호사예요.\n소라: 반갑습니다, 유키 씨. 애니 씨는요?\n애니: 안녕하세요? 제 이름은 애니예요. 대만 사람이에요. 저는 회사원이에요.\n\n## D3\n地點與情境：下課後，地鐵站出口\n這段要完成的事：애니回想剛才認識的人，向유키核對，유키更正。\n애니: 오늘 수업 재미있었어요, 유키 씨.\n유키: 네, 저도요.\n애니: 그런데... 유키 씨는 회사원이에요?\n유키: 아니요, 저는 간호사예요.\n애니: 아, 맞아요! 유키 씨는 간호사예요. 제가 깜빡했어요.\n유키: 괜찮아요. 다음 주에 봐요!\n애니: 네, 다음 주에 봐요!\n\n## 本課要教的說法出現在哪\n- 追加對聽者的禮貌：片語/語尾＋요（ko.g.yo.addressee-politeness#c01）：D2 소라: 「애니 씨는요?」、D3 유키: 「네, 저도요.」\n- 述語通常在句末：（主語/話題）＋（賓語等成分）＋述語（ko.g.word-order.predicate-final#c01）：D1 소라: 「비가 많이 와요.」、D3 애니: 「오늘 수업 재미있었어요, 유키 씨.」、D3 유키: 「다음 주에 봐요!」\n- 名詞述語與身份指認：N이다/N이에요/예요/N입니다（ko.g.ida.identification#c01）：D1 소라: 「혹시 천이쥔 씨예요?」、D1 소라: 「저는 한국어 선생님 소라예요.」、D2 소라: 「저는 한국어 선생님 소라예요. 한국 사람이에요.」、D2 유키: 「저는 유키예요. 일본 사람이에요. 병원 간호사예요.」、D2 애니: 「제 이름은 애니예요. 대만 사람이에요. 저는 회사원이에요.」、D3 유키: 「저는 간호사예요.」\n- 話題引入：N은/는（ko.g.topic.aboutness#c01）：D1 소라: 「저는 한국어 선생님 소라예요.」、D2 소라: 「저는 한국어 선생님 소라예요.」、D2 유키: 「저는 유키예요.」、D2 애니: 「제 이름은 애니예요.」「저는 회사원이에요.」、D3 애니: 「유키 씨는 회사원이에요?」、D3 유키: 「저는 간호사예요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週二 18:55，下雨的中心大門口\n這段要完成的事：소라照名單迎接新生，確認身分並第一次問候。\n소라: 你好，請問是陳怡君小姐嗎？\n애니: 對，沒錯。叫我 Annie 就好。你好！\n소라: 很高興認識你，Annie。我是韓語老師 Sora。雨下得好大。\n애니: 對啊，在下雨呢。今天請多多指教！\n\n## D2\n地點與情境：週二晚間，教室裡的第一堂課\n這段要完成的事：輪流做完整自我介紹（名字、國家、職業）。\n소라: 歡迎大家。我是韓語老師 Sora，是韓國人。Yuki 先跟大家打個招呼吧。\n유키: 好的。大家好，我是 Yuki，是日本人，在醫院當護理師。\n소라: 很高興認識你，Yuki。那 Annie 呢？\n애니: 大家好，我的名字是 Annie，是台灣人。我是上班族。\n\n## D3\n地點與情境：下課後，地鐵站出口\n這段要完成的事：애니回想剛才認識的人，向유키核對，유키更正。\n애니: 今天的課很有趣耶，Yuki。\n유키: 對啊，我也覺得。\n애니: 不過……Yuki 是上班族嗎？\n유키: 不是耶，我是護理師。\n애니: 啊，對耶！Yuki 是護理師。我一時忘記了。\n유키: 沒關係，下週見囉！\n애니: 好，下週見！\n\n---\n\n## 第 2 課\n\n課程 ID：`ko.a1.l002`\n\n**本課目標**\n\n> 能問別人的名字、職業和嗜好（이름은／직업은／취미는 뭐예요？），說出自己的嗜好，並說明希望別人怎麼稱呼自己。\n\n### 對話\n\n## D1\n地點與情境：목요일 수업 전, 센터 안내 데스크.\n這段要完成的事：마이클의 이름과 직업을 적고 이름표를 만들어요.\n소라: 안녕하세요. 오늘 처음 오셨죠?\n마이클: 네, 지난 수업에는 못 왔어요.\n소라: 잘 오셨어요. 이름표를 만들게요. 이름이 뭐예요?\n마이클: 저는 마이클이에요.\n소라: 마이클 씨, 직업은 뭐예요?\n마이클: 대학원생이에요. 한국 역사를 공부해요.\n소라: 네, 여기 이름하고 직업을 적었어요. 이름표 받으세요.\n마이클: 감사합니다. 수업은 어디에서 해요?\n소라: 바로 옆 교실이에요. 같이 가요.\n\n## D2\n地點與情境：같은 날 수업 후, 센터 옆 카페.\n這段要完成的事：서로 어떻게 부르면 좋을지 이야기해요.\n마이클: 두 분은 어떻게 부르면 돼요?\n애니: 저는 애니라고 불러 주세요. 애니는 별명이에요.\n마이클: 아, 그래요? 그럼 애니 씨라고 부를게요.\n애니: 좋아요.\n유키: 저는 그냥 유키라고 불러 주세요.\n마이클: 네, 유키 씨. 저는 마이클이라고 불러 주세요.\n유키: 네, 마이클 씨. 오늘 수업 어땠어요?\n마이클: 조금 어려웠어요. 그래도 재미있었어요.\n애니: 다음 시간에도 우리 같이 앉아요.\n마이클: 좋아요!\n\n## D3\n地點與情境：쉬는 시간, 센터 밖 벤치.\n這段要完成的事：서로 취미를 묻고 함께 할 일을 정해요.\n애니: 마이클 씨는 쉬는 날에 뭐 해요?\n마이클: 주로 영화를 봐요.\n애니: 영화요? 자주 봐요?\n마이클: 네, 자주 봐요. 애니 씨는요?\n애니: 저는 음악 듣는 걸 좋아해요.\n마이클: 어떤 음악을 좋아해요?\n애니: 한국 노래를 많이 들어요. 유키 씨 취미는 뭐예요?\n유키: 저는 여행을 좋아해요. 주말에 가까운 곳에 자주 가요.\n마이클: 그럼 좋은 곳 좀 알려 주세요.\n유키: 같이 가요. 근처에 예쁜 공원이 있어요.\n애니: 좋아요. 거기서 같이 음악도 들어요.\n마이클: 네, 이번 주말에 가요!\n\n## 本課要教的說法出現在哪\n- 人稱與稱謂的社會選擇：저/나：D1「저는 마이클이에요.」\n- 人稱與稱謂的社會選擇：저/나：D2「저는 애니라고 불러 주세요. 애니는 별명이에요.」\n- 人稱與稱謂的社會選擇：저/나：D2「저는 그냥 유키라고 불러 주세요.」\n- 人稱與稱謂的社會選擇：저/나：D3「저는 여행을 좋아해요. 주말에 가까운 곳에 자주 가요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：목요일 수업 전, 센터 안내 데스크.\n這段要完成的事：마이클의 이름과 직업을 적고 이름표를 만들어요.\n소라: 你好，今天第一次來吧？\n마이클: 對，上次上課沒能來。\n소라: 歡迎！我來幫你做名牌。請問叫什麼名字？\n마이클: 我是麥克。\n소라: 麥克，你的職業是什麼？\n마이클: 我是研究生，在學韓國歷史。\n소라: 好的，這裡寫好名字和職業了，請拿名牌。\n마이클: 謝謝。在哪裡上課呢？\n소라: 就在隔壁教室，一起走吧。\n\n## D2\n地點與情境：같은 날 수업 후, 센터 옆 카페.\n這段要完成的事：서로 어떻게 부르면 좋을지 이야기해요.\n마이클: 兩位我該怎麼稱呼呢？\n애니: 叫我安妮就可以了，安妮是綽號。\n마이클: 啊，是嗎？那我叫你安妮。\n애니: 好啊。\n유키: 直接叫我由紀就可以了。\n마이클: 好的，由紀。叫我麥克就可以了。\n유키: 好的，麥克。今天上課覺得怎麼樣？\n마이클: 有點難，不過很有趣。\n애니: 下次上課我們也一起坐吧。\n마이클: 好啊！\n\n## D3\n地點與情境：쉬는 시간, 센터 밖 벤치.\n這段要完成的事：서로 취미를 묻고 함께 할 일을 정해요.\n애니: 麥克，你休假時都在做什麼？\n마이클: 大多在看電影。\n애니: 電影嗎？常看嗎？\n마이클: 對，常看。安妮呢？\n애니: 我喜歡聽音樂。\n마이클: 喜歡哪種音樂？\n애니: 常聽韓國歌。由紀，你的興趣是什麼？\n유키: 我喜歡旅行，週末常去近一點的地方。\n마이클: 那推薦一些好地方給我吧。\n유키: 一起去吧，附近有一座漂亮的公園。\n애니: 好啊，在那裡也一起聽音樂吧。\n마이클: 好，這週末去吧！\n\n---\n\n## 第 3 課\n\n課程 ID：`ko.a1.l003`\n\n**本課目標**\n\n> 能在店裡點東西、付款，並用「제가 ~ㄹ게요」說自己要做的事（我來付、我來拿）。\n\n### 對話\n\n## D1\n地點與情境：郵局，週六上午，애니第一次在韓國寄小包裹回台灣。\n這段要完成的事：說明包裹內容、填寫寄件資料、選寄法並付款。\n애니: 안녕하세요. 이 소포를 대만으로 보내고 싶어요.\n郵局職員: 네. 안에 뭐가 들어 있어요?\n애니: 옷이에요.\n郵局職員: 비행기로 보내실래요, 배로 보내실래요?\n애니: 배는 오래 걸려요?\n郵局職員: 네. 비행기가 더 빨라요.\n애니: 그럼 비행기로 보낼게요. 뭘 써야 해요?\n郵局職員: 여기 보내는 분과 받는 분의 이름, 주소, 전화번호를 써 주세요.\n애니: 네. 여기 다 썼어요.\n郵局職員: 네. 배송비는 이만 원이에요.\n애니: 카드로 할게요.\n郵局職員: 여기 카드를 대 주세요.\n애니: 여기요.\n郵局職員: 네, 결제됐어요. 영수증 여기 있어요.\n애니: 감사합니다.\n\n## D2\n地點與情境：中心旁的咖啡館，下課後，유키和마이클一起買飲料。\n這段要完成的事：點飲料並付款，約好下次換另一人請客。\n咖啡館店員: 어서 오세요. 뭐 드릴까요?\n유키: 따뜻한 라테 한 잔 주세요.\n마이클: 저는 아이스 아메리카노 한 잔 주세요.\n咖啡館店員: 드시고 가세요?\n유키: 네.\n咖啡館店員: 모두 팔천 원이에요.\n마이클: 제가 낼게요.\n유키: 고마워요. 다음에는 제가 살게요.\n마이클: 좋아요.\n咖啡館店員: 여기 카드를 대 주세요.\n마이클: 네.\n咖啡館店員: 결제됐어요. 잠시만 기다려 주세요.\n咖啡館店員: 주문하신 음료 나왔어요.\n유키: 제가 가져올게요.\n마이클: 그럼 저는 자리 잡을게요.\n\n## D3\n地點與情境：住宅大樓門口，晚上，도현看到애니搬著很重的箱子。\n這段要完成的事：도현幫애니把箱子拿上四樓，並邀她參加週六的語言交換活動。\n도현: 안녕하세요. 상자가 무거워 보여요. 제가 들어 드릴게요.\n애니: 감사합니다. 정말 무거워요.\n도현: 몇 층으로 가세요?\n애니: 4층이요. 저는 애니예요.\n도현: 저는 3층에 사는 도현이에요.\n애니: 반가워요. 제가 문 열게요.\n도현: 네. 토요일에 근처 센터에서 언어 교환 모임이 있어요. 같이 가실래요?\n애니: 좋아요. 몇 시예요?\n도현: 두 시예요. 한 시 반에 여기서 만나요.\n애니: 네, 그때 만나요.\n도현: 다 왔네요. 상자는 어디에 놓을까요?\n애니: 문 앞에 놓아 주세요.\n도현: 네, 여기 놓을게요.\n애니: 도와주셔서 감사합니다.\n\n## 本課要教的說法出現在哪\n\n- 非正式語尾的陳述：A-아/어/A-아/어요：D1「네. 비행기가 더 빨라요.」；D2「좋아요.」；D3「정말 무거워요.」\n- 向聽者表明意向：V-(으)ㄹ게(요)：D1「그럼 비행기로 보낼게요.」「카드로 할게요.」；D2「제가 낼게요.」「다음에는 제가 살게요.」「제가 가져올게요.」「그럼 저는 자리 잡을게요.」；D3「제가 들어 드릴게요.」「제가 문 열게요.」「네, 여기 놓을게요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：郵局，週六上午，애니第一次在韓國寄小包裹回台灣。\n這段要完成的事：說明包裹內容、填寫寄件資料、選寄法並付款。\n애니: 你好，我想把這個包裹寄到台灣。\n郵局職員: 好的，裡面裝了什麼呢？\n애니: 是衣服。\n郵局職員: 您要寄空運還是海運？\n애니: 海運要很久嗎？\n郵局職員: 是的，空運比較快。\n애니: 那我寄空運好了。要填寫什麼呢？\n郵局職員: 請在這裡填寫寄件人和收件人的姓名、地址和電話號碼。\n애니: 好的，我這裡都寫好了。\n郵局職員: 好的，運費是兩萬韓元。\n애니: 我刷卡。\n郵局職員: 請把卡片感應在這裡。\n애니: 給您。\n郵局職員: 好的，結帳完成了。收據給您。\n애니: 謝謝。\n\n## D2\n地點與情境：中心旁的咖啡館，下課後，유키和마이클一起買飲料。\n這段要完成的事：點飲料並付款，約好下次換另一人請客。\n咖啡館店員: 歡迎光臨，想要點什麼呢？\n유키: 請給我一杯熱拿鐵。\n마이클: 我要一杯冰美式咖啡。\n咖啡館店員: 內用嗎？\n유키: 對。\n咖啡館店員: 一共是八千韓元。\n마이클: 我來付吧。\n유키: 謝謝，下次換我請客。\n마이클: 好啊。\n咖啡館店員: 請把卡片感應在這裡。\n마이클: 好的。\n咖啡館店員: 結帳完成，請稍候。\n咖啡館店員: 您點的飲料好囉。\n유키: 我去拿。\n마이클: 那我去佔位子。\n\n## D3\n地點與情境：住宅大樓門口，晚上，도현看到애니搬著很重的箱子。\n這段要完成的事：도현幫애니把箱子拿上四樓，並邀她參加週六的語言交換活動。\n도현: 你好，箱子看起來很重呢，我幫你拿吧。\n애니: 謝謝，真的很重。\n도현: 你要到幾樓呢？\n애니: 4樓，我是安妮。\n도현: 我是住在3樓的道賢。\n애니: 很高興認識你，我來開門。\n도현: 好的。星期六附近的中心有語言交換聚會，要一起去嗎？\n애니: 好啊，幾點呢？\n도현: 兩點，一點半在這裡碰面吧。\n애니: 好，到時候見。\n도현: 到了，箱子要放在哪裡呢？\n애니: 請放在門前。\n도현: 好的，我放這裡囉。\n애니: 謝謝你的幫忙。\n\n---\n\n## 第 4 課\n\n課程 ID：`ko.a1.l004`\n\n**本課目標**\n\n> 能問對方會不會做某件事、做得好不好，用「~도」說自己也一樣，並用「잘해요／잘 못해요／조금 해요」回答。\n\n### 對話\n\n## D1\n地點與情境：토요일, 센터 언어 교환 모임.\n這段要完成的事：다음 모임에서 함께 먹을 음식과 음료를 준비하고 노래할 사람을 정해요.\n소라: 이분은 오늘 처음 오신 도현 씨예요. 다음 모임에는 같이 저녁을 먹어요.\n소라: 음식은 누가 만들까요?\n도현: 제가 만들게요.\n애니: 저는 요리를 잘 못해요. 음료를 준비할게요.\n유키: 저도 같이 준비할게요.\n소라: 좋아요. 도현 씨, 혼자 요리해도 괜찮아요?\n도현: 네, 괜찮아요.\n소라: 밥 먹고 노래도 부르면 좋겠어요. 누가 불러 줄래요?\n마이클: 제가 할게요. 노래를 잘 못하지만 좋아해요.\n소라: 좋아요. 그럼 다음 모임에 맛있는 음식도 먹고 노래도 들어요.\n\n## D2\n地點與情境：모임이 끝난 뒤, 도현이 일하는 밥집.\n這段要完成的事：애니가 도현에게 주먹밥 만드는 법을 배워요.\n애니: 다음에는 저도 음식을 만들고 싶어요. 쉬운 요리 좀 알려 주세요.\n도현: 그럼 주먹밥을 만들어 볼까요?\n애니: 좋아요. 저는 요리를 잘 못해요. 만두는 잘 만들어요.\n도현: 그럼 주먹밥도 쉽게 만들 수 있어요. 먼저 밥에 소금하고 참기름을 조금 넣으세요.\n애니: 이 정도요?\n도현: 네, 좋아요. 이제 잘 섞으세요.\n애니: 다 섞었어요. 다음에는요?\n도현: 밥을 조금씩 손에 놓고 동그랗게 만드세요.\n애니: 이렇게요?\n도현: 네, 잘하시네요. 이제 하나 먹어 보세요.\n애니: 맛있어요! 다음 모임에 주먹밥을 가져갈게요.\n\n## D3\n地點與情境：언어 교환 모임 중, 센터 휴게실에서 자판기 커피를 마셔요.\n這段要完成的事：서로 탁구를 치는지 물어보고 내일 함께 치러 가기로 해요.\n마이클: 커피가 뜨겁네요. 유키 씨, 내일 시간 있어요?\n유키: 네, 있어요. 왜요?\n마이클: 같이 탁구 치러 갈래요? 탁구 쳐요?\n유키: 네, 조금 해요. 마이클 씨도 쳐요?\n마이클: 네, 저도 조금 해요.\n유키: 잘 쳐요?\n마이클: 아니요, 잘 못해요. 그래도 재미있어요.\n유키: 좋아요. 내일 몇 시에 만나요?\n마이클: 두 시에 센터 앞에서 만나요.\n유키: 네, 좋아요.\n\n## 本課要教的說法出現在哪\n- 追加同類項：N도：D1「저도 같이 준비할게요.」；D3「마이클 씨도 쳐요?」\n- 非正式是非或疑問詞問句：V/A-아/어(요)?〔是非詢問〕：D1「도현 씨, 혼자 요리해도 괜찮아요?」；D3「탁구 쳐요?」\n- 動作對象：N을/를 V：D1「음료를 준비할게요.」；D2「밥을 조금씩 손에 놓고 동그랗게 만드세요.」\n- 熟練或表現良好：N을/를 잘하다/잘＋V：D1「저는 요리를 잘 못해요.」；D2「만두는 잘 만들어요.」；D3「잘 쳐요?」\n\n### 初版翻譯\n\n## D1\n地點與情境：토요일, 센터 언어 교환 모임.\n這段要完成的事：다음 모임에서 함께 먹을 음식과 음료를 준비하고 노래할 사람을 정해요.\n소라: 這位是今天第一次來的道賢。下次聚會大家一起吃晚餐吧。\n소라: 料理要由誰來做呢？\n도현: 我來做吧。\n애니: 我不太會做菜，我來準備飲料。\n유키: 我也一起準備。\n소라: 太好了。道賢，你一個人做沒問題嗎？\n도현: 嗯，沒問題。\n소라: 吃完飯如果能唱唱歌就太好了。有誰想唱嗎？\n마이클: 我來唱吧。我雖然唱得不好，但很喜歡唱。\n소라: 好啊。那下次聚會我們就吃好吃的料理、聽唱歌吧。\n\n## D2\n地點與情境：모임이 끝난 뒤, 도현이 일하는 밥집.\n這段要完成的事：애니가 도현에게 주먹밥 만드는 법을 배워요.\n애니: 下次我也想做料理。可以教我簡單的菜嗎？\n도현: 那我們來做做看飯糰？\n애니: 好啊。我不太會做菜，不過滿會包水餃的。\n도현: 那飯糰也能輕鬆做出來的。先在飯裡加一點鹽和香油。\n애니: 這樣的分量嗎？\n도현: 對，很好。現在把它拌勻。\n애니: 都拌好了。再來呢？\n도현: 把飯抓一點放在手上捏成圓形。\n애니: 像這樣嗎？\n도현: 對，捏得很漂亮呢。現在吃一個看看吧。\n애니: 好吃！下次聚會我帶飯糰去。\n\n## D3\n地點與情境：언어 교환 모임 중, 센터 휴게실에서 자판기 커피를 마셔요.\n這段要完成的事：서로 탁구를 치는지 물어보고 내일 함께 치러 가기로 해요.\n마이클: 咖啡好燙喔。由紀，你明天有空嗎？\n유키: 有啊，怎麼了？\n마이클: 要不要一起去打桌球？你會打桌球嗎？\n유키: 會，我會打一點點。麥可你也會打嗎？\n마이클: 會啊，我也會打一點點。\n유키: 打得好嗎？\n마이클: 沒有，打得不太好。不過滿好玩的。\n유키: 好啊。明天幾點見？\n마이클: 兩點在中心前面碰面吧。\n유키: 好啊，沒問題。\n\n---\n\n## 第 5 課\n\n課程 ID：`ko.a1.l005`\n\n**本課目標**\n\n> 能用量詞買幾樣東西（1–4 個），並用「~의」「~이/가 있어요」簡單介紹家人和人數。\n\n### 對話\n\n## D1\n地點與情境：社區市場的水果攤，週日下午\n這段要完成的事：為週六聚餐買水果：問有沒有、要幾個、多少錢，老闆多送一個。\n애니: 안녕하세요. 사과 있어요?\n水果攤老闆: 네, 있어요. 몇 개 드릴까요?\n애니: 사과 세 개 주세요. 마이클 씨, 귤도 사요?\n마이클: 네, 귤도 있어요? 귤 네 개 주세요.\n水果攤老闆: 사과 세 개, 귤 네 개요. 모두 팔천 원이에요.\n마이클: 네, 여기 있어요.\n水果攤老闆: 감사합니다. 사과 한 개 더 드려요!\n애니: 와, 정말요? 고맙습니다! 토요일 모임에서 먹어요.\n\n## D2\n地點與情境：地鐵車廂，週一早上，兩人坐著看手機\n這段要完成的事：互看手機照片，說明家人有無與人數。\n유키: 애니 씨, 이 사진 봐요.\n애니: 가족 사진이에요? 모두 몇 명이에요?\n유키: 네, 우리 가족이에요. 네 명이에요. 부모님하고 오빠, 저예요.\n애니: 오빠가 있어요?\n유키: 네, 오빠가 한 명 있어요. 오사카에 살아요. 애니 씨는요?\n애니: 저도 네 명이에요. 여동생이 한 명 있어요. 이름은 이안이에요.\n유키: 이안 씨 사진 있어요?\n애니: 네, 여기요. 이안은 대학생이에요. 키가 커요.\n유키: 우와, 정말 키가 커요! 애니 씨하고 많이 달라요!\n애니: 네, 제 동생이에요. 저는 키가 작은데…\n\n## D3\n地點與情境：밥집，晚餐時間，도현在廚房旁和애니說話\n這段要完成的事：도현看照片介紹누나，애니預告家人要來。\n도현: 애니 씨, 오늘은 뭐 먹어요?\n애니: 김치찌개 주세요. 어, 도현 씨, 그 사진은 뭐예요?\n도현: 우리 가족 사진이에요. 이분이 제 누나예요.\n애니: 누나가 있어요? 가족은 모두 몇 명이에요?\n도현: 네 명이에요. 부모님하고 누나, 저예요. 부모님하고 누나는 부산에 있어요.\n애니: 아, 부산이요. 제 가족은 곧 서울에 와요.\n도현: 정말요? 누가 와요?\n애니: 어머니하고 동생이 와요. 저까지 세 명이에요.\n도현: 그럼 여기에서 같이 저녁 먹어요. 자리를 예약해 줄게요.\n애니: 정말요? 고마워요, 도현 씨!\n\n## 本課要教的說法出現在哪\n- ko.g.ui.nominal-relation（의／所屬、關係）：D2「제 동생이에요」（제＝저의）、「우리 가족이에요」；D3「우리 가족 사진이에요」「제 누나예요」「제 가족은 곧 서울에 와요」\n- ko.g.itda.relational-have（있다）：D1「사과 있어요?」「귤도 있어요?」；D2「오빠가 있어요?」「오빠가 한 명 있어요」「여동생이 한 명 있어요」；D3「누나가 있어요?」「부산에 있어요」\n- ko.g.quantity.counter（개／명）：D1「사과 세 개」「귤 네 개」「사과 한 개 더」；D2「모두 몇 명이에요」「네 명이에요」「한 명」；D3「모두 몇 명이에요」「네 명이에요」「저까지 세 명이에요」\n\n### 初版翻譯\n\n## D1\n地點與情境：社區市場的水果攤，週日下午\n這段要完成的事：為週六聚餐買水果：問有沒有、要幾個、多少錢，老闆多送一個。\n애니: 你好，請問有蘋果嗎？\n水果攤老闆: 有的，要幾個呢？\n애니: 請給我三顆蘋果。麥可，你也要買橘子嗎？\n마이클: 好啊，這裡有橘子嗎？請給我四顆橘子。\n水果攤老闆: 三顆蘋果、四顆橘子，一共八千韓元。\n마이클: 好的，給您。\n水果攤老闆: 謝謝，再多送你一顆蘋果！\n애니: 哇，真的嗎？謝謝老闆！星期六聚會的時候吃。\n\n## D2\n地點與情境：地鐵車廂，週一早上，兩人坐著看手機\n這段要完成的事：互看手機照片，說明家人有無與人數。\n유키: 艾妮，你看這張照片。\n애니: 是全家福嗎？一共有幾個人？\n유키: 對，是我們家人。有四個人，爸媽、哥哥跟我。\n애니: 你有哥哥啊？\n유키: 對，有一個哥哥，住在大阪。艾妮你呢？\n애니: 我們家也是四個人。我有個妹妹，名字叫伊安。\n유키: 你有伊安的照片嗎？\n애니: 有，在這裡。伊安是大學生，個子很高。\n유키: 哇，真的好高喔！跟艾妮很不一樣呢！\n애니: 對啊，是我妹妹，不過我個子比較矮……\n\n## D3\n地點與情境：밥집，晚餐時間，도현在廚房旁和애니說話\n這段要完成的事：도현看照片介紹누나，애니預告家人要來。\n도현: 艾妮，今天吃什麼？\n애니: 請給我泡菜鍋。咦，道賢，那張照片是什麼？\n도현: 是我們家的全家福。這位是我姊姊。\n애니: 你有姊姊啊？家裡總共有幾個人？\n도현: 四個人，爸媽、姊姊跟我。爸媽和姊姊都在釜山。\n애니: 啊，釜山啊。我的家人很快就要來首爾了。\n도현: 真的嗎？誰要來？\n애니: 媽媽和妹妹會來，算上我一共三個人。\n도현: 那到時候一起來這裡吃晚餐吧，我幫你們留位子。\n애니: 真的嗎？謝謝你，道賢！\n\n---\n\n## 第 6 課\n\n課程 ID：`ko.a1.l006`\n\n**本課目標**\n\n> 能辨認自己帶來的一件常見物品，說明它是不是自己的，並簡短描述用途。\n\n### 對話\n\n## D1\n地點與情境：下班後，애니到地鐵站務室找忘在車上的包包。\n這段要完成的事：애니確認包包是自己的，領回失物。\n애니: 지하철에 가방을 두고 내렸어요.\n站務員: 무슨 색 가방이에요?\n애니: 검은색이에요.\n站務員: 이 가방이에요?\n애니: 아니요. 제 가방이 아니에요. 저 가방 같아요.\n站務員: 안에 뭐가 들어 있어요?\n애니: 파란 우산하고 사원증이 있어요.\n站務員: 네, 있네요. 사원증에 있는 분은 누구예요?\n애니: 저예요. 제 가방이에요.\n站務員: 확인됐어요. 여기 있어요.\n애니: 감사합니다!\n\n## D2\n地點與情境：上課前，소라和마이클在教室裡看到彼此帶來的辭典。\n這段要完成的事：兩人比較辭典的種類和用途。\n소라: 마이클 씨, 그 사전 좀 봐도 돼요?\n마이클: 네. 영어하고 한국어가 같이 있어요.\n소라: 아, 영한사전이네요.\n마이클: 네. 한국어 책을 읽을 때 봐요. 선생님 사전도 영한사전이에요?\n소라: 아니요. 이건 영한사전이 아니에요. 국어사전이에요.\n마이클: 영어는 없어요?\n소라: 네. 한국어로 뜻을 설명해요.\n마이클: 저한테는 좀 어려워요.\n소라: 그럼 지금은 그 사전이 더 편하겠네요.\n\n## D3\n地點與情境：晚上，도현在大樓門口把帶著的中文書拿給애니看。\n這段要完成的事：애니問清楚書的種類，兩人約好用書練習中文。\n도현: 애니 씨, 이 책 좀 보세요.\n애니: 무슨 책이에요?\n도현: 중국어 회화책이에요. 대만 여행 갈 때 쓰려고요.\n애니: 이건 뭐예요?\n도현: 음식 이름이에요. 사진도 있어서 샀어요.\n애니: 좋아요. 같이 읽어요.\n도현: 좋아요. 발음 좀 알려 주세요.\n애니: 네. 집에 가서 같이 봐요.\n\n## 本課要教的說法出現在哪\n- 뭐예요/무엇이에요?：D3，「이건 뭐예요?」\n- 누구예요?：D1，「사원증에 있는 분은 누구예요?」\n- 이/그/저＋N：D1，「이 가방이에요?」「저 가방 같아요.」；D2，「마이클 씨, 그 사전 좀 봐도 돼요?」；D3，「애니 씨, 이 책 좀 보세요.」\n- N이/가 아니에요：D1，「제 가방이 아니에요.」；D2，「이건 영한사전이 아니에요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：下班後，애니到地鐵站務室找忘在車上的包包。\n這段要完成的事：애니確認包包是自己的，領回失物。\n애니: 我把包包忘在地鐵上下車了。\n站務員: 是什麼顏色的包包？\n애니: 是黑色的。\n站務員: 是這個包包嗎？\n애니: 不是，這不是我的包包。好像是那個包包。\n站務員: 裡面裝了什麼？\n애니: 有一把藍色雨傘和員工證。\n站務員: 好的，確實有。員工證上的這位是誰？\n애니: 是我，這是我的包包。\n站務員: 確認無誤了，在這裡給您。\n애니: 謝謝！\n\n## D2\n地點與情境：上課前，소라和마이클在教室裡看到彼此帶來的辭典。\n這段要完成的事：兩人比較辭典的種類和用途。\n소라: 麥克，那本字典可以借我看一下嗎？\n마이클: 好啊，裡面英文和韓文都有。\n소라: 啊，是英韓字典呢。\n마이클: 對，我看韓文書的時候會看。老師的字典也是英韓字典嗎？\n소라: 不是，這本不是英韓字典，是國語辭典。\n마이클: 裡面沒有英文嗎？\n소라: 對，是用韓文解釋意思的。\n마이클: 對我來說有點太難了。\n소라: 那現在用那本字典會更合適呢。\n\n## D3\n地點與情境：晚上，도현在大樓門口把帶著的中文書拿給애니看。\n這段要完成的事：애니問清楚書的種類，兩人約好用書練習中文。\n도현: Annie，妳看一下這本書。\n애니: 是什麼書？\n도현: 是中文會話書，去台灣旅行時要用的。\n애니: 這個是什麼？\n도현: 是食物的名字，因為也有照片就買了。\n애니: 好啊，我們一起讀。\n도현: 太好了，發音再請妳教教我。\n애니: 好啊，回家後一起看。\n\n---\n\n## 第 7 課\n\n課程 ID：`ko.a1.l007`\n\n**本課目標**\n\n> 能向同輩借用一件熟悉的文具，理解允許或婉拒，並完成簡短交接。\n\n### 對話\n\n## D1\n地點與情境：토요일, 센터에서 언어 교환 활동을 하고 있어요.\n這段要完成的事：애니가 마이클에게 볼펜을 빌려 쓰고 돌려줘요.\n애니: 마이클 씨, 볼펜 좀 빌려 주세요.\n마이클: 네, 이거 쓰세요.\n애니: 고마워요. 잠깐만 쓸게요.\n마이클: 네, 천천히 쓰세요.\n애니: 다 썼어요. 여기요.\n마이클: 네, 고마워요.\n\n## D2\n地點與情境：카페에서 유키, 마이클과 같이 공부하고 있어요.\n這段要完成的事：애니가 유키에게 지우개를 빌리지 못해서 마이클에게 물어봐요.\n애니: 유키 씨, 지우개 좀 빌려 주세요.\n유키: 미안해요. 지금 쓰고 있어요.\n애니: 괜찮아요. 마이클 씨, 필통 있어요?\n마이클: 필통은 안 가져왔어요. 지우개는 있어요.\n애니: 그럼 지우개 좀 빌려 주세요.\n마이클: 네, 여기요.\n애니: 고마워요. 금방 돌려줄게요.\n\n## D3\n地點與情境：낮에 애니가 문구점에서 물건을 골라요.\n這段要完成的事：애니가 색종이와 풀, 다이어리 한 권을 사요.\n店員: 어서 오세요. 뭐 찾으세요?\n애니: 색종이하고 풀 주세요.\n店員: 색종이는 여기 있어요. 풀은 이거 드릴까요?\n애니: 네. 이 다이어리도 한 권 주세요.\n店員: 네, 같이 담아 드릴게요.\n애니: 카드로 할게요.\n店員: 여기에 카드를 꽂으세요.\n애니: 네.\n店員: 결제됐어요. 카드 빼세요.\n애니: 감사합니다.\n店員: 물건 여기 있어요. 안녕히 가세요.\n\n## 本課要教的說法出現在哪\n- V-(으)세요：D1「네, 이거 쓰세요.」「네, 천천히 쓰세요.」；D3「여기에 카드를 꽂으세요.」「결제됐어요. 카드 빼세요.」\n- V-아/어 주세요：D1「마이클 씨, 볼펜 좀 빌려 주세요.」；D2「유키 씨, 지우개 좀 빌려 주세요.」「그럼 지우개 좀 빌려 주세요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：토요일, 센터에서 언어 교환 활동을 하고 있어요.\n這段要完成的事：애니가 마이클에게 볼펜을 빌려 쓰고 돌려줘요.\n애니: 麥可，可以借我一下原子筆嗎？\n마이클: 好啊，用這支吧。\n애니: 謝謝，我用一下就好。\n마이클: 好，慢慢用。\n애니: 我用好了，還你。\n마이클: 好，謝謝。\n\n## D2\n地點與情境：카페에서 유키, 마이클과 같이 공부하고 있어요.\n這段要完成的事：애니가 유키에게 지우개를 빌리지 못해서 마이클에게 물어봐요.\n애니: 由紀，可以借我一下橡皮擦嗎？\n유키: 抱歉，我現在正在用。\n애니: 沒關係。麥可，你有鉛筆盒嗎？\n마이클: 鉛筆盒我沒帶，但有橡皮擦。\n애니: 那可以借我橡皮擦嗎？\n마이클: 好，給你。\n애니: 謝謝，我馬上還你。\n\n## D3\n地點與情境：낮에 애니가 문구점에서 물건을 골라요.\n這段要完成的事：애니가 색종이와 풀, 다이어리 한 권을 사요.\n店員: 歡迎光臨，想找什麼呢？\n애니: 我要色紙和膠水。\n店員: 色紙在這邊。膠水拿這款給您可以嗎？\n애니: 好。這本手帳也請給我一本。\n店員: 好的，幫您裝在一起。\n애니: 我用刷卡的。\n店員: 請把卡片插在這裡。\n애니: 好的。\n店員: 結帳完成了，請拔出卡片。\n애니: 謝謝。\n店員: 東西在這邊，慢走。\n\n---\n\n## 第 8 課\n\n課程 ID：`ko.a1.l008`\n\n**本課目標**\n\n> 能說出家中主要房間，並指出房間裡常見的家具或用品。\n\n### 對話\n\n## D1\n地點與情境：週日，애니和유키在家具店挑選家人來訪時要用的寢具。\n這段要完成的事：挑好母親和妹妹要用的棉被與枕頭。\n애니: 이불을 좀 봐요. 집에 이불이 하나만 있어요.\n유키: 어머니하고 동생은 어디에서 자요?\n애니: 작은 방에서 자요. 그 방에 침대가 없어요.\n유키: 그럼 이 두꺼운 이불은 어때요?\n애니: 좋아요. 부드러워요.\n유키: 베개도 필요해요?\n애니: 네. 집에 베개도 하나만 있어요.\n유키: 이 베개는 어때요? 높지 않아요.\n애니: 좋아요. 이불 두 개하고 베개 두 개 살게요.\n\n## D2\n地點與情境：晚上，도현和유키第一次到애니家參加喬遷小聚。\n這段要完成的事：帶朋友參觀房間，再回客廳一起吃東西。\n도현: 집이 아늑하네요. 구경 좀 해도 돼요?\n애니: 네. 이쪽이 제 방이에요.\n유키: 창문 옆에 책상이 있네요.\n애니: 네. 여기에서 공부해요. 옆은 작은 방이에요.\n도현: 가족분들은 이 방에서 주무세요?\n애니: 네. 오늘 산 이불도 여기 있어요.\n유키: 이불이 방하고 잘 어울려요.\n애니: 고마워요. 맞은편은 화장실이에요.\n도현: 그럼 잠깐 손 좀 씻을게요. 수건은 어디에 있어요?\n애니: 세면대 옆에 있어요.\n유키: 애니 씨, 이 주스는 어디에 둬요?\n애니: 부엌에 냉장고가 있어요. 거기에 넣어 주세요.\n도현: 손 다 씻었어요. 이제 거실에서 먹을까요?\n애니: 네. 소파 앞에 작은 탁자가 있어요. 거기에 음식을 놓아요.\n\n## 本課要教的說法出現在哪\n- 對象的存在與有無：D1「집에 이불이 하나만 있어요.」「그 방에 침대가 없어요.」；D2「부엌에 냉장고가 있어요.」\n- 靜態位置的格標記：D2「창문 옆에 책상이 있네요.」「세면대 옆에 있어요.」\n- 主語標記：D1「집에 베개도 하나만 있어요.」；D2「이불이 방하고 잘 어울려요.」「소파 앞에 작은 탁자가 있어요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週日，애니和유키在家具店挑選家人來訪時要用的寢具。\n這段要完成的事：挑好母親和妹妹要用的棉被與枕頭。\n애니: 來看看棉被吧。家裡只有一件棉被。\n유키: 媽媽和妹妹要睡哪裡？\n애니: 睡小房間。那間房間沒有床。\n유키: 那這件厚棉被怎麼樣？\n애니: 很好啊，摸起來很舒服。\n유키: 也需要枕頭嗎？\n애니: 對，家裡枕頭也只有一顆。\n유키: 這顆枕頭怎麼樣？不會太高。\n애니: 好啊，那我買兩件棉被和兩顆枕頭。\n\n## D2\n地點與情境：晚上，도현和유키第一次到애니家參加喬遷小聚。\n這段要完成的事：帶朋友參觀房間，再回客廳一起吃東西。\n도현: 家裡好溫馨喔。我可以參觀一下嗎？\n애니: 好啊，這邊是我的房間。\n유키: 窗戶旁邊有書桌耶。\n애니: 對，我在這裡看書。隔壁是小房間。\n도현: 家人睡這間房間嗎？\n애니: 對，今天買的棉被也在這裡。\n유키: 棉被跟房間很搭耶。\n애니: 謝謝。對面是洗手間。\n도현: 那我先去洗個手。毛巾放在哪裡？\n애니: 在洗手台旁邊。\n유키: 애니，這瓶果汁要放哪裡？\n애니: 廚房有冰箱，請幫我冰進去。\n도현: 我洗好手了。我們要去客廳吃嗎？\n애니: 好啊。沙發前面有張小茶几，把東西擺在那裡吧。\n\n---\n\n## 第 9 課\n\n課程 ID：`ko.a1.l009`\n\n**本課目標**\n\n> 能用已學的家人稱謂辨認人物，並用「키가 커요／작아요」或一項外貌特徵作簡單描述。\n\n### 對話\n\n## D1\n地點與情境：週二，教室裡，소라拿著週六語言交換活動的照片，讓大家猜照片裡的人。\n這段要完成的事：從背影猜出照片裡的도현。\n소라: 자, 다음 사진이에요. 뒷모습만 보고 맞혀 보세요.\n애니: 키가 커요. 마이클 씨예요?\n마이클: 저는 아니에요. 저는 사진 오른쪽에 있어요.\n유키: 도현 씨도 키가 커요. 도현 씨예요?\n소라: 맞아요. 이제 얼굴도 보세요.\n애니: 아, 도현 씨예요!\n\n## D2\n地點與情境：週五晚上，仁川機場入境大廳，애니和도현等妹妹與母親出來。\n這段要完成的事：辨認妹妹和母親，順利接到兩人。\n도현: 사람이 많네요. 동생이 보여요?\n애니: 네. 저기요! 제 여동생은 키가 커요.\n도현: 흰 셔츠 입은 분이에요?\n애니: 네. 옆에 계신 분이 저희 어머니예요.\n도현: 아, 두 분이 같이 오시네요.\n애니: 엄마! 이안! 여기예요!\n이안: 언니! 오래 기다렸어요?\n애니: 아니요. 이분은 도현 씨예요.\n도현: 안녕하세요. 반가워요.\n이안: 안녕하세요. 언니한테 얘기 많이 들었어요.\n어머니: 안녕하세요.\n도현: 짐 주세요. 제가 들게요.\n\n## D3\n地點與情境：週六，밥집的歡迎晚餐上，유키拿出家人照片。\n這段要完成的事：透過照片認識유키的家人，分清哥哥和丈夫。\n유키: 안녕하세요. 만나서 반가워요.\n어머니: 안녕하세요.\n이안: 안녕하세요. 아, 가족 사진이에요?\n유키: 네. 같이 볼래요?\n이안: 네. 유키 씨는 어디 있어요?\n유키: 여기요. 저는 키가 작아요.\n이안: 아, 여기요! 옆에 계신 분은 오빠예요?\n유키: 아니요, 제 남편이에요. 오빠는 여기 있어요.\n도현: 음식 나왔어요. 사진 더 보시고 따뜻할 때 드세요.\n이안: 감사합니다. 유키 씨, 사진 또 보여 주세요.\n유키: 네. 밥 먹고 같이 봐요.\n\n## 本課要教的說法出現在哪\n\n- 性質述語：N은/는 A-아/어요：D1，「도현 씨도 키가 커요.」\n- 性質述語：N은/는 A-아/어요：D2，「제 여동생은 키가 커요.」\n- 性質述語：N은/는 A-아/어요：D3，「저는 키가 작아요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週二，教室裡，소라拿著週六語言交換活動的照片，讓大家猜照片裡的人。\n這段要完成的事：從背影猜出照片裡的도현。\n소라: 來，這是下一張照片。只看背影猜猜看是誰吧。\n애니: 個子很高呢。是麥克嗎？\n마이클: 不是我喔。我在照片右邊。\n유키: 道賢個子也很高。是道賢嗎？\n소라: 沒錯。現在也看看正面吧。\n애니: 啊，是道賢！\n\n## D2\n地點與情境：週五晚上，仁川機場入境大廳，애니和도현等妹妹與母親出來。\n這段要完成的事：辨認妹妹和母親，順利接到兩人。\n도현: 人好多呢。看到妹妹了嗎？\n애니: 有，在那裡！我妹妹個子很高。\n도현: 是穿白襯衫的那位嗎？\n애니: 對。旁邊那位是我媽媽。\n도현: 啊，兩位一起走過來了呢。\n애니: 媽！伊安！這裡！\n이안: 姊！等很久了嗎？\n애니: 沒有。這位是道賢。\n도현: 你們好。很高興認識你們。\n이안: 你好。常聽姊姊提起你。\n어머니: 你好。\n도현: 行李給我吧。我來拿就好。\n\n## D3\n地點與情境：週六，밥집的歡迎晚餐上，유키拿出家人照片。\n這段要完成的事：透過照片認識유키的家人，分清哥哥和丈夫。\n유키: 你們好。很高興見到你們。\n어머니: 你好。\n이안: 你好。啊，這是全家福嗎？\n유키: 對啊。要一起看嗎？\n이안: 好啊。Yuki你在哪裡？\n유키: 這裡。我個子比較矮。\n이안: 啊，在這裡！旁邊那位是哥哥嗎？\n유키: 不是，是我先生。哥哥在這裡。\n도현: 菜來了。大家看完照片趁熱吃吧。\n이안: 謝謝。Yuki，待會兒再借我看照片喔。\n유키: 好啊。吃完飯再一起看。\n\n---\n\n## 第 10 課\n\n課程 ID：`ko.a1.l010`\n\n**本課目標**\n\n> 能看簡單平面圖，用方位詞詢問熟悉地點在哪裡並確認位置。\n\n### 對話\n\n## D1\n地點與情境：週日上午，이안和애니在十字路口看社區地圖看板，準備去公園散步。\n這段要完成的事：用地圖確認公園的位置和走法。\n이안: 언니, 공원은 어디에 있어요?\n애니: 여기 봐요. 공원은 도서관 옆에 있어요.\n이안: 우리는 지금 어디에 있어요?\n애니: 여기요. 이 사거리예요.\n이안: 그럼 앞으로 쭉 가요?\n애니: 네. 도서관 앞에서 오른쪽으로 가요.\n이안: 공원 입구가 여기예요?\n애니: 네, 맞아요. 같이 가요.\n\n## D2\n地點與情境：家人剛抵達애니家的第一天，어머니在找包包，이안和애니看房屋平面圖確認位置。\n這段要完成的事：看平面圖找到放在小房間的包包。\n이안: 언니, 엄마 가방은 어디에 있어요?\n애니: 작은방에 있어요.\n이안: 작은방은 어디에 있어요?\n애니: 이 그림을 봐요. 여기가 거실이에요. 작은방은 거실 오른쪽에 있어요.\n이안: 화장실 옆이에요?\n애니: 네. 가방은 작은방 문 옆에 있어요.\n이안: 이 문 옆이요?\n애니: 네, 맞아요.\n이안: 아, 저 방이요. 제가 가져올게요.\n애니: 네, 부탁해요.\n이안: 찾았어요! 엄마, 여기요.\n\n## D3\n地點與情境：晚上，全員在밥집吃送別晚餐，入座時도현替大家把包包收進櫃子；飯後，도현拿出附有社區地圖的〈동네 안내〉傳單。\n這段要完成的事：回顧相處的經歷、在地圖上標記下次來訪的位置，歸還借筆並拍合照道別。\n소라: 어머니, 안녕하세요. 여기 앉으세요.\n어머니: 안녕하세요.\n유키: 이안 씨, 애니 씨 집에서 잘 지냈어요?\n이안: 네. 작은방이 좋았어요.\n도현: 이 동네 지도 가져가세요. 다음에 또 오세요.\n이안: 네, 지도에 표시할게요. 도서관은 어디에 있어요?\n도현: 도서관은 여기예요. 밥집은 공원 맞은편에 있어요.\n이안: 여기 동그라미 할게요. 다음에는 제가 찾을게요.\n애니: 아, 마이클 씨한테 펜을 돌려줘야 해요. 도현 씨, 제 가방은 어디에 있어요?\n도현: 가방은 저쪽 장 안에 있어요. 제가 꺼내 드릴게요.\n유키: 전에 지하철에 두고 내린 가방이죠? 오늘은 꼭 챙겨요.\n애니: 네, 고마워요. 마이클 씨, 가방 안에 펜이 있었어요.\n마이클: 아, 제 펜이네요. 고마워요.\n소라: 그럼 다 같이 사진 찍어요.\n도현: 휴대폰을 저 책상에 놓을게요. 타이머를 맞췄어요. 다 같이 찍을 수 있어요.\n유키: 저는 키가 작아서 앞에 설게요.\n마이클: 그럼 저는 이안 씨랑 뒤에 설게요. 둘 다 키가 커요.\n이안: 네. 언니, 엄마랑 앞에 서요.\n소라: 어머니, 여기 보세요.\n도현: 자, 찍어요. 하나, 둘, 셋!\n이안: 모두 고마워요. 또 만나요!\n\n## 本課要教的說法出現在哪\n\n- 已知對象的所在：N은/는 場所에 있다：D1「공원은 도서관 옆에 있어요.」；D2「작은방은 거실 오른쪽에 있어요.」「가방은 작은방 문 옆에 있어요.」；D3「밥집은 공원 맞은편에 있어요.」「가방은 저쪽 장 안에 있어요.」\n- 已知對象的所在：N은/는 어디에 있어요?：D1「언니, 공원은 어디에 있어요?」；D2「언니, 엄마 가방은 어디에 있어요?」「작은방은 어디에 있어요?」；D3「도서관은 어디에 있어요?」「도현 씨, 제 가방은 어디에 있어요?」\n\n### 初版翻譯\n\n## D1\n地點與情境：週日上午，이안和애니在十字路口看社區地圖看板，準備去公園散步。\n這段要完成的事：用地圖確認公園的位置和走法。\n이안: 姊姊，公園在哪裡？\n애니: 看這裡。公園在圖書館旁邊。\n이안: 我們現在在哪裡？\n애니: 這裡，在這個十字路口。\n이안: 那一直往前走嗎？\n애니: 對。在圖書館前面往右走。\n이안: 公園入口是在這裡嗎？\n애니: 對，沒錯。一起走吧。\n\n## D2\n地點與情境：家人剛抵達애니家的第一天，어머니在找包包，이안和애니看房屋平面圖確認位置。\n這段要完成的事：看平面圖找到放在小房間的包包。\n이안: 姊姊，媽媽的包包在哪裡？\n애니: 在小房間裡。\n이안: 小房間在哪裡？\n애니: 看這張圖。這裡是客廳，小房間在客廳右邊。\n이안: 在廁所旁邊嗎？\n애니: 對。包包在小房間門旁邊。\n이안: 這個門旁邊嗎？\n애니: 對，沒錯。\n이안: 啊，那間房間啊。我去拿過來。\n애니: 好，麻煩你了。\n이안: 找到了！媽媽，給妳。\n\n## D3\n地點與情境：晚上，全員在밥집吃送別晚餐，入座時도현替大家把包包收進櫃子；飯後，도현拿出附有社區地圖的〈동네 안내〉傳單。\n這段要完成的事：回顧相處的經歷、在地圖上標記下次來訪的位置，歸還借筆並拍合照道別。\n소라: 伯母好，請坐這裡。\n어머니: 你好。\n유키: 이안，在애니家住得還好嗎？\n이안: 嗯，小房間很舒服。\n도현: 這張社區地圖請帶回去，下次再來玩喔。\n이안: 好，我在地圖上做記號。圖書館在哪裡？\n도현: 圖書館在這裡。餐廳在公園對面。\n이안: 我在這裡畫個圈。下次換我來找路。\n애니: 啊，要把筆還給마이클。도현，我的包包在哪裡？\n도현: 包包在那邊的櫃子裡，我幫妳拿出來。\n유키: 是之前忘在捷運上的那個包包吧？今天一定要拿好喔。\n애니: 好，謝謝。마이클，筆在包包裡。\n마이클: 啊，是我的筆沒錯，謝謝。\n소라: 那大家一起拍張照吧。\n도현: 我把手機放在那張桌子上。設定好定時了，大家可以一起拍。\n유키: 我個子比較矮，我站前面。\n마이클: 那我和이안站後面，我們兩個都比較高。\n이안: 好。姊姊，妳跟媽媽站前面。\n소라: 伯母，看這裡喔。\n도현: 來，要拍囉。一、二、三！\n이안: 謝謝大家，下次再見！\n\n---\n"},{"name":"Unit 2","range":"L11–L20","source":"https://github.com/stasischen/release-aggregator/blob/main/docs/tasks/LESSON_RUNNER_20261024/A1-u02_TEXT_PREVIEW.md","markdown":"# A1 第 2 單元（L11–L20）文字定稿前預覽\n\n- 流程：每課 Sol 寫、Sonnet 審（c1–c5）→ 單元總審 Sonnet 兩輪（R1 修了 L13–L15 三處時間矛盾；R2 approve）。\n- 這份只有韓文＋初版翻譯；斷詞、i18n 等 A1 文字全部完成後才做。\n- 看完覺得哪課要改，直接說課號和問題就好。\n\n## Sonnet R2 留下的 3 個建議（不擋，等你決定）\n\n1. **L11 第 3 段**：도현說「내일 점심에 김밥집에서 밥 먹고…」，但 L13 他說午餐時間最忙、L15 他的休息是 15:00–17:00。可改成「내일 오후에」。\n2. **L11 第 1、3 段**：兩段都是寫設施介紹、都說郵局在銀行旁邊、中心對面，重複。第 3 段可換成藥局或便利商店。\n3. **L20 第 1 段**：소라說「매운 건 빼고요」，但 L16 定的是不加小黃瓜的鮪魚飯捲。可改成「오이는 빼고요」。\n\n---\n\n\n## 第 11 課\n\n課程 ID：`ko.a1.l011`\n\n**本課目標**\n\n> 能介紹住家附近的常見地點，並說明地點在哪裡。\n\n### 對話\n\n## D1\n地點與情境：마포 다문화센터 1층 생활 정보 코너, 화요일 수업 전\n這段要完成的事：친구들이 보고 찾아갈 수 있게 주변 시설과 센터 활동 장소를 안내지에 적어요.\n소라: 친구들한테 줄 안내지를 만들고 있어요. 근처 우체국이 어디에 있어요?\n애니: 은행 옆에 있어요. 저는 거기에서 소포를 보내요.\n소라: 그 은행은 어디에 있어요?\n애니: 센터 맞은편에 있어요.\n유키: 도서관도 적을까요? 공원 옆에 있어요.\n소라: 좋아요. 도서관은 공원 옆, 우체국은 은행 옆이에요.\n유키: 선생님, 토요일 언어 교환은 어디에서 해요?\n소라: 센터 2층 교실에서 해요. 그것도 아래에 적을게요.\n애니: 네, 이 안내지를 보면 찾기 쉽겠어요.\n\n## D2\n地點與情境：마포 구립 도서관 열람실, 토요일 오후\n這段要完成的事：다음 독서 모임 장소를 정하고 혼자 책을 읽을 자리도 확인해요.\n마이클: 다음 독서 모임도 여기에서 해요?\n애니: 여기에서는 조용히 책을 읽어요. 모임은 2층 모임방에서 해요.\n마이클: 모임방은 어디에 있어요?\n애니: 계단 옆에 있어요. 거기에서는 이야기해도 돼요.\n마이클: 좋아요. 다음 모임은 거기에서 해요.\n애니: 네. 제가 모임방을 예약할게요.\n마이클: 고마워요. 저는 오늘 책을 좀 읽고 갈게요.\n애니: 그럼 여기에서 읽어요. 저 창가에 자리가 있어요.\n마이클: 좋아요. 저기 앉아요.\n\n## D3\n地點與情境：아파트 1층 게시판 앞, 일요일 저녁\n這段要完成的事：게시판에 붙일 주변 시설 안내를 정리하고 각자 갈 곳을 정해요.\n애니: 도현 씨, 근처 가게 안내를 쓰고 있어요. 빵집은 어디에 있어요?\n도현: 아파트 정문 바로 앞에 있어요. 저는 거기에서 빵을 자주 사요.\n애니: 그럼 내일 아침에 가야겠어요. 식당도 하나 적고 싶어요.\n도현: 공원 입구에 김밥집이 있어요. 거기에서 간단히 밥 먹기 좋아요.\n애니: 좋아요. 빵집하고 김밥집도 적을게요.\n도현: 저는 내일 소포를 보내야 하는데, 우체국도 이 근처에 있어요?\n애니: 네, 다문화센터 맞은편 은행 옆에 있어요.\n도현: 가깝네요. 내일 점심에 김밥집에서 밥 먹고 우체국에 가야겠어요.\n애니: 다 썼어요. 이 안내지는 여기 붙일게요.\n\n## 本課要教的說法出現在哪\n\n- 活動發生場所：場所에서 V：D1，애니「저는 거기에서 소포를 보내요.」\n- 活動發生場所：場所에서 V：D1，소라「센터 2층 교실에서 해요.」\n- 活動發生場所：場所에서 V：D2，애니「여기에서는 조용히 책을 읽어요.」\n- 活動發生場所：場所에서 V：D2，애니「모임은 2층 모임방에서 해요.」\n- 活動發生場所：場所에서 V：D3，도현「저는 거기에서 빵을 자주 사요.」\n- 活動發生場所：場所에서 V：D3，도현「내일 점심에 김밥집에서 밥 먹고 우체국에 가야겠어요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：마포 다문화센터 1층 생활 정보 코너, 화요일 수업 전\n這段要完成的事：친구들이 보고 찾아갈 수 있게 주변 시설과 센터 활동 장소를 안내지에 적어요.\n소라: 我在做要給朋友們看的指南。這附近的郵局在哪裡？\n애니: 在銀行旁邊。我都在那裡寄包裹。\n소라: 那家銀行在哪裡？\n애니: 在中心對面。\n유키: 圖書館也要寫進去嗎？就在公園旁邊。\n소라: 好啊。圖書館在公園旁邊，郵局在銀行旁邊。\n유키: 老師，週六的語言交換在哪裡辦？\n소라: 在中心二樓的教室。我也把那個寫在下面。\n애니: 好，看這份指南的話應該很好找。\n\n## D2\n地點與情境：마포 구립 도서관 열람실, 토요일 오후\n這段要完成的事：다음 독서 모임 장소를 정하고 혼자 책을 읽을 자리도 확인해요.\n마이클: 下次讀書會也在這裡辦嗎？\n애니: 這裡是要安靜看書的地方。聚會是在二樓的討論室。\n마이클: 討論室在哪裡？\n애니: 在樓梯旁邊。在那裡就可以說話。\n마이클: 好啊。下次聚會就在那裡辦。\n애니: 好，那我來預約討論室。\n마이클: 謝謝。我今天想先看點書再走。\n애니: 那就在這裡看吧。那邊靠窗有位子。\n마이클: 好啊。坐那裡吧。\n\n## D3\n地點與情境：아파트 1층 게시판 앞, 일요일 저녁\n這段要完成的事：게시판에 붙일 주변 시설 안내를 정리하고 각자 갈 곳을 정해요.\n애니: 道賢，我在寫附近店家的介紹。麵包店在哪裡？\n도현: 就在公寓正門正前方。我常在那裡買麵包。\n애니: 那我明天早上得去一趟。我也想寫一家餐廳進去。\n도현: 公園門口有一家飯捲店。在那裡簡單吃個飯很不錯。\n애니: 好啊。那我把麵包店和飯捲店也寫進去。\n도현: 我明天要寄包裹，這附近也有郵局嗎？\n애니: 有，在多元文化中心對面銀行的旁邊。\n도현: 蠻近的呢。明天中午在飯捲店吃過飯後再去郵局好了。\n애니: 寫好了。這張介紹就貼在這裡吧。\n\n---\n\n## 第 12 課\n\n課程 ID：`ko.a1.l012`\n\n**本課目標**\n\n> 能用虛構資料回答「어디에 살아요?」，說明自己住在哪個國家、城市或行政區，並辨認地址中的行政區欄位。\n\n### 對話\n\n## D1\n地點與情境：週四上課前，麻浦多文化中心活動報到桌，三人用主辦方提供的虛構人物資料填卡。\n這段要完成的事：完成報到卡，確認居住地的國家、城市與行政區欄位。\n소라: 이건 연습용 카드예요. 여기 있는 사람의 정보로 써 주세요.\n애니: 사는 곳은 어디에 써요?\n소라: 이쪽에 써요. 카드에 나온 사람은 어디에 살아요?\n애니: 한국에 살아요. 서울 마포구에 살아요.\n소라: 그럼 ‘국가’에는 ‘한국’, ‘도시’에는 ‘서울’을 써 주세요.\n마이클: ‘구’에는 ‘마포구’를 써요?\n소라: 네, 맞아요.\n애니: 다 썼어요. 여기 있어요.\n소라: 네, 잘 쓰셨어요. 이 카드로 접수할게요.\n\n## D2\n地點與情境：週六語言交換活動期間，中心教室，애니與유키整理虛構地址卡。\n這段要完成的事：辨認三張地址卡的行政區，放進對應的報到資料夾。\n애니: 이 주소 카드들을 구별로 나눠요.\n유키: 네. 첫 번째는 ‘서울특별시 마포구’예요.\n애니: 그건 마포구 폴더에 넣어요.\n유키: 두 번째는 ‘서울특별시 서대문구’예요. 서대문구 폴더는 어디 있어요?\n애니: 제 옆에 있어요. 주세요.\n유키: 여기요. 마지막 카드는 종로구예요.\n애니: 그 폴더는 유키 씨 앞에 있어요.\n유키: 네, 넣었어요. 이제 다 됐어요.\n\n## D3\n地點與情境：活動開始前，區民活動中心入口，마이클與소라核對虛構參加者卡。\n這段要完成的事：依卡片上的居住行政區完成活動分組登記。\n마이클: 이 카드로 왔어요. 어느 조예요?\n소라: 사는 구에 따라 조가 달라요. 카드에 나온 사람은 어디에 살아요?\n마이클: 서울 서대문구에 살아요.\n소라: 그럼 2조예요. 잠깐만요, 여기 명단에는 마포구로 되어 있네요.\n마이클: 카드에는 서대문구예요. 여기 보세요.\n소라: 아, 제가 잘못 썼네요. 서대문구로 고칠게요.\n마이클: 그럼 2조로 가요?\n소라: 네, 2조로 등록했어요. 이 명찰을 달고 들어가세요.\n마이클: 네, 고마워요.\n\n## 本課要教的說法出現在哪\n- 어디에 살아요?：D1、D3，소라「카드에 나온 사람은 어디에 살아요?」\n- ～에 살아요：D1，애니「한국에 살아요. 서울 마포구에 살아요.」；D3，마이클「서울 서대문구에 살아요.」\n- 行政區欄位確認：D1，마이클「‘구’에는 ‘마포구’를 써요?」\n\n### 初版翻譯\n\n## D1\n地點與情境：週四上課前，麻浦多文化中心活動報到桌，三人用主辦方提供的虛構人物資料填卡。\n這段要完成的事：完成報到卡，確認居住地的國家、城市與行政區欄位。\n소라: 這是練習用的卡片，請依照上面這個人的資料填寫。\n애니: 居住地要寫在哪裡？\n소라: 寫在這邊。卡片上的這個人住在哪裡？\n애니: 住在韓國，住在首爾麻浦區。\n소라: 那麼「國家」請填「韓國」，「城市」請填「首爾」。\n마이클: 「區」要寫「麻浦區」嗎？\n소라: 是的，沒錯。\n애니: 我寫好了，給您。\n소라: 好的，寫得很完整。我就用這張卡片幫您辦理報到。\n\n## D2\n地點與情境：週六語言交換活動期間，中心教室，애니與유키整理虛構地址卡。\n這段要完成的事：辨認三張地址卡的行政區，放進對應的報到資料夾。\n애니: 我們把這些地址卡按各區分類吧。\n유키: 好的。第一張是「首爾特別市麻浦區」。\n애니: 那張放進麻浦區的資料夾。\n유키: 第二張是「首爾特別市西大門區」。西大門區的資料夾在哪裡？\n애니: 在我旁邊，給我吧。\n유키: 給妳。最後一張卡片是鍾路區。\n애니: 那個資料夾就在由紀妳前面。\n유키: 好的，放進去了。這樣就都整理好了。\n\n## D3\n地點與情境：活動開始前，區民活動中心入口，마이클與소라核對虛構參加者卡。\n這段要完成的事：依卡片上的居住行政區完成活動分組登記。\n마이클: 我拿這張卡片來報到，請問是哪一組呢？\n소라: 是依照居住的行政區分組的。卡片上的這個人住在哪裡？\n마이클: 住在首爾西大門區。\n소라: 那就是第 2 組。等一下喔，這份名單上寫的是麻浦區呢。\n마이클: 卡片上寫的是西大門區，您看這裡。\n소라: 啊，是我寫錯了。我幫您改成西大門區。\n마이클: 那我就去第 2 組囉？\n소라: 是的，已經幫您登記在第 2 組了。請別上這個名牌進去吧。\n마이클: 好的，謝謝。\n\n---\n\n## 第 13 課\n\n課程 ID：`ko.a1.l013`\n\n**本課目標**\n\n> 能說明自己早上、下午或晚上通常做什麼，也能詢問別人的日常時段安排。\n\n### 對話\n\n## D1\n地點與情境：週一早上，애니和유키在地鐵車廂裡討論準備讀書會資料的時間。\n這段要完成的事：比對平常的早晚安排，約好兩人都有空的準備時段。\n애니: 독서 모임 자료, 언제 같이 준비해요?\n유키: 아침에 시간 있어요?\n애니: 일곱 시에 일어나요. 보통 여덟 시 반에 회사에 가요.\n유키: 저도 아침에는 바빠요. 저녁에는 보통 뭐 해요?\n애니: 집에서 밥을 먹어요. 조금 쉬어요.\n유키: 저도 저녁에는 집에서 쉬어요. 수요일 저녁은 어때요?\n애니: 좋아요. 수요일 저녁은 괜찮아요.\n유키: 좋아요. 그럼 수요일 저녁 여덟 시에 같이 준비해요.\n\n## D2\n地點與情境：週二上課前，마이클和애니在麻浦多文化中心休息區聊平常的讀書安排。\n這段要完成的事：找到共同方便的時段，約定上課前一起複習。\n마이클: 애니 씨는 보통 언제 공부해요?\n애니: 저녁에 해요. 아침에는 출근 준비를 해요.\n마이클: 저는 오후에 공부해요. 수업 후에는 좀 쉬어요.\n애니: 수업 전에 같이 복습해요. 어때요?\n마이클: 좋아요. 보통 몇 시에 센터에 와요?\n애니: 여섯 시 반에 와요.\n마이클: 저도 그때 와요. 그럼 수업 전에 여기서 만나요.\n애니: 네. 같이 삼십 분씩 복습해요.\n\n## D3\n地點與情境：週四下午，도현和소라在밥집備餐區協調週六活動的準備工作。\n這段要完成的事：配合兩人平常的工作時段，分配活動資料和飲料的準備工作。\n소라: 토요일 활동에 쓸 자료하고 음료가 필요해요. 도현 씨는 보통 언제 바빠요?\n도현: 아침 아홉 시부터 재료를 준비해요. 점심에는 음식을 많이 만들어서 바빠요.\n소라: 오후에는 좀 괜찮아요?\n도현: 네, 세 시쯤에는 여유가 있어요. 선생님은 보통 언제 활동 준비를 하세요?\n소라: 저는 오후에 자료를 만들어요. 저녁에는 수업이 있고요.\n도현: 그럼 음료는 제가 준비할게요. 내일 오후에 사러 가면 돼요.\n소라: 좋아요. 저는 내일 오후에 자료를 인쇄할게요.\n도현: 음료는 토요일 아침에 센터에 가져갈게요.\n소라: 네. 저는 먼저 가서 자료를 나눠 놓을게요.\n\n## 本課要教的說法出現在哪\n\n- 事件時間點：時間N에 V：D1「일곱 시에 일어나요.」；D2「여섯 시 반에 와요.」\n- 非正式是非或疑問詞問句：疑問詞＋…＋V/A-아/어(요)?：D1「저녁에는 보통 뭐 해요?」；D2「애니 씨는 보통 언제 공부해요?」\n- 移動終點：場所N에 가다/오다/도착하다：D1「보통 여덟 시 반에 회사에 가요.」；D2「보통 몇 시에 센터에 와요?」\n- 非正式語尾的陳述：V-아/어/V-아/어요：D1「집에서 밥을 먹어요.」；D3「저는 오후에 자료를 만들어요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週一早上，애니和유키在地鐵車廂裡討論準備讀書會資料的時間。\n這段要完成的事：比對平常的早晚安排，約好兩人都有空的準備時段。\n애니: 讀書會的資料，我們什麼時候一起準備？\n유키: 早上有空嗎？\n애니: 我七點起床，通常八點半去公司上班。\n유키: 我早上也很忙。晚上通常在做什麼？\n애니: 在家吃飯，稍微休息一下。\n유키: 我晚上也是在家休息。週三晚上怎麼樣？\n애니: 好啊，週三晚上可以。\n유키: 太好了，那我們週三晚上八點一起準備吧。\n\n## D2\n地點與情境：週二上課前，마이클和애니在麻浦多文化中心休息區聊平常的讀書安排。\n這段要完成的事：找到共同方便的時段，約定上課前一起複習。\n마이클: 애니你通常都什麼時候念書？\n애니: 晚上念。早上要準備出門上班。\n마이클: 我是在下午念書，下課後會休息一下。\n애니: 上課前一起複習怎麼樣？\n마이클: 好啊。妳通常幾點到中心？\n애니: 六點半到。\n마이클: 我也是那時候到。那我們上課前在這裡碰面吧。\n애니: 好，我們一起複習三十分鐘。\n\n## D3\n地點與情境：週四下午，도현和소라在밥집備餐區協調週六活動的準備工作。\n這段要完成的事：配合兩人平常的工作時段，分配活動資料和飲料的準備工作。\n소라: 週六活動要用的資料和飲料需要準備。도현你平時什麼時候比較忙？\n도현: 早上九點開始備料，中午要做好多餐點所以很忙。\n소라: 下午會稍微好一點嗎？\n도현: 會，三點左右比較有空。老師平常都什麼時候準備活動呢？\n소라: 我下午會做資料，晚上則有課。\n도현: 那飲料我來準備，明天下午去買就可以了。\n소라: 好，那我明天下午印資料。\n도현: 飲料我週六早上帶去中心。\n소라: 好，我會先去把資料分好擺好。\n\n---\n\n## 第 14 課\n\n課程 ID：`ko.a1.l014`\n\n**本課目標**\n\n> 能詢問約好的時間，依時鐘圖說出一至十二點整或半點。\n\n### 對話\n\n## D1\n地點與情境：週四上課前，소라、애니、마이클在麻浦多文化中心教室看活動室的時鐘圖。\n這段要完成的事：確認讀書會的開始時間，約好提前集合。\n애니: 선생님, 독서 모임은 몇 시예요?\n소라: 여기 시계 그림을 보세요. 오후 여섯 시 삼십 분이에요.\n마이클: 여섯 시 반이에요?\n소라: 네. 여섯 시 이십 분쯤 활동실로 오세요.\n애니: 네. 책도 가져와요?\n소라: 네, 책도 가져오세요.\n마이클: 좋아요. 그때 봬요.\n\n## D2\n地點與情境：週六下午，애니和유키在中心旁咖啡館看語言交換活動卡上的時鐘圖。\n這段要完成的事：確認活動集合時間，決定何時一起從咖啡館出發。\n유키: 애니 씨, 카드 좀 봐요. 모이는 시간이 몇 시예요?\n애니: 시계 그림이 있어요. 오후 세 시예요.\n유키: 지금은 두 시 반이에요. 커피 마실 시간 있어요.\n애니: 네. 두 시 오십 분쯤 나가요?\n유키: 좋아요. 같이 가요.\n\n## D3\n地點與情境：週日上午，애니和도현在住宅大樓大廳對照時鐘與社區活動卡。\n這段要完成的事：確認社區活動時間，約好出發前在大廳碰面。\n애니: 도현 씨, 오늘 몇 시에 만나요?\n도현: 활동 카드 좀 볼게요. 시계 그림은 열 시네요. 아홉 시 반에 여기서 만날까요?\n애니: 좋아요. 지금 몇 시예요?\n도현: 저기 시계 보세요. 지금 아홉 시예요.\n애니: 그럼 집에 다녀올게요. 가방이 집에 있어요.\n도현: 네. 아홉 시 반에 같이 가요.\n\n## 本課要教的說法出現在哪\n\n- ko.g.time.clock-reading#c01：D1「오후 여섯 시 삼십 분이에요.」「여섯 시 반이에요?」；D2「오후 세 시예요.」；D3「지금 아홉 시예요.」\n- ko.g.time.clock-reading#c02：D1「선생님, 독서 모임은 몇 시예요?」；D2「모이는 시간이 몇 시예요?」；D3「지금 몇 시예요?」\n- ko.g.jjeum.approximation#c01：D1「여섯 시 이십 분쯤 활동실로 오세요.」；D2「두 시 오십 분쯤 나가요?」\n\n### 初版翻譯\n\n## D1\n地點與情境：週四上課前，소라、애니、마이클在麻浦多文化中心教室看活動室的時鐘圖。\n這段要完成的事：確認讀書會的開始時間，約好提前集合。\n애니: 老師，讀書會是幾點？\n소라: 請看這裡的時鐘圖。是下午六點三十分。\n마이클: 是六點半嗎？\n소라: 對。請六點二十分左右到活動室來。\n애니: 好的。書也要帶過來嗎？\n소라: 對，書也請帶過來。\n마이클: 好的。到時候見。\n\n## D2\n地點與情境：週六下午，애니和유키在中心旁咖啡館看語言交換活動卡上的時鐘圖。\n這段要完成的事：確認活動集合時間，決定何時一起從咖啡館出發。\n유키: 애니，看一下卡片。集合時間是幾點？\n애니: 上面有時鐘圖。是下午三點。\n유키: 現在是兩點半。還有時間喝咖啡。\n애니: 好。兩點五十分左右出發嗎？\n유키: 好啊。一起走吧。\n\n## D3\n地點與情境：週日上午，애니和도현在住宅大樓大廳對照時鐘與社區活動卡。\n這段要完成的事：確認社區活動時間，約好出發前在大廳碰面。\n애니: 도현，今天幾點碰面？\n도현: 我看一下活動卡。時鐘圖是十點呢。九點半在這裡碰面好嗎？\n애니: 好啊。現在幾點？\n도현: 看那邊的時鐘。現在是九點。\n애니: 那我先回一趟家。包包在家裡。\n도현: 好的。九點半一起去。\n\n---\n\n## 第 15 課\n\n課程 ID：`ko.a1.l015`\n\n**本課目標**\n\n> 能說明平日工作或休息從幾點到幾點，並回答時間範圍問題。\n\n### 對話\n\n## D1\n地點與情境：麻浦多文化中心討論室，週六語言交換活動後，三人安排固定讀書會。\n這段要完成的事：確定下次起每週讀書會的地點與起訖時間。\n애니: 다음 주에도 여기서 같이 공부해요.\n유키: 좋아요. 언어 교환 전에 만나요?\n마이클: 네. 저는 오후 두 시부터 괜찮아요.\n애니: 저도요. 두 시부터 세 시까지 어때요?\n유키: 좋아요. 세 시부터는 언어 교환이 있어요.\n마이클: 그럼 매주 토요일에 만나요.\n애니: 네. 여기서 두 시부터 세 시까지 공부해요.\n\n## D2\n地點與情境：住宅大樓一樓，週一早上，애니與도현碰面，商量平日一起散步。\n這段要完成的事：比對兩人的工作與休息時間，找出共同的散步時段。\n도현: 애니 씨, 평일에 같이 산책할까요?\n애니: 좋아요. 몇 시부터 몇 시까지 일해요?\n도현: 오전 아홉 시부터 저녁 여덟 시까지요. 오후 세 시부터 다섯 시까지는 쉬어요.\n애니: 저는 아홉 시부터 여섯 시까지 일해요. 오후에는 시간이 없어요.\n도현: 그럼 아침은 어때요? 저는 아침 식사 후에 시간이 있어요.\n애니: 저도 좋아요. 여덟 시에 만나요?\n도현: 네. 여덟 시부터 여덟 시 이십 분까지 걸어요.\n애니: 좋아요. 내일 아침에 여기서 만나요.\n\n## D3\n地點與情境：麻浦多文化中心櫃檯，週二晚上，마이클查看服務時段並詢問固定活動。\n這段要完成的事：確認中心平日開放時間，安排마이클參加每週的讀書活動。\n마이클: 선생님, 센터는 평일에 몇 시까지 열어요?\n소라: 오전 아홉 시부터 밤 아홉 시까지 열어요.\n마이클: 저녁에 책을 읽는 모임도 있어요?\n소라: 네. 매주 수요일 저녁 일곱 시부터 여덟 시까지예요.\n마이클: 좋아요. 저는 수요일에 여섯 시까지 수업이 있어요.\n소라: 그럼 수업 후에 오시면 되겠네요.\n마이클: 네. 모임 전에 저녁도 먹을 수 있어요.\n소라: 좋아요. 내일 저녁 일곱 시에 오세요.\n마이클: 네. 내일부터 매주 올게요.\n\n## 本課要教的說法出現在哪\n\n- 時間N부터：D1，「네. 여기서 두 시부터 세 시까지 공부해요.」\n- 時間까지：D1，「저도요. 두 시부터 세 시까지 어때요?」\n- 時間名詞＋후에：D2，「저는 아침 식사 후에 시간이 있어요.」\n- 時間名詞＋전에：D3，「모임 전에 저녁도 먹을 수 있어요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：麻浦多文化中心討論室，週六語言交換活動後，三人安排固定讀書會。\n這段要完成的事：確定下次起每週讀書會的地點與起訖時間。\n애니: 下週也一起在這裡讀書吧。\n유키: 好啊。要在語言交換之前碰面嗎？\n마이클: 好。我下午兩點開始可以。\n애니: 我也是。兩點到三點如何？\n유키: 好啊。三點開始有語言交換。\n마이클: 那就每週六碰面吧。\n애니: 好。我們在這裡從兩點讀到三點。\n\n## D2\n地點與情境：住宅大樓一樓，週一早上，애니與도현碰面，商量平日一起散步。\n這段要完成的事：比對兩人的工作與休息時間，找出共同的散步時段。\n도현: 애니，平日要一起散步嗎？\n애니: 好啊。你從幾點工作到幾點？\n도현: 早上九點到晚上八點。下午三點到五點休息。\n애니: 我從九點工作到六點。下午沒有時間。\n도현: 那早上如何？我吃完早餐後有空。\n애니: 我也可以。八點碰面嗎？\n도현: 好。我們從八點散步到八點二十分。\n애니: 好啊。明天早上在這裡碰面吧。\n\n## D3\n地點與情境：麻浦多文化中心櫃檯，週二晚上，마이클查看服務時段並詢問固定活動。\n這段要完成的事：確認中心平日開放時間，安排마이클參加每週的讀書活動。\n마이클: 老師，中心平日開到幾點？\n소라: 早上九點開到晚上九點。\n마이클: 晚上也有讀書會嗎？\n소라: 有的。是每週三晚上七點到八點。\n마이클: 太好了。我週三上課到六點。\n소라: 那下課後過來就可以了。\n마이클: 好的。讀書會前還可以吃個晚餐。\n소라: 好啊。明天晚上七點過來吧。\n마이클: 好。明天開始我每週都會來。\n\n---\n\n## 第 16 課\n\n課程 ID：`ko.a1.l016`\n\n**本課目標**\n\n> 能詢問並說明喜歡或不喜歡哪些食物，也能說出想吃的一種品項。\n\n### 對話\n\n## D1\n地點與情境：麻浦多文化中心休息室，週六語言交換活動前。\n這段要完成的事：交換食物喜好，選出休息時間一起分享的點心。\n애니: 쉬는 시간에 뭐 먹을까요?\n유키: 과일 어때요? 저는 과일을 좋아해요.\n마이클: 좋아요. 어떤 과일을 좋아해요?\n유키: 딸기를 좋아해요. 애니 씨는요?\n애니: 저도 딸기를 좋아해요. 딸기 먹고 싶어요.\n마이클: 저는 딸기는 별로 안 좋아해요. 바나나는 어때요?\n애니: 바나나도 좋아요.\n유키: 저도 좋아요. 그럼 오늘은 바나나를 같이 먹어요.\n\n## D2\n地點與情境：밥집座位區，週四下課後。\n這段要完成的事：確認彼此的食物喜好，決定下次一起吃的料理。\n도현: 다음에 같이 밥 먹어요. 어떤 음식을 좋아해요?\n애니: 고기를 좋아해요. 도현 씨는요?\n도현: 저도 고기를 좋아해요. 매운 음식도 좋아하고요.\n애니: 저는 매운 음식은 안 좋아해요.\n도현: 그럼 불고기 어때요? 맵지 않아요.\n애니: 좋아요. 불고기 먹고 싶어요.\n도현: 저도요. 그럼 다음에는 불고기 먹어요.\n\n## D3\n地點與情境：中心廚房旁的共餐桌，週日下午。\n這段要完成的事：為週六共餐選出食物，確認準備方向。\n소라: 토요일에 다 같이 먹을 음식을 준비하려고 해요. 뭐 먹고 싶어요?\n유키: 김밥 먹고 싶어요.\n소라: 좋아요. 저도 김밥을 좋아해요. 참치김밥은 어때요?\n유키: 좋아요. 참치를 좋아해요.\n소라: 김밥에 싫어하는 재료가 있어요?\n유키: 오이는 안 좋아해요.\n소라: 그럼 오이 없는 참치김밥으로 준비할게요. 다른 분들한테도 괜찮은지 물어볼게요.\n유키: 네. 저도 준비할 때 도와줄게요.\n\n## 本課要教的說法出現在哪\n- 喜歡事物、詢問喜好：D1「어떤 과일을 좋아해요?」「저는 과일을 좋아해요.」；D2「어떤 음식을 좋아해요?」「고기를 좋아해요.」\n- 不喜歡事物：D1「저는 딸기는 별로 안 좋아해요.」；D2「저는 매운 음식은 안 좋아해요.」；D3「오이는 안 좋아해요.」\n- 想做某事：D1「딸기 먹고 싶어요.」；D2「불고기 먹고 싶어요.」；D3「뭐 먹고 싶어요?」「김밥 먹고 싶어요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：麻浦多文化中心休息室，週六語言交換活動前。\n這段要完成的事：交換食物喜好，選出休息時間一起分享的點心。\n애니: 休息時間要吃什麼呢？\n유키: 水果怎麼樣？我喜歡水果。\n마이클: 好啊。你喜歡什麼水果？\n유키: 我喜歡草莓。安妮呢？\n애니: 我也喜歡草莓。我想吃草莓。\n마이클: 我不太喜歡草莓。香蕉怎麼樣？\n애니: 香蕉也很好。\n유키: 我也覺得好。那我們今天就一起吃香蕉吧。\n\n## D2\n地點與情境：밥집座位區，週四下課後。\n這段要完成的事：確認彼此的食物喜好，決定下次一起吃的料理。\n도현: 下次一起吃飯吧。你喜歡吃什麼食物？\n애니: 我喜歡吃肉。道賢呢？\n도현: 我也喜歡吃肉，而且我也喜歡吃辣的。\n애니: 我不喜歡吃辣。\n도현: 那烤肉怎麼樣？不會辣。\n애니: 好啊。我想吃烤肉。\n도현: 我也是。那我們下次就吃烤肉吧。\n\n## D3\n地點與情境：中心廚房旁的共餐桌，週日下午。\n這段要完成的事：為週六共餐選出食物，確認準備方向。\n소라: 週六我想準備大家一起吃的食物。你想吃什麼？\n유키: 我想吃飯捲。\n소라: 好啊。我也喜歡飯捲。鮪魚飯捲怎麼樣？\n유키: 好啊。我喜歡鮪魚。\n소라: 飯捲裡有你不喜歡的配料嗎？\n유키: 我不喜歡小黃瓜。\n소라: 那我準備沒有小黃瓜的鮪魚飯捲。我也會問問其他人這樣行不行。\n유키: 好。準備的時候我也會幫忙。\n\n---\n\n## 第 17 課\n\n課程 ID：`ko.a1.l017`\n\n**本課目標**\n\n> 能看簡單菜單，點一種餐點或飲料，並回答店員的基本選項問題。\n\n### 對話\n\n## D1\n地點與情境：週二下課後，애니在中心旁咖啡館櫃檯看菜單點飲料。\n這段要完成的事：애니點一杯拿鐵，確認冷熱和是否加糖漿，完成結帳。\n애니: 카페라테 한 잔 주세요.\n咖啡館店員: 따뜻한 걸로 드릴까요, 아이스로 드릴까요?\n애니: 아이스로 주세요.\n咖啡館店員: 시럽도 넣어 드릴까요?\n애니: 아니요, 시럽은 안 넣어 주세요.\n咖啡館店員: 네, 사천 원이에요.\n애니: 카드로 할게요.\n咖啡館店員: 네, 결제됐어요. 잠시만 기다려 주세요.\n\n## D2\n地點與情境：週六午餐時間，유키在熟悉的밥집櫃檯看菜單點餐。\n這段要完成的事：유키點拌飯，確認配料後選定蔬菜拌飯。\n유키: 비빔밥 하나 주세요.\n餐廳櫃檯人員: 소고기비빔밥이랑 야채비빔밥이 있어요. 어떤 걸로 드릴까요?\n유키: 야채비빔밥에도 고기가 들어가요?\n餐廳櫃檯人員: 아니요, 야채비빔밥에는 고기가 들어가지 않아요.\n유키: 그럼 야채비빔밥으로 주세요.\n餐廳櫃檯人員: 네. 고추장은 따로 드릴까요?\n유키: 네, 따로 주세요.\n餐廳櫃檯人員: 알겠어요. 자리에 앉아 계세요.\n\n## 本課要教的說法出現在哪\n- N(을/를) 주세요：D1「카페라테 한 잔 주세요.」；D2「비빔밥 하나 주세요.」\n- 안＋V：D1「아니요, 시럽은 안 넣어 주세요.」\n- V-지 않다：D2「아니요, 야채비빔밥에는 고기가 들어가지 않아요.」\n- ko.g.uro.choice#c01：D1「아이스로 주세요.」；D2「그럼 야채비빔밥으로 주세요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週二下課後，애니在中心旁咖啡館櫃檯看菜單點飲料。\n這段要完成的事：애니點一杯拿鐵，確認冷熱和是否加糖漿，完成結帳。\n애니: 請給我一杯拿鐵。\n咖啡館店員: 要熱的還是冰的呢？\n애니: 請給我冰的。\n咖啡館店員: 也要幫您加糖漿嗎？\n애니: 不用了，請不要加糖漿。\n咖啡館店員: 好的，一共是四千元。\n애니: 我刷卡。\n咖啡館店員: 好的，刷卡成功了。請稍等一下。\n\n## D2\n地點與情境：週六午餐時間，유키在熟悉的밥집櫃檯看菜單點餐。\n這段要完成的事：유키點拌飯，確認配料後選定蔬菜拌飯。\n유키: 請給我一份拌飯。\n餐廳櫃檯人員: 有牛肉拌飯跟蔬菜拌飯。要哪一種呢？\n유키: 蔬菜拌飯裡面也有放肉嗎？\n餐廳櫃檯人員: 沒有，蔬菜拌飯裡面沒有放肉。\n유키: 那請給我蔬菜拌飯。\n餐廳櫃檯人員: 好的。辣醬要另外放嗎？\n유키: 好的，請另外放。\n餐廳櫃檯人員: 好的。請先在位子上坐一下。\n\n---\n\n## 第 18 課\n\n課程 ID：`ko.a1.l018`\n\n**本課目標**\n\n> 能在共餐前後依自己角色使用簡單禮貌表達。\n\n### 對話\n\n## D1\n地點與情境：麻浦多文化中心活動室，週六共餐開始前。\n這段要完成的事：소라迎接同學，安排大家入席並開始共餐。\n소라: 어서 오세요. 이쪽에 앉으세요.\n애니: 선생님, 안녕하세요.\n유키: 저는 여기 앉을게요.\n마이클: 저도 여기 앉을게요.\n소라: 이제 다 왔네요. 우리 같이 먹어요.\n애니: 잘 먹겠습니다.\n소라: 네, 맛있게 드세요.\n\n## D2\n地點與情境：밥집內側座位區，週四晚上。\n這段要完成的事：도현招待朋友吃飯，애니和유키表達謝意並接受招待。\n도현: 여기 앉으세요. 음식은 곧 나와요.\n애니: 고마워요. 오늘 밥값은 얼마예요?\n도현: 오늘은 제가 살게요. 편하게 드세요.\n애니: 아, 고마워요.\n도현: 자, 음식 나왔어요. 많이 드세요.\n유키: 와, 맛있겠어요. 잘 먹겠습니다.\n애니: 저도 잘 먹겠습니다.\n\n## D3\n地點與情境：麻浦多文化中心廚房旁，共餐結束後。\n這段要完成的事：用餐者向소라致謝，分工收拾桌面後結束活動。\n애니: 선생님, 잘 먹었습니다. 정말 맛있었어요.\n소라: 잘 먹었어요? 와 줘서 고마워요.\n유키: 그릇은 어디에 놓아요?\n소라: 여기 놓아 주세요.\n마이클: 저는 식탁 닦을게요.\n소라: 고마워요. 이 행주로 닦아 주세요.\n애니: 저도 도와줄게요.\n마이클: 다 닦았어요.\n소라: 모두 고마워요. 조심히 가세요.\n유키: 네, 안녕히 계세요.\n\n## 本課要教的說法出現在哪\n- 說話者意向：V-겠-：D1「잘 먹겠습니다.」；D2「저도 잘 먹겠습니다.」\n- 名詞性的疑問槽：얼마예요?：D2「고마워요. 오늘 밥값은 얼마예요?」\n- 工具與交通手段：工具N(으)로 V：D3「고마워요. 이 행주로 닦아 주세요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：麻浦多文化中心活動室，週六共餐開始前。\n這段要完成的事：소라迎接同學，安排大家入席並開始共餐。\n소라: 歡迎，請坐這邊。\n애니: 老師，您好。\n유키: 我坐這裡。\n마이클: 我也坐這裡。\n소라: 人都到齊了呢，我們一起吃吧。\n애니: 我要開動了。\n소라: 好，請慢用。\n\n## D2\n地點與情境：밥집內側座位區，週四晚上。\n這段要完成的事：도현招待朋友吃飯，애니和유키表達謝意並接受招待。\n도현: 請坐這裡，餐點馬上就來。\n애니: 謝謝你，今天這餐多少錢？\n도현: 今天我請客，放輕鬆吃吧。\n애니: 啊，謝謝你。\n도현: 來，餐點來了，大家多吃點。\n유키: 哇，看起來好好吃，我要開動了。\n애니: 我也要開動了。\n\n## D3\n地點與情境：麻浦多文化中心廚房旁，共餐結束後。\n這段要完成的事：用餐者向소라致謝，分工收拾桌面後結束活動。\n애니: 老師，謝謝招待，真的很好吃。\n소라: 有吃飽嗎？謝謝你們來。\n유키: 碗盤要放哪裡？\n소라: 請放在這裡。\n마이클: 我來擦桌子。\n소라: 謝謝你，請用這條抹布擦。\n애니: 我也來幫忙。\n마이클: 都擦好了。\n소라: 謝謝大家，路上小心。\n유키: 好，再見。\n\n---\n\n## 第 19 課\n\n課程 ID：`ko.a1.l019`\n\n**本課目標**\n\n> 能使用課內提供的千元級金額讀法表，讀出 1,000–10,000 韓元帳單總額，請帳並以現金或卡結帳。\n\n### 對話\n\n## D1\n地點與情境：토요일 저녁 식사 후, 밥집 자리에서 애니와 유키가 금액 읽기 표를 보며 계산서를 확인해요.\n這段要完成的事：계산서를 받아 금액을 확인하고 카드로 계산해요.\n애니: 저기요, 계산서 좀 주세요.\n餐廳櫃檯人員: 네, 여기 있어요.\n유키: 모두 만 원이에요?\n餐廳櫃檯人員: 네, 맞아요.\n애니: 제가 낼게요.\n유키: 고마워요. 다음에는 제가 낼게요.\n애니: 카드로 할게요.\n餐廳櫃檯人員: 네, 카드 주세요.\n애니: 여기요.\n餐廳櫃檯人員: 결제됐어요. 카드하고 영수증 여기 있어요.\n애니: 감사합니다.\n\n## D2\n地點與情境：화요일 저녁 식사 후, 밥집 계산대에서 마이클이 금액 읽기 표를 보며 계산서를 확인해요.\n這段要完成的事：계산서에 적힌 금액을 확인하고 현금으로 계산해요.\n마이클: 계산할게요. 계산서 여기 있어요.\n餐廳櫃檯人員: 네, 잠시만요.\n마이클: 칠천 원 맞아요?\n餐廳櫃檯人員: 네, 칠천 원이에요.\n마이클: 현금으로 낼게요. 만 원 여기 있어요.\n餐廳櫃檯人員: 만 원 받았어요. 거스름돈 삼천 원하고 영수증 여기 있어요.\n마이클: 감사합니다.\n\n## 本課要教的說法出現在哪\n- 계산서 좀 주세요：D1「저기요, 계산서 좀 주세요.」\n- 금액 확인하기：D1「모두 만 원이에요?」／D2「칠천 원 맞아요?」\n- 카드로 할게요：D1「카드로 할게요.」\n- 현금으로 낼게요：D2「현금으로 낼게요. 만 원 여기 있어요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：토요일 저녁 식사 후, 밥집 자리에서 애니와 유키가 금액 읽기 표를 보며 계산서를 확인해요.\n這段要完成的事：계산서를 받아 금액을 확인하고 카드로 계산해요.\n애니: 不好意思，請幫我拿帳單。\n餐廳櫃檯人員: 好的，給您。\n유키: 總共是一萬元嗎？\n餐廳櫃檯人員: 對，沒錯。\n애니: 我來付就好。\n유키: 謝謝妳，下次換我請。\n애니: 我用刷卡的。\n餐廳櫃檯人員: 好的，請給我信用卡。\n애니: 給您。\n餐廳櫃檯人員: 幫您結好帳了，卡片和收據給您。\n애니: 謝謝。\n\n## D2\n地點與情境：화요일 저녁 식사 후, 밥집 계산대에서 마이클이 금액 읽기 표를 보며 계산서를 확인해요.\n這段要完成的事：계산서에 적힌 금액을 확인하고 현금으로 계산해요.\n마이클: 我要結帳，帳單在這裡。\n餐廳櫃檯人員: 好的，請稍等一下。\n마이클: 請問是七千元沒錯嗎？\n餐廳櫃檯人員: 是的，一共是七千元。\n마이클: 我付現金，這裡是一萬元。\n餐廳櫃檯人員: 收到您一萬元，找您三千元和收據在這裡。\n마이클: 謝謝。\n\n---\n\n## 第 20 課\n\n課程 ID：`ko.a1.l020`\n\n**本課目標**\n\n> 能在市場辨認想買的水果或蔬菜，詢問並說出一種或兩種品項的數量。\n\n### 對話\n\n## D1\n地點與情境：麻浦多文化中心活動室，週六共餐準備前。\n這段要完成的事：確認餐點、招待分工與付款安排。\n소라: 지난번에 고른 김밥으로 준비할까요? 매운 건 빼고요.\n유키: 네, 좋아요. 저는 물하고 컵을 준비할게요.\n애니: 저는 시장에서 과일을 살게요.\n마이클: 그럼 저는 뭘 할까요?\n소라: 저랑 같이 상을 차려요. 손님이 오면 자리도 안내해 주세요.\n마이클: 네. 김밥은 선생님이 주문하세요?\n소라: 네, 제가 주문하고 카드로 계산할게요. 나중에 영수증을 보고 같이 나눠 내요.\n애니: 좋아요. 과일값도 같이 나눠 내요.\n\n## D2\n地點與情境：社區市場水果攤，週六上午。\n這段要完成的事：애니替中心共餐買蘋果和橘子，確認各品項的數量。\n애니: 안녕하세요. 같이 먹을 과일 좀 사려고요.\n水果攤老闆: 사과나 귤은 어떠세요? 둘 다 맛있어요.\n애니: 좋아요. 이 사과하고 저 귤 주세요.\n水果攤老闆: 몇 개씩 드릴까요?\n애니: 사과는 네 개, 귤은 열 개 주세요.\n水果攤老闆: 사과 네 개하고 귤 열 개요. 귤은 하나 더 드릴게요.\n애니: 그럼 귤은 모두 열한 개예요?\n水果攤老闆: 네, 맞아요. 여기 있어요.\n\n## D3\n地點與情境：麻浦多文化中心廚房旁，週六午餐前。\n這段要完成的事：決定兩張共餐桌各放多少水果，分工清洗和切水果。\n유키: 과일은 두 테이블에 나눠 놓을까요?\n애니: 네. 사과는 몇 개 씻을까요?\n유키: 두 개만 씻어요. 귤은 여섯 개 어때요?\n애니: 좋아요. 테이블마다 사과 한 개하고 귤 세 개씩 놓아요.\n유키: 네. 남은 건 냉장고에 넣어요.\n애니: 제가 사과랑 귤을 씻을게요.\n유키: 그럼 사과는 제가 자를게요.\n\n## 本課要教的說法出現在哪\n- 名詞並列：N과/와 N/N(이)랑 N/N하고 N：D1「저는 물하고 컵을 준비할게요.」D2「좋아요. 이 사과하고 저 귤 주세요.」D3「제가 사과랑 귤을 씻을게요.」\n- 名詞選項：N(이)나 N：D2「사과나 귤은 어떠세요?」\n\n### 初版翻譯\n\n## D1\n地點與情境：麻浦多文化中心活動室，週六共餐準備前。\n這段要完成的事：確認餐點、招待分工與付款安排。\n소라: 準備上次挑的飯捲好嗎？不要辣的。\n유키: 好啊。那我來準備水和杯子。\n애니: 我去市場買水果。\n마이클: 那我要做什麼呢？\n소라: 跟我一起擺餐桌吧。客人來的時候也請幫忙帶位。\n마이클: 好的。飯捲是老師負責訂嗎？\n소라: 對，我來訂並刷卡結帳。之後看收據大家再一起平分。\n애니: 好的。水果錢也一起平分吧。\n\n## D2\n地點與情境：社區市場水果攤，週六上午。\n這段要完成的事：애니替中心共餐買蘋果和橘子，確認各品項的數量。\n애니: 您好。我想買些大家一起吃的水果。\n水果攤老闆: 蘋果或橘子怎麼樣？兩種都很好吃喔。\n애니: 好啊。請給我這個蘋果跟那個橘子。\n水果攤老闆: 各要幾個呢？\n애니: 蘋果要四個，橘子要十個。\n水果攤老闆: 四個蘋果和十個橘子。橘子多送妳一個。\n애니: 那橘子總共是十一個嗎？\n水果攤老闆: 對，沒錯。都在這裡。\n\n## D3\n地點與情境：麻浦多文化中心廚房旁，週六午餐前。\n這段要完成的事：決定兩張共餐桌各放多少水果，分工清洗和切水果。\n유키: 水果要分放在兩張桌子上嗎？\n애니: 好啊。蘋果要洗幾個呢？\n유키: 洗兩個就好。橘子六個怎麼樣？\n애니: 好的。每張桌子各放一個蘋果和三個橘子。\n유키: 好。剩下的就冰進冰箱。\n애니: 我來洗蘋果和橘子。\n유키: 那我來切蘋果。\n\n---\n"},{"name":"Unit 3","range":"L21–L30","source":"https://github.com/stasischen/release-aggregator/blob/main/docs/tasks/LESSON_RUNNER_20261024/A1-u03_TEXT_PREVIEW.md","markdown":"# A1 第 3 單元（L21–L30）文字定稿前預覽\n\n- 流程：每課 Sol 寫、Sonnet 審（c1–c5）→ 單元總審 Sonnet 第 1 輪就 approve，沒有阻擋問題。\n- 這份只有韓文＋初版翻譯；斷詞、i18n 等 A1 文字全部完成後才做。\n- 看完覺得哪課要改，直接說課號和問題就好。\n\n## Sonnet 的 11 個建議（不擋，等你決定）\n\n**比較值得改的**\n1. **L29 文法偏難**：複習課卻用了間接引述「소나기가 온대요」「영하래요」、「따뜻하겠어요」「추우니까」；可改簡單說法（例「비가 와요」）。\n2. **L25 情境說明是韓文**：「地點與情境」「這段要完成的事」寫成韓文，其他課是繁中（只影響預覽與之後的 i18n）。\n3. **「원」翻成「元」**：L21、L23 翻成「五千元」，台灣人可能以為是新台幣；建議寫「韓元」。\n\n**場景重複或小落差**\n4. L28 第 3 段與 L29 第 3 段很像（都是低溫、換厚外套圍巾帽子）。\n5. L24 第 2 段與 L25 第 2 段情節接近（유키 試穿太小、換大一號）；L25 多了換貨與收據。\n6. L24 寫「에스／엠」、L25 寫「S／M／L」，尺寸寫法不一致。\n7. L27 第 1 段：유키剛下課卻向路人問中心出口，有點不自然。\n8. L30 第 1 段偏長（12 句、合併好幾件事）；「연습용 날씨 카드」跳出故事；翻譯「一直直走」→「一直走」。\n9. L30 第 2 段的天氣是閒聊回顧，不是看天氣資訊（影響小）。\n10. L30 第 2 段 도현 在午餐時間的밥집聊天，最好確認他在休息。\n11. L25 第 3 段：유키 L24 買的白 T 恤又要換色，確認是刻意的。\n\n---\n\n\n## 第 21 課\n\n課程 ID：`ko.a1.l021`\n\n**本課目標**\n\n> 能要求市場商品多一點或少一點，並確認包裝或重量。\n\n### 對話\n\n## D1\n地點與情境：週一傍晚，社區市場蔬菜攤，애니正在挑晚餐要用的蔬菜。\n這段要完成的事：애니調整馬鈴薯的購買重量，並確認洋蔥的袋裝份量。\n애니: 감자 좀 주세요.\n蔬菜攤老闆: 얼마나 드릴까요?\n애니: 오백 그램 주세요.\n蔬菜攤老闆: 이 정도면 오백 그램이에요.\n애니: 조금 더 주세요. 칠백 그램이요.\n蔬菜攤老闆: 네, 칠백 그램이에요. 또 필요한 거 있어요?\n애니: 양파도요. 이건 한 봉지에 몇 개예요?\n蔬菜攤老闆: 세 개예요.\n애니: 그럼 한 봉지 주세요. 감자하고 따로 담아 주세요.\n蔬菜攤老闆: 네, 따로 담았어요. 여기 있어요.\n\n## D2\n地點與情境：週四上課前，麻浦多文化中心廚房旁，애니와 도현正在整理下次活動的採買清單。\n這段要完成的事：兩人依這次活動的人數，把清單上的蘋果從四個改為六個。\n도현: 다음 활동에는 여섯 명이 와요. 과일은 사과로 할까요?\n애니: 좋아요. 사과 네 개면 돼요?\n도현: 한 사람에 하나씩 주면 좋겠어요. 두 개 더 사요.\n애니: 그럼 여섯 개네요.\n도현: 네. 사과는 제가 살게요.\n애니: 좋아요. 여기 네 개를 여섯 개로 바꿀게요.\n\n## D3\n地點與情境：週六上午，社區市場蔬果攤，유키正在買帶回家吃的水果。\n這段要完成的事：유키確認一袋橘子的重量，減少購買份量後帶走。\n유키: 안녕하세요. 귤은 한 봉지에 얼마예요?\n水果攤老闆: 오천 원이에요. 한 봉지에 일 킬로예요.\n유키: 집에 과일이 좀 있어요. 반만 살 수 있어요?\n水果攤老闆: 네, 오백 그램도 돼요.\n유키: 그럼 오백 그램만 주세요.\n水果攤老闆: 네, 작은 봉지에 담아 드릴게요. 이천오백 원이에요.\n유키: 여기요. 감사합니다.\n水果攤老闆: 고마워요. 맛있게 드세요.\n\n## 本課要教的說法出現在哪\n- 조금 더 주세요：D1，「조금 더 주세요. 칠백 그램이요.」\n- 한 봉지에 몇 개예요?：D1，「양파도요. 이건 한 봉지에 몇 개예요?」\n- 따로 담아 주세요：D1，「그럼 한 봉지 주세요. 감자하고 따로 담아 주세요.」\n- 두 개 더 사요：D2，「한 사람에 하나씩 주면 좋겠어요. 두 개 더 사요.」\n- 반만 살 수 있어요?：D3，「집에 과일이 좀 있어요. 반만 살 수 있어요?」\n- 오백 그램만 주세요：D3，「그럼 오백 그램만 주세요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週一傍晚，社區市場蔬菜攤，애니正在挑晚餐要用的蔬菜。\n這段要完成的事：애니調整馬鈴薯的購買重量，並確認洋蔥的袋裝份量。\n애니: 請給我馬鈴薯。\n蔬菜攤老闆: 要拿多少呢？\n애니: 請給我五百公克。\n蔬菜攤老闆: 這樣差不多是五百公克。\n애니: 請再多給我一點，七百公克。\n蔬菜攤老闆: 好的，七百公克。還需要別的嗎？\n애니: 還有洋蔥。這一袋有幾顆？\n蔬菜攤老闆: 三顆。\n애니: 那請給我一袋。請幫我和馬鈴薯分開裝。\n蔬菜攤老闆: 好的，分開裝好了。這裡給您。\n\n## D2\n地點與情境：週四上課前，麻浦多文化中心廚房旁，애니와 도현正在整理下次活動的採買清單。\n這段要完成的事：兩人依這次活動的人數，把清單上的蘋果從四個改為六個。\n도현: 下次活動會有六個人來。水果選蘋果好嗎？\n애니: 好啊。蘋果四顆夠嗎？\n도현: 一個人分一顆比較好。我們再多買兩顆吧。\n애니: 那就是六顆了。\n도현: 對。蘋果我來買。\n애니: 好啊。那我把這裡的四顆改成六顆。\n\n## D3\n地點與情境：週六上午，社區市場蔬果攤，유키正在買帶回家吃的水果。\n這段要完成的事：유키確認一袋橘子的重量，減少購買份量後帶走。\n유키: 你好。橘子一袋多少錢？\n水果攤老闆: 五千元。一袋是一公斤。\n유키: 家裡還有一些水果。可以只買一半嗎？\n水果攤老闆: 可以啊，五百公克也行。\n유키: 那請給我五百公克就好。\n水果攤老闆: 好的，我幫你裝在小袋子裡。兩千五百元。\n유키: 給您，謝謝。\n水果攤老闆: 謝謝，慢慢享用喔。\n\n---\n\n## 第 22 課\n\n課程 ID：`ko.a1.l022`\n\n**本課目標**\n\n> 能看懂日用品區域標示，詢問商品在哪裡並找到指定用品。\n\n### 對話\n\n## D1\n地點與情境：週二下班後，애니在社區超市日用品區，照購物清單找家用品。\n這段要完成的事：애니對照貨架標示，找到洗衣精和洗碗精。\n애니: 저기요, 주방 세제는 어디에 있어요?\n超市店員: 저쪽 세제 코너에 있어요.\n애니: 저기 ‘세탁 세제’라고 써 있어요. 거기예요?\n超市店員: 거기는 세탁 세제만 있어요. 주방 세제는 바로 옆에 있어요.\n애니: 아, 여기 있네요. 세탁 세제도 필요해요.\n超市店員: 그럼 이쪽에서 고르시면 돼요.\n애니: 네, 둘 다 찾았어요. 감사합니다.\n\n## D2\n地點與情境：週四上課前，마이클在社區超市文具與紙品區，找讀書會要用的紙。\n這段要完成的事：마이클確認影印紙和面紙的貨架位置，找到兩樣用品。\n마이클: 저기요, 복사 용지는 어디에 있어요?\n超市店員: 문구 코너에 있어요. 공책 옆을 보세요.\n마이클: 아, 찾았어요. 갑 티슈도 여기 있어요?\n超市店員: 갑 티슈는 뒤쪽 휴지 코너에 있어요.\n마이클: 저기 ‘휴지’라고 써 있는 곳이요?\n超市店員: 네, 맞아요. 두루마리 휴지는 아래에 있고, 갑 티슈는 위에 있어요.\n마이클: 아, 위에 있네요. 오늘은 갑 티슈만 필요해요.\n超市店員: 네, 여기서 고르세요.\n\n## D3\n地點與情境：週六下午，유키和애니在社區超市入口附近，拿著中心活動的用品清單看區域標示。\n這段要完成的事：兩人核對清單，依標示找到清潔用濕紙巾和洗手用的肥皂。\n유키: 청소용 물티슈하고 비누가 필요해요. 어디에 있을까요?\n애니: 저기 ‘청소용품’이라고 써 있어요. 먼저 가 봐요.\n유키: 여기 있네요. 이 물티슈로 살까요?\n애니: 네, 좋아요. 이제 비누만 찾으면 돼요.\n유키: 저쪽에 ‘비누·샴푸’라고 써 있어요.\n애니: 아, 바로 옆이네요. 여기 비누 있어요.\n유키: 이걸로 사요. 손 씻을 때 쓰면 돼요.\n애니: 좋아요. 다 찾았어요. 계산하러 가요.\n\n## 本課要教的說法出現在哪\n- N만：D1，「거기는 세탁 세제만 있어요.」\n- N만：D2，「오늘은 갑 티슈만 필요해요.」\n- N만：D3，「이제 비누만 찾으면 돼요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週二下班後，애니在社區超市日用品區，照購物清單找家用品。\n這段要完成的事：애니對照貨架標示，找到洗衣精和洗碗精。\n애니: 不好意思，洗碗精在哪裡？\n超市店員: 在那邊的清潔劑區。\n애니: 那裡寫著「洗衣精」，是在那裡嗎？\n超市店員: 那裡只有洗衣精。洗碗精就在旁邊。\n애니: 啊，在這裡呢。我也需要洗衣精。\n超市店員: 那在這邊挑選就可以了。\n애니: 好的，兩個都找到了。謝謝您。\n\n## D2\n地點與情境：週四上課前，마이클在社區超市文具與紙品區，找讀書會要用的紙。\n這段要完成的事：마이클確認影印紙和面紙的貨架位置，找到兩樣用品。\n마이클: 不好意思，影印紙在哪裡？\n超市店員: 在文具區。請看筆記本旁邊。\n마이클: 啊，找到了。盒裝面紙也在這裡嗎？\n超市店員: 盒裝面紙在後面的衛生紙區。\n마이클: 是那邊寫著「衛生紙」的地方嗎？\n超市店員: 對，沒錯。捲筒衛生紙在下面，盒裝面紙在上面。\n마이클: 啊，在上面呢。我今天只需要盒裝面紙。\n超市店員: 好的，請在這邊挑選。\n\n## D3\n地點與情境：週六下午，유키和애니在社區超市入口附近，拿著中心活動的用品清單看區域標示。\n這段要完成的事：兩人核對清單，依標示找到清潔用濕紙巾和洗手用的肥皂。\n유키: 我們需要清潔用濕紙巾和肥皂。會在哪裡呢？\n애니: 那邊寫著「清潔用品」，先過去看看吧。\n유키: 在這裡呢。買這款濕紙巾好嗎？\n애니: 好啊。現在只要找到肥皂就可以了。\n유키: 那邊寫著「肥皂・洗髮精」。\n애니: 啊，就在旁邊呢。這裡有肥皂。\n유키: 買這個吧，洗手的時候可以用。\n애니: 好啊。都找到了，去結帳吧。\n\n---\n\n## 第 23 課\n\n課程 ID：`ko.a1.l023`\n\n**本課目標**\n\n> 能讀出商品標示上的簡單價格並比較兩件商品。\n\n### 對話\n\n## D1\n地點與情境：週三晚上，애니和유키在社區超市清潔用品貨架前比較洗碗精的標價。\n這段要完成的事：選一瓶三千元以內的洗碗精。\n애니: 이 주방 세제는 삼천오백 원이에요.\n유키: 옆에 있는 건 이천팔백 원이에요.\n애니: 옆에 있는 게 이것보다 싸네요. 크기도 같아요.\n유키: 오늘은 삼천 원 안에서 사야 해요.\n애니: 그럼 옆에 있는 걸로 한 병 살게요.\n\n## D2\n地點與情境：週六下午，마이클和애니在社區超市文具區比較讀書會用的影印紙。\n這段要完成的事：比較兩包影印紙的價格，決定買哪一包。\n마이클: 이 복사 용지는 칠천 원이에요.\n애니: 아래에 있는 건 육천 원이에요.\n마이클: 둘 다 오백 장이에요. 크기도 같아요.\n애니: 그럼 아래에 있는 게 더 좋겠어요. 위에 있는 것보다 천 원 싸요.\n마이클: 네. 아래에 있는 걸로 사요.\n\n## D3\n地點與情境：週四下課後，도현和유키在社區便利商店飲料櫃前挑選帶去中心活動的飲料。\n這段要完成的事：比較礦泉水和大麥茶的標價，選一種購買。\n유키: 보리차는 이천 원이에요. 물은 천 원이에요.\n도현: 물이 보리차보다 천 원 싸네요.\n유키: 오늘은 음료에 삼천 원까지 쓸 수 있어요.\n도현: 그럼 물로 사요. 두 병 사도 이천 원이에요.\n유키: 좋아요. 물로 두 병 살게요.\n\n## 本課要教的說法出現在哪\n- 比較基準：N보다（더）述語：D1，「옆에 있는 게 이것보다 싸네요.」\n- 比較基準：N보다（더）述語：D2，「위에 있는 것보다 천 원 싸요.」\n- 比較基準：N보다（더）述語：D3，「물이 보리차보다 천 원 싸네요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週三晚上，애니和유키在社區超市清潔用品貨架前比較洗碗精的標價。\n這段要完成的事：選一瓶三千元以內的洗碗精。\n애니: 這瓶洗碗精三千五百元。\n유키: 旁邊那個兩千八百元。\n애니: 旁邊那個比這個便宜耶。大小也一樣。\n유키: 今天得在三千元以內買。\n애니: 那就買一瓶旁邊那個吧。\n\n## D2\n地點與情境：週六下午，마이클和애니在社區超市文具區比較讀書會用的影印紙。\n這段要完成的事：比較兩包影印紙的價格，決定買哪一包。\n마이클: 這包影印紙七千元。\n애니: 下面那包六千元。\n마이클: 兩包都是五百張。尺寸也一樣。\n애니: 那下面那個比較好，比上面那個便宜一千元。\n마이클: 好，那就買下面那個吧。\n\n## D3\n地點與情境：週四下課後，도현和유키在社區便利商店飲料櫃前挑選帶去中心活動的飲料。\n這段要完成的事：比較礦泉水和大麥茶的標價，選一種購買。\n유키: 麥茶兩千元。水是一千元。\n도현: 水比麥茶便宜一千元耶。\n유키: 今天買飲料可以花到三千元。\n도현: 那買水吧。買兩瓶也才兩千元。\n유키: 好啊。那我買兩瓶水。\n\n---\n\n## 第 24 課\n\n課程 ID：`ko.a1.l024`\n\n**本課目標**\n\n> 能說出衣服的顏色和尺寸，詢問能否試穿，並說明合不合身。\n\n### 對話\n\n## D1\n地點與情境：週日午後，麻浦街區服飾店，애니挑選上班穿的外套。\n這段要完成的事：애니確認外套的顏色與尺寸，挑一件試穿。\n애니: 회사에 입고 갈 재킷을 찾고 있어요 아, 저 작은 문이요? 옆에 도서관 이름도 있어요.\n路人: 네, 거기가 입구예요.\n마이클: 찾았어요. 감사합니다.\n\n## D3\n地點與情境：週日傍晚，애니和도현在住宅大樓附近路口，對照簡圖與體育館路標。\n這段要完成的事：核對前往社區體育館的方向，確認目的地位置。\n애니: 아까 오른쪽이라고 했죠? 표지판은 왼쪽인데요.\n도현: 오른쪽은 주차장이에요. 체육관 입구는 왼쪽이에요.\n애니: 아, 그림에도 입구가 왼쪽에 있어요.\n도현: 네, 저기 파란 문 보여요? 저기가 입구예요.\n애니: 생각보다 가깝네요.\n도현: 네, 여기서 멀지 않아요.\n애니: 아, 문 위에 체육관이라고 써 있어요. 고마워요.\n도현: 네, 같이 가요.\n\n## 本課要教的說法出現在哪\n- V-지 말다：D1「아니요, 건너지 마세요.」\n- A-지 않다：D2「문이 크지 않아요.」；D3「네, 여기서 멀지 않아요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週四下課後，유키在麻浦多文化中心附近路口，和路人對照簡圖與路口標示。\n這段要完成的事：核對中心出口的方向，確認出口位置並致謝。\n유키: 那中心的出口是在右邊嗎？這張圖上是在左邊耶。\n路人: 請把圖轉個方向看看。現在右邊才是對的。\n유키: 啊，那個路標也指著右邊。要過馬路嗎？\n路人: 不用，請不要過馬路。出口在這邊。\n유키: 啊，那裡有一個小門呢。\n路人: 對，那裡就是中心出口。\n유키: 我知道了，謝謝您。\n\n## D2\n地點與情境：週六午後，마이클在社區圖書館周邊街道，拿著簡圖核對眼前的建築。\n這段要完成的事：依地標確認圖書館建築與入口，找到入口並致謝。\n마이클: 那間藥局旁邊的建築物是圖書館嗎？\n路人: 對，沒錯。圖上的藥局就是那一間。\n마이클: 入口也在前面嗎？\n路人: 對，就在樹的旁邊。門並不大。\n마이클: 啊，是那個小門嗎？旁邊也有寫圖書館的名字。\n路人: 對，那裡就是入口。\n마이클: 找到了，謝謝您。\n\n## D3\n地點與情境：週日傍晚，애니和도현在住宅大樓附近路口，對照簡圖與體育館路標。\n這段要完成的事：核對前往社區體育館的方向，確認目的地位置。\n애니: 剛才說是右邊對吧？可是路標指著左邊耶。\n도현: 右邊是停車場，體育館入口在左邊。\n애니: 啊，圖上的入口也是在左邊。\n도현: 對，有看到那邊那扇藍色的門嗎？那裡就是入口。\n애니: 比想像中近呢。\n도현: 對啊，離這裡不遠。\n애니: 啊，門上方寫著體育館。謝謝你。\n도현: 不客氣，我們一起走吧。\n\n---\n\n## 第 28 課\n\n課程 ID：`ko.a1.l028`\n\n**本課目標**\n\n> 能看簡短天氣資訊，選擇合適衣物並說明出門前要帶的用品。\n\n### 對話\n\n## D1\n地點與情境：麻浦多文化中心休息區，週六活動前，애니和유키查看虛構的天氣圖示。\n這段要完成的事：兩人依天氣資訊選好衣物與用品，準備前往熟悉的活動地點。\n애니: 여기 날씨 좀 봐요. 해 그림이 있어요.\n유키: 오늘은 22도예요. 많이 안 더워요.\n애니: 그럼 얇은 겉옷을 입을게요.\n유키: 좋아요. 저는 모자도 쓸게요.\n애니: 물도 가져가요. 밖에서 마셔요.\n유키: 네. 가방에 넣었어요. 이제 가요.\n\n## D2\n地點與情境：住宅大樓大廳，週日早上，애니和도현查看虛構的陰雨天氣資訊。\n這段要完成的事：兩人確認天氣，準備好前往社區內熟悉地點所需的用品。\n도현: 나가기 전에 날씨 좀 볼까요?\n애니: 네. 구름하고 비 그림이 있어요. 18도예요.\n도현: 많이 안 추워요. 그래도 비가 오니까 우산은 챙겨요.\n애니: 제 우산은 집에 있어요. 가져올게요.\n도현: 저도요. 젖은 우산을 넣을 봉투도 가져올게요.\n애니: 좋아요. 저도 봉투 하나 챙길게요.\n\n## D3\n地點與情境：麻浦多文化中心入口，週二晚上下課後，소라和마이클查看虛構的簡短天氣資訊。\n這段要完成的事：兩人依夜間天氣選好外出衣物，準備前往熟悉的地點。\n소라: 마이클 씨, 여기 날씨 정보 좀 보세요. 오늘 밤은 8도예요.\n마이클: 바람 그림도 있어요. 많이 추워요?\n소라: 네, 바람이 불어서 추워요. 따뜻하게 입고 가세요.\n마이클: 그럼 두꺼운 외투를 입을게요.\n소라: 좋아요. 저도 외투를 입고 목도리도 할게요.\n마이클: 저는 모자도 쓸게요. 이제 준비됐어요.\n\n## 本課要教的說法出現在哪\n- 一般述語的短否定：안＋A：D1，「많이 안 더워요.」\n- 一般述語的短否定：안＋A：D2，「많이 안 추워요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：麻浦多文化中心休息區，週六活動前，애니和유키查看虛構的天氣圖示。\n這段要完成的事：兩人依天氣資訊選好衣物與用品，準備前往熟悉的活動地點。\n애니: 你看這裡的天氣。有太陽的圖案耶。\n유키: 今天22度。不太熱。\n애니: 那我穿件薄外套。\n유키: 好啊。我也戴頂帽子。\n애니: 也帶水吧。在外面可以喝。\n유키: 好。我放進包包了。我們走吧。\n\n## D2\n地點與情境：住宅大樓大廳，週日早上，애니和도현查看虛構的陰雨天氣資訊。\n這段要完成的事：兩人確認天氣，準備好前往社區內熟悉地點所需的用品。\n도현: 出門前看一下天氣好嗎？\n애니: 好。有雲和下雨的圖案。是18度。\n도현: 不會很冷。不過既然下雨，還是帶傘吧。\n애니: 我的傘在家裡。我去拿過來。\n도현: 我也是。我也去拿裝濕雨傘的塑膠袋。\n애니: 好啊。我也準備一個塑膠袋。\n\n## D3\n地點與情境：麻浦多文化中心入口，週二晚上下課後，소라和마이클查看虛構的簡短天氣資訊。\n這段要完成的事：兩人依夜間天氣選好外出衣物，準備前往熟悉的地點。\n소라: 麥可，你看一下這裡的天氣資訊。今天晚上是8度。\n마이클: 還有風的圖案耶。會很冷嗎？\n소라: 對，因為吹風所以滿冷的。穿暖一點再去喔。\n마이클: 那我穿厚外套。\n소라: 好啊。我也穿外套，再圍個圍巾。\n마이클: 我也戴頂帽子。現在準備好了。\n\n---\n\n## 第 29 課\n\n課程 ID：`ko.a1.l029`\n\n**本課目標**\n\n> 能依天氣資訊準備外出衣物和隨身用品。\n\n### 對話\n\n## D1\n地點與情境：週六上午，애니家門口；兩人查看梅雨季驟雨的虛構天氣預報圖卡。\n這段要完成的事：為前往中心活動準備折傘和外套。\n도현: 오늘은 소나기가 온대요. 작은 우산 하나 챙기세요.\n애니: 접는 우산이 있어요. 가방에 넣을게요.\n도현: 좋아요. 저도 작은 우산을 가져왔어요.\n애니: 지금은 더운데 외투도 필요해요?\n도현: 네, 비가 오면 쌀쌀해요. 얇은 거 하나 가져가세요.\n애니: 그럼 얇은 외투도 가져갈게요. 이제 가요.\n\n## D2\n地點與情境：週日午後，社區市場入口；兩人查看晴熱、日照強的虛構天氣預報圖卡。\n這段要完成的事：從隨身用品中選好採買時要用的遮陽用品。\n유키: 오늘은 맑아요. 기온이 삼십이 도예요.\n마이클: 햇빛이 강해요. 저는 선글라스를 쓸게요.\n유키: 저는 양산이 있어요. 양산을 쓸게요.\n마이클: 제 선글라스는 가방에 있어요. 꺼낼게요.\n유키: 그럼 저는 양산을 펼게요.\n마이클: 네. 이제 시장에 들어가요.\n\n## D3\n地點與情境：週二上課前，麻浦多文化中心休息區；兩人依虛構的低溫天氣圖卡整理週六活動衣物。\n這段要完成的事：選好週六語言交換活動要準備的外套和圍巾。\n소라: 토요일 아침은 영하래요. 이 두꺼운 외투가 좋겠어요.\n애니: 네. 목도리도 가져갈까요?\n소라: 네, 아침에는 추우니까 목도리도 챙기세요.\n애니: 그럼 외투랑 목도리를 같이 넣을게요.\n소라: 좋아요. 그러면 따뜻하겠어요.\n애니: 네. 두꺼운 외투하고 목도리는 이 가방에 넣었어요.\n\n## 本課要教的說法出現在哪\n\n- 無新文法（複習課），天氣資訊：D1「오늘은 소나기가 온대요.」；D2「오늘은 맑아요. 기온이 삼십이 도예요.」；D3「토요일 아침은 영하래요.」\n- 依天氣準備用品：D1「가방에 넣을게요.」；D2「저는 선글라스를 쓸게요.」\n- 依氣溫選擇衣物：D1「그럼 얇은 외투도 가져갈게요.」；D3「네, 아침에는 추우니까 목도리도 챙기세요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週六上午，애니家門口；兩人查看梅雨季驟雨的虛構天氣預報圖卡。\n這段要完成的事：為前往中心活動準備折傘和外套。\n도현: 聽說今天會下陣雨。帶一把小雨傘吧。\n애니: 我有折傘。我放進包包裡。\n도현: 好的。我也帶了一把小雨傘來。\n애니: 現在滿熱的，外套也需要嗎？\n도현: 對，下雨的話會有點涼。帶一件薄的去吧。\n애니: 那我也帶件薄外套去。我們走吧。\n\n## D2\n地點與情境：週日午後，社區市場入口；兩人查看晴熱、日照強的虛構天氣預報圖卡。\n這段要完成的事：從隨身用品中選好採買時要用的遮陽用品。\n유키: 今天是晴天。氣溫是三十二度。\n마이클: 陽光很強。我要戴太陽眼鏡。\n유키: 我有陽傘。我要撐陽傘。\n마이클: 我的太陽眼鏡在包包裡。我拿出來。\n유키: 那我把陽傘撐開。\n마이클: 好。我們進市場吧。\n\n## D3\n地點與情境：週二上課前，麻浦多文化中心休息區；兩人依虛構的低溫天氣圖卡整理週六活動衣物。\n這段要完成的事：選好週六語言交換活動要準備的外套和圍巾。\n소라: 聽說週六早上是零下。帶這件厚外套比較好。\n애니: 好。圍巾也帶去嗎？\n소라: 對，早上滿冷的，圍巾也帶上吧。\n애니: 那我把外套和圍巾一起放進去。\n소라: 好的。這樣就會很暖和了。\n애니: 好。厚外套跟圍巾已經放進這個包包裡了。\n\n---\n\n## 第 30 課\n\n課程 ID：`ko.a1.l030`\n\n**本課目標**\n\n> 能用過去式說昨天或上週末做過的一項熟悉活動，並補充時間或地點。\n\n### 對話\n\n## D1\n地點與情境：週一午休，애니和마이클在麻浦多文化中心休息區，對照週六的簡圖、路標照片和虛構預報卡整理回顧。\n這段要完成的事：整理週六語言交換後一起去麻浦區立圖書館的時間、路線、到達情況及雨具準備。\n애니: 토요일 사진을 정리하고 있어요. 이 지도도 같이 붙일까요?\n마이클: 좋아요. 지도에 길도 표시해요.\n애니: 센터에서 쭉 갔어요. 이 사거리에서 오른쪽으로 돌았어요.\n마이클: 맞아요. 여기 표지판 사진도 있어요.\n애니: 표지판을 보고 입구를 찾았어요. 바로 앞에 있었어요.\n마이클: 두 시에 도착했어요. 길을 쉽게 찾았어요.\n애니: 이 연습용 날씨 카드도 붙일까요? 오후에 소나기 그림이 있었어요.\n마이클: 네. 그래서 둘 다 우산을 챙겼어요.\n애니: 사진 밑에 이렇게 쓸게요. 토요일에 마이클 씨랑 마포구립도서관에 갔어요.\n마이클: 언어 교환이 끝나고 갔어요. 그것도 써요.\n애니: 네. 도서관에서 책도 읽었어요.\n마이클: 좋아요. 이제 사진이랑 메모를 같이 붙여요.\n\n## D2\n地點與情境：週二午餐時間，도현和애니在밥집用餐區聊上週末的休閒活動。\n這段要完成的事：分享週末聽音樂的經驗，補充同行者、時間與地點。\n도현: 주말 잘 보냈어요?\n애니: 네. 일요일에 유키 씨하고 공연을 봤어요.\n도현: 무슨 공연이었어요?\n애니: 음악 공연이었어요. 공원에서 봤어요.\n도현: 밖에서 음악을 들었네요. 날씨는 괜찮았어요?\n애니: 네. 따뜻하고 좋았어요.\n도현: 저도 음악 좋아해요. 공연은 몇 시에 했어요?\n애니: 오후 세 시에 했어요. 한 시간쯤 봤어요.\n도현: 시간도 딱 좋네요. 다음에 또 하면 알려 주세요.\n애니: 네. 다음에는 같이 가요.\n\n## D3\n地點與情境：週四上課前，유키在麻浦多文化中心教室給소라看昨天活動的照片。\n這段要完成的事：分享昨天參加的活動，確認時間與地點，並了解老師參加的活動。\n유키: 선생님, 이 사진 좀 보세요. 어제 남편이랑 요리 수업에 갔어요.\n소라: 김밥을 만들었네요! 여기 우리 센터예요?\n유키: 네. 이 층 요리 교실이에요.\n소라: 저도 어제 센터에 있었어요. 저녁에 운동 수업을 들었어요.\n유키: 몇 시에 했어요?\n소라: 일곱 시에 했어요. 유키 씨는요?\n유키: 저는 열 시에 갔어요. 오전 수업이었어요.\n소라: 그럼 시간이 달랐네요. 김밥은 맛있었어요?\n유키: 네. 만들고 남편이랑 같이 먹었어요.\n소라: 잘 만드셨네요. 사진 보니까 저도 먹고 싶어요.\n\n## 本課要教的說法出現在哪\n- 共同參與者：人과/와／(이)랑／하고 V：D1「토요일에 마이클 씨랑 마포구립도서관에 갔어요.」；D2「일요일에 유키 씨하고 공연을 봤어요.」；D3「어제 남편이랑 요리 수업에 갔어요.」\n- 述語與事件並列：V/A-고 S：D1「언어 교환이 끝나고 갔어요.」；D2「따뜻하고 좋았어요.」；D3「만들고 남편이랑 같이 먹었어요.」\n- 過去時間的述語：V/A-았/었/였-：D1「두 시에 도착했어요.」；D2「공원에서 봤어요.」；D3「저녁에 운동 수업을 들었어요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週一午休，애니和마이클在麻浦多文化中心休息區，對照週六的簡圖、路標照片和虛構預報卡整理回顧。\n這段要完成的事：整理週六語言交換後一起去麻浦區立圖書館的時間、路線、到達情況及雨具準備。\n애니: 我在整理週六的照片。這張地圖也一起貼上去嗎？\n마이클: 好啊。也在地圖上把路線標出來吧。\n애니: 我們從中心一直直走，在這個十字路口右轉了。\n마이클: 沒錯。這裡也有路標的照片。\n애니: 看了路標才找到入口，就在正前方。\n마이클: 我們兩點到的。路蠻好找的。\n애니: 這張練習用的天氣卡也貼上去嗎？上面有下午陣雨的圖案。\n마이클: 好啊。所以我們兩個人都有帶雨傘。\n애니: 照片下面我這樣寫喔。「週六和麥可去了麻浦區立圖書館。」\n마이클: 是語言交換結束後去的，那個也寫上去吧。\n애니: 好。我們在圖書館也看了書。\n마이클: 好啊。現在把照片和便條一起貼上去吧。\n\n## D2\n地點與情境：週二午餐時間，도현和애니在밥집用餐區聊上週末的休閒活動。\n這段要完成的事：分享週末聽音樂的經驗，補充同行者、時間與地點。\n도현: 週末過得好嗎？\n애니: 嗯。我週日和由紀一起去看了表演。\n도현: 是什麼樣的表演？\n애니: 是音樂表演。在公園看的。\n도현: 在戶外聽了音樂呢。天氣還好嗎？\n애니: 嗯，很溫暖、很舒服。\n도현: 我也很喜歡音樂。表演是幾點開始的？\n애니: 下午三點開始的。看了大約一個小時。\n도현: 時間也剛剛好呢。下次如果還有，再跟我說喔。\n애니: 好啊。下次一起去吧。\n\n## D3\n地點與情境：週四上課前，유키在麻浦多文化中心教室給소라看昨天活動的照片。\n這段要完成的事：分享昨天參加的活動，確認時間與地點，並了解老師參加的活動。\n유키: 老師，請看一下這張照片。我昨天和老公去上了料理課。\n소라: 做了飯捲呢！這裡是在我們中心嗎？\n유키: 對，在二樓的料理教室。\n소라: 我昨天也在中心。晚上去上了運動課。\n유키: 是幾點開始的？\n소라: 七點上的。由紀呢？\n유키: 我是十點去的，是上午的課。\n소라: 那時間就不一樣了呢。飯捲好吃嗎？\n유키: 好吃。做完之後跟老公一起吃了。\n소라: 做得真好呢。看照片我也好想吃。\n\n---\n"},{"name":"Unit 4","range":"L31–L41","source":"https://github.com/stasischen/release-aggregator/blob/main/docs/tasks/LESSON_RUNNER_20261024/A1-u04_TEXT_PREVIEW.md","markdown":"# A1 第 4 單元（L31–L41）文字定稿前預覽\n\n- 流程：每課 Sol 寫、Sonnet 審（c1–c5）→ 單元總審 Sonnet 兩輪（R2 approve，沒有阻擋問題）。\n- **A1 全部 41 課文字到這裡都完成了。** 斷詞、i18n 等你看完四個單元、決定要改哪些後才做。\n- 看完覺得哪課要改，直接說課號和問題就好。\n\n## Sonnet 的 7 個建議（不擋，等你決定）\n\n1. **L35 第 2 段時間矛盾**：票面 10:00 出發、10:35 到（35 分鐘），但 L34 說火車 40 分鐘；又出現「水原站 11 點集合」，和 L32 首爾站集合、全員同班車衝突。建議到站改 10:40、刪掉水原 11 點集合。\n2. **L31 第 1 段**：「作為週末短途出遊的活動方向」容易誤會是同一趟水原行，其實是另一個週末活動；建議改「週末活動」。\n3. **L31 第 3 段**：地點「住宅大樓一樓公告區」暗示유키住同一棟，角色表沒這設定；建議改成中心公告區。\n4. **L31 第 3 段**：「갈까요?」比 L32 才教的 -(으)ㄹ까요 早出現（不擋）。\n5. **人名翻譯不一致**（跨單元都有）：由紀／Yuki、麥可／Michael、道賢、安妮／Annie 混用。i18n 階段會用固定的名字對照表統一。\n6. **L35 第 3 段翻譯**：「我借看一下車票」不自然，改「我看一下您的票」。\n7. L38、L39、L41 幾處措辭可接受，第 1 輪已提過。\n\n---\n\n\n## 第 31 課\n\n課程 ID：`ko.a1.l031`\n\n**本課目標**\n\n> 能說一兩種自己喜歡或想做的休閒活動，也能問同伴的興趣。\n\n### 對話\n\n## D1\n地點與情境：麻浦多文化中心休息區，水原出遊前兩週的週二上課前，애니和마이클討論週末出遊想做的活動。\n這段要完成的事：兩人選定看戶外音樂電影，作為週末短途出遊的活動方向。\n애니: 이번 주말에는 밖에 나가고 싶어요.\n마이클: 그럼 야외에서 영화 볼까요?\n애니: 좋아요. 음악 영화를 보고 싶어요.\n마이클: 저도 좋아요. 토요일하고 일요일 중에 언제가 좋아요?\n애니: 일요일이 좋아요.\n마이클: 그럼 일요일에 가요. 제가 오늘 영화 정보를 찾아볼 거예요.\n애니: 저는 갈 곳을 찾아볼 거예요. 서울 근처가 좋겠어요.\n마이클: 좋아요. 목요일에 같이 장소를 골라요.\n\n## D2\n地點與情境：麻浦多文化中心中庭，水原出遊前兩週的週四유키下課後，도현來找她討論週末活動，也聊起這週休息時的安排。\n這段要完成的事：兩人交換平日的休閒安排，整理攝影展與料理課兩項週末活動供同伴選擇，유키也決定去看展。\n도현: 수업 끝났어요? 내일 저녁에 뭐 할 거예요?\n유키: 집 근처에서 산책할 거예요. 도현 씨는요?\n도현: 저는 집에서 요리할 거예요. 새로운 음식을 만들어 보고 싶어요.\n유키: 좋네요. 저는 주말에 사진 전시회에 가고 싶어요.\n도현: 어떤 사진을 보고 싶어요?\n유키: 여행 사진이요. 도현 씨는 주말에 뭐 하고 싶어요?\n도현: 저는 요리 수업에 가고 싶어요. 같이 갈 친구도 찾아볼 거예요.\n유키: 저는 전시회에 갈 거예요. 친구들한테 두 가지 다 물어봐요.\n\n## D3\n地點與情境：住宅大樓一樓公告區，水原出遊前兩週的週六上午，애니和유키看週末活動公告。\n這段要完成的事：兩人比較公告上的活動，選定當天下午一起去公園聽音樂。\n애니: 여기 주말 행사 안내가 있어요. 오늘 공원에서 공연을 해요.\n유키: 사진 전시회도 있네요. 저는 여행 사진을 보고 싶어요.\n애니: 저는 음악 공연이 더 좋아요. 오늘은 밖에 나가고 싶어요.\n유키: 저도요. 공원에서 산책도 할 수 있겠네요.\n애니: 그럼 같이 공연 보러 갈까요? 오후 세 시에 시작해요.\n유키: 좋아요. 저는 점심 먹고 나갈 거예요.\n애니: 그럼 두 시 반에 여기서 만나요.\n유키: 네. 공원까지 같이 걸어가요.\n\n## 本課要教的說法出現在哪\n\n- -(으)ㄹ 거예요：D1，「제가 오늘 영화 정보를 찾아볼 거예요.」「저는 갈 곳을 찾아볼 거예요.」\n- -(으)ㄹ 거예요：D2，「내일 저녁에 뭐 할 거예요?」「집 근처에서 산책할 거예요.」「저는 집에서 요리할 거예요.」「같이 갈 친구도 찾아볼 거예요.」「저는 전시회에 갈 거예요.」\n- -(으)ㄹ 거예요：D3，「저는 점심 먹고 나갈 거예요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：麻浦多文化中心休息區，水原出遊前兩週的週二上課前，애니和마이클討論週末出遊想做的活動。\n這段要完成的事：兩人選定看戶外音樂電影，作為週末短途出遊的活動方向。\n애니: 這個週末我想出去走走。\n마이클: 那要不要在戶外看電影？\n애니: 好啊。我想看音樂電影。\n마이클: 我也覺得很好。星期六跟星期天你哪天方便？\n애니: 星期天比較好。\n마이클: 那就星期天去吧。我今天會查一下電影資訊。\n애니: 我會找找要去哪裡。首爾附近應該不錯。\n마이클: 好啊。星期四我們再一起選地點。\n\n## D2\n地點與情境：麻浦多文化中心中庭，水原出遊前兩週的週四유키下課後，도현來找她討論週末活動，也聊起這週休息時的安排。\n這段要完成的事：兩人交換平日的休閒安排，整理攝影展與料理課兩項週末活動供同伴選擇，유키也決定去看展。\n도현: 下課了嗎？明天晚上打算做什麼？\n유키: 我會在家附近散步。道賢你呢？\n도현: 我會在家做菜。我想試著做新的料理。\n유키: 真好。我週末想去看攝影展。\n도현: 想看什麼樣的照片？\n유키: 旅行照片。道賢你週末想做什麼？\n도현: 我想去上料理課。我也會找找看有沒有朋友要一起去。\n유키: 我會去看展覽。我們兩樣都問問看朋友們吧。\n\n## D3\n地點與情境：住宅大樓一樓公告區，水原出遊前兩週的週六上午，애니和유키看週末活動公告。\n這段要完成的事：兩人比較公告上的活動，選定當天下午一起去公園聽音樂。\n애니: 這裡有週末活動的公告。今天公園有表演呢。\n유키: 也有攝影展耶。我想看旅行照片。\n애니: 我比較想看音樂表演。今天想去戶外走走。\n유키: 我也是。在公園也可以順便散散步呢。\n애니: 那我們要不要一起去看表演？下午三點開始。\n유키: 好啊。我吃完午餐後會出門。\n애니: 那兩點半在這裡碰面。\n유키: 好的。我們一起走路去公園吧。\n\n---\n\n## 第 32 課\n\n課程 ID：`ko.a1.l032`\n\n**本課目標**\n\n> 能邀請同伴一起做一件休閒活動，接受邀請或簡短婉拒，並確認時間。\n\n### 對話\n\n## D1\n地點與情境：麻浦多文化中心教室外，週二下課後，애니和유키看近郊行程通知。\n這段要完成的事：애니邀請유키參加水原短途出遊，確認她有空及大致集合時間。\n애니: 유키 씨, 다음 주 토요일에 같이 수원에 갈까요?\n유키: 좋아요. 다음 주 토요일은 시간 있어요.\n애니: 다음 주 토요일 아침 아홉 시쯤 서울역 앞에서 모여요. 괜찮아요?\n유키: 네, 괜찮아요. 같이 가요!\n\n## D2\n地點與情境：中心旁咖啡館，週三傍晚，마이클拿虛構活動通知邀請도현參加週六的羽球活動。\n這段要完成的事：마이클邀請도현參加週六的休閒活動，도현簡短婉拒。\n마이클: 도현 씨, 이번 주 토요일에 같이 배드민턴 칠까요?\n도현: 아, 이번 주 토요일은 같이 치지 못해요. 미안해요.\n마이클: 괜찮아요. 다음에 같이 쳐요.\n도현: 네, 좋아요.\n\n## D3\n地點與情境：麻浦多文化中心公告區，週四上課前，三人看行程通知確認出遊安排。\n這段要完成的事：三人確定同行名單，並按通知確認集合時間和地點。\n마이클: 저도 다음 주 토요일에 수원에 갈게요.\n애니: 좋아요. 도현 씨도 가요. 그럼 우리 넷이 같이 가요.\n유키: 몇 시에 어디서 만나요?\n애니: 여기 보세요. 다음 주 토요일 아침 아홉 시, 서울역 앞이에요.\n마이클: 네. 다음 주 토요일 아홉 시에 서울역 앞에서 만나요.\n유키: 좋아요. 그때 봐요!\n\n## 本課要教的說法出現在哪\n- （같이）V-(으)ㄹ까(요)?：D1「유키 씨, 다음 주 토요일에 같이 수원에 갈까요?」；D2「도현 씨, 이번 주 토요일에 같이 배드민턴 칠까요?」\n- V-지 못하다：D2「아, 이번 주 토요일은 같이 치지 못해요.」\n- （같이）V-아/어(요)：D1「같이 가요!」；D2「다음에 같이 쳐요.」；D3「그럼 우리 넷이 같이 가요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：麻浦多文化中心教室外，週二下課後，애니和유키看近郊行程通知。\n這段要完成的事：애니邀請유키參加水原短途出遊，確認她有空及大致集合時間。\n애니: 由紀，下週六一起去水原好嗎？\n유키: 好啊，下週六我有空。\n애니: 下週六早上九點左右在首爾站前面集合，好嗎？\n유키: 可以啊，沒問題。一起去吧！\n\n## D2\n地點與情境：中心旁咖啡館，週三傍晚，마이클拿虛構活動通知邀請도현參加週六的羽球活動。\n這段要完成的事：마이클邀請도현參加週六的休閒活動，도현簡短婉拒。\n마이클: 道賢，這週六一起打羽球好嗎？\n도현: 啊，這週六我沒辦法一起打，不好意思。\n마이클: 沒關係，下次再一起打吧。\n도현: 好啊。\n\n## D3\n地點與情境：麻浦多文化中心公告區，週四上課前，三人看行程通知確認出遊安排。\n這段要完成的事：三人確定同行名單，並按通知確認集合時間和地點。\n마이클: 我下週六也要去水原。\n애니: 好啊，道賢也會去。那我們四個一起去吧。\n유키: 幾點在哪裡碰面呢？\n애니: 你看這裡，下週六早上九點，在首爾站前面。\n마이클: 好的。下週六早上九點在首爾站前面碰面。\n유키: 好啊，到時候見！\n\n---\n\n## 第 33 課\n\n課程 ID：`ko.a1.l033`\n\n**本課目標**\n\n> 用簡單詞句說自己不舒服或哪裡痛，回答別人簡短的狀況詢問。\n\n### 對話\n\n## D1\n地點與情境：週二晚間課後，麻浦多文化中心教室；애니和마이클用虛構健康情境卡輪流練習。\n這段要完成的事：兩人交換角色，分別說明一處不適並確認目前狀況。\n애니: 이 카드로 먼저 할게요.\n마이클: 네. 어디가 아파요?\n애니: 배가 아파요.\n마이클: 많이 아파요?\n애니: 아니요, 조금 아파요.\n마이클: 이제 제가 할게요.\n애니: 네. 어디가 아파요?\n마이클: 머리가 아파요.\n애니: 지금도 아파요?\n마이클: 네, 아직 아파요.\n애니: 네. 연습 끝났어요.\n\n## D2\n地點與情境：週四上課前，麻浦多文化中心休息區；유키和도현抽取另一張虛構健康情境卡練習。\n這段要完成的事：유키提出簡短求助，回答도현的狀況詢問並取得需要的協助。\n도현: 카드 한 장 뽑으세요.\n유키: 네. 제가 먼저 할게요.\n도현: 좋아요. 시작해요.\n유키: 저 좀 도와주세요.\n도현: 네. 어디가 불편해요?\n유키: 다리가 아파요.\n도현: 많이 아파요?\n유키: 네. 여기 앉아도 돼요?\n도현: 그럼요. 이 의자에 앉으세요.\n유키: 고마워요.\n\n## D3\n地點與情境：水原出遊前一週的週六活動前，麻浦多文化中心服務櫃檯旁；마이클按虛構健康情境卡向소라老師求助。\n這段要完成的事：마이클說明疼痛位置和程度，소라確認後結束練習。\n소라: 카드 봤어요? 그럼 시작해요.\n마이클: 선생님, 좀 도와주세요.\n소라: 네. 어디가 아파요?\n마이클: 팔이 아파요.\n소라: 어느 쪽 팔이 아파요?\n마이클: 오른팔이 아파요.\n소라: 지금 많이 아파요?\n마이클: 아니요, 조금 아파요.\n소라: 네, 잘했어요. 여기까지 연습할게요.\n\n## 本課要教的說法出現在哪\n\n- 無新文法（複習課），以下說法在情境中自然運用。\n- 어디가 아파요?：D1、D3，「어디가 아파요?」\n- 많이 아파요?：D1、D2，「많이 아파요?」\n- 좀 도와주세요：D2，「저 좀 도와주세요.」；D3，「선생님, 좀 도와주세요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週二晚間課後，麻浦多文化中心教室；애니和마이클用虛構健康情境卡輪流練習。\n這段要完成的事：兩人交換角色，分別說明一處不適並確認目前狀況。\n애니: 我先用這張卡片。\n마이클: 好。哪裡痛？\n애니: 肚子痛。\n마이클: 很痛嗎？\n애니: 不會，有一點痛。\n마이클: 現在換我了。\n애니: 好。哪裡痛？\n마이클: 頭痛。\n애니: 現在還在痛嗎？\n마이클: 對，還在痛。\n애니: 好。練習結束了。\n\n## D2\n地點與情境：週四上課前，麻浦多文化中心休息區；유키和도현抽取另一張虛構健康情境卡練習。\n這段要完成的事：유키提出簡短求助，回答도현的狀況詢問並取得需要的協助。\n도현: 請抽一張卡片。\n유키: 好的。我先來。\n도현: 好啊。開始吧。\n유키: 請幫我一下。\n도현: 好的。哪裡不舒服？\n유키: 腳痛。\n도현: 很痛嗎？\n유키: 對。我可以坐這裡嗎？\n도현: 當然可以。請坐這張椅子。\n유키: 謝謝。\n\n## D3\n地點與情境：水原出遊前一週的週六活動前，麻浦多文化中心服務櫃檯旁；마이클按虛構健康情境卡向소라老師求助。\n這段要完成的事：마이클說明疼痛位置和程度，소라確認後結束練習。\n소라: 看過卡片了嗎？那我們開始吧。\n마이클: 老師，請幫我一下。\n소라: 好的。哪裡痛？\n마이클: 手臂痛。\n소라: 哪一邊的手臂痛？\n마이클: 右手臂痛。\n소라: 現在很痛嗎？\n마이클: 不會，有一點痛。\n소라: 好的，做得很好。練習就到這裡。\n\n---\n\n## 第 34 課\n\n課程 ID：`ko.a1.l034`\n\n**本課目標**\n\n> 問答一個熟悉目的地及搭乘方式，選出相符的交通選項。\n\n### 對話\n\n## D1\n地點與情境：週四下課後，애니和마이클在麻浦多文化中心生活資訊區看虛構近郊行程卡。\n這段要完成的事：比較去水原的交通選項，選出較快的方式。\n애니: 수원까지 뭘 타고 갈까요?\n마이클: 이 표를 봐요. 서울역에서 기차도 가고 버스도 가요.\n애니: 얼마나 걸려요?\n마이클: 기차는 사십 분, 버스는 한 시간 걸려요.\n애니: 그럼 기차로 가요. 더 빨라요.\n마이클: 좋아요. 기차를 타요.\n\n## D2\n地點與情境：週六上午，유키在首爾車站售票大廳出示同一張虛構行程卡，向售票員詢問交通方式。\n這段要完成的事：依售票員提供的路線資訊，選擇前往水原的交通方式。\n유키: 수원에 놀러 가요. 이 카드에 있는 기차는 여기서 타요?\n車站售票員: 네, 서울역에서 타요. 수원역까지 가요.\n유키: 버스도 있어요?\n車站售票員: 네. 이 표에 있는 버스는 한 시간 걸려요. 기차는 사십 분 걸려요.\n유키: 그럼 기차로 갈게요.\n車站售票員: 네. 기차표는 여기서 살 수 있어요.\n\n## D3\n地點與情境：週五傍晚，도현和애니在住宅大樓大廳看同一張虛構行程卡，核對同行者的交通選擇。\n這段要完成的事：確認從首爾出發的路線，以及애니和마이클選定的搭乘方式。\n도현: 내일 버스로 가요, 기차로 가요?\n애니: 마이클 씨하고 기차로 가요.\n도현: 카드 좀 볼까요? 서울역에서 수원역까지 가는 기차네요.\n애니: 네. 버스보다 빨라요.\n도현: 그럼 저도 같은 기차로 갈게요.\n애니: 좋아요. 같이 가요.\n\n## 本課要教的說法出現在哪\n- 動作或移動的出發來源：場所N에서 V：D1「서울역에서 기차도 가고 버스도 가요.」\n- 時間或空間的終點：場所까지：D2「수원역까지 가요.」\n- 移動的目的：V-(으)러 가다/오다：D2「수원에 놀러 가요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週四下課後，애니和마이클在麻浦多文化中心生活資訊區看虛構近郊行程卡。\n這段要完成的事：比較去水原的交通選項，選出較快的方式。\n애니: 我們搭什麼去水原呢？\n마이클: 你看這張表。從首爾站有火車也有公車可以去。\n애니: 要多久呢？\n마이클: 火車要四十分鐘，公車要一個小時。\n애니: 那搭火車去吧。比較快。\n마이클: 好啊。搭火車吧。\n\n## D2\n地點與情境：週六上午，유키在首爾車站售票大廳出示同一張虛構行程卡，向售票員詢問交通方式。\n這段要完成的事：依售票員提供的路線資訊，選擇前往水原的交通方式。\n유키: 我要去水原玩。這張卡片上的火車是在這裡搭嗎？\n車站售票員: 是的，在首爾站搭。會開到水原站。\n유키: 也有公車嗎？\n車站售票員: 有的。這張表上的公車要一個小時，火車要四十分鐘。\n유키: 那我搭火車去。\n車站售票員: 好的。火車票可以在這裡買。\n\n## D3\n地點與情境：週五傍晚，도현和애니在住宅大樓大廳看同一張虛構行程卡，核對同行者的交通選擇。\n這段要完成的事：確認從首爾出發的路線，以及애니和마이클選定的搭乘方式。\n도현: 明天是搭公車去，還是搭火車去？\n애니: 我和麥可搭火車去。\n도현: 我看一下卡片。是從首爾站到水原站的火車呢。\n애니: 對啊。比公車快。\n도현: 那我也搭同一班火車去。\n애니: 好啊。一起去吧。\n\n---\n\n## 第 35 課\n\n課程 ID：`ko.a1.l035`\n\n**本課目標**\n\n> 提出一張到指定地方的單程票需求，讀懂簡化票券的目的地與出發／抵達時刻並確認。\n\n### 對話\n\n## D1\n地點與情境：週六上午，首爾車站售票櫃檯；애니拿著虛構行程卡買票。\n這段要完成的事：애니提出一張到水原的單程票需求，並核對票面目的地。\n애니: 수원까지 편도 한 장 주세요. 이 카드에 있는 기차로 갈게요.\n車站售票員: 네, 열 시에 출발하는 기차네요. 여기 표 있어요.\n애니: 여기 ‘도착역’이 수원이에요?\n車站售票員: 네, 수원 가는 표 맞아요.\n애니: 좋아요. 감사합니다.\n\n## D2\n地點與情境：週六出發前，首爾車站候車區；유키和마이클拿著各自的虛構票券核對行程。\n這段要完成的事：兩人確認票上的目的地、出發與抵達時間符合集合安排。\n유키: 우리 표 같이 봐요. 도착역부터 확인해요.\n마이클: 제 표는 수원이에요. 유키 씨 표도 같아요?\n유키: 네, 수원이에요. 출발은 열 시예요.\n마이클: 제 표도 열 시예요. 도착은 열 시 삼십오 분이에요.\n유키: 저도 같아요. 수원역에서 열한 시에 만나죠?\n마이클: 네. 모임 전에 도착해요.\n유키: 좋아요. 이 기차 타면 돼요.\n\n## D3\n地點與情境：週六出發前，首爾車站月台入口；도현和애니對照票券與月台時刻資訊。\n這段要完成的事：兩人確認登車時間，並確認애니持有的仍是前往水原的單程票。\n애니: 표에는 열 시 출발이에요. 지금 타도 돼요?\n도현: 안내판에 아홉 시 오십 분부터 탈 수 있다고 나와요.\n애니: 지금 아홉 시 오십 분이에요. 그럼 들어가요?\n도현: 네. 표 잠깐 볼게요.\n애니: 여기 있어요. 수원 가는 편도 맞아요?\n도현: 네, 맞아요. 제 표도 수원까지 편도예요.\n애니: 좋아요. 같이 타요.\n\n## 本課要教的說法出現在哪\n- 工具與交通手段：交通N(으)로 V：D1「이 카드에 있는 기차로 갈게요.」\n- 時間或順序起點：順序N부터：D2「도착역부터 확인해요.」\n- 時間或順序起點：D3「안내판에 아홉 시 오십 분부터 탈 수 있다고 나와요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週六上午，首爾車站售票櫃檯；애니拿著虛構行程卡買票。\n這段要完成的事：애니提出一張到水原的單程票需求，並核對票面目的地。\n애니: 請給我一張到水原的單程票。我要搭這張卡片上的火車。\n車站售票員: 好的，是十點出發的火車呢。車票在這裡。\n애니: 這裡的「抵達站」是水原嗎？\n車站售票員: 是的，是去水原的票沒錯。\n애니: 好的。謝謝你。\n\n## D2\n地點與情境：週六出發前，首爾車站候車區；유키和마이클拿著各自的虛構票券核對行程。\n這段要完成的事：兩人確認票上的目的地、出發與抵達時間符合集合安排。\n유키: 我們一起看車票吧。先從抵達站開始確認。\n마이클: 我的票是到水原。유키你的票也一樣嗎？\n유키: 對，是水原。出發是十點。\n마이클: 我的票也是十點。抵達是十點三十五分。\n유키: 我也一樣。我們十一點在水原站碰面，對吧？\n마이클: 對。會在聚會前抵達。\n유키: 太好了。搭這班火車就可以了。\n\n## D3\n地點與情境：週六出發前，首爾車站月台入口；도현和애니對照票券與月台時刻資訊。\n這段要完成的事：兩人確認登車時間，並確認애니持有的仍是前往水原的單程票。\n애니: 票上寫十點出發。現在可以上車了嗎？\n도현: 告示牌上寫九點五十分開始可以上車。\n애니: 現在九點五十分了。那我們進去嗎？\n도현: 好。我借看一下車票。\n애니: 在這裡。是去水原的單程票沒錯吧？\n도현: 對，沒錯。我的票也是到水原的單程票。\n애니: 太好了。我們一起搭吧。\n\n---\n\n## 第 36 課\n\n課程 ID：`ko.a1.l036`\n\n**本課目標**\n\n> 在住宿櫃台說明已有訂房，報出訂房姓名並確認聯絡方式。\n\n### 對話\n\n## D1\n地點與情境：週六下午，애니抵達水原住宿櫃檯，出示虛構訂房卡。\n這段要完成的事：애니告知已有訂房，核對訂房姓名和卡上的聯絡方式。\n애니: 안녕하세요. 예약했어요. 여기 예약 카드예요.\n住宿櫃檯人員: 안녕하세요. 예약하신 이름이 어떻게 되세요?\n애니: 애니예요.\n住宿櫃檯人員: 네, 예약 확인했습니다. 연락은 카드에 있는 이메일로 드리면 됩니까?\n애니: 네, 그 이메일로 보내 주세요.\n住宿櫃檯人員: 알겠습니다. 체크인해 드릴게요.\n애니: 감사합니다.\n\n## D2\n地點與情境：週六下午，유키在水原住宿櫃檯出示同行者的虛構訂房卡。\n這段要完成的事：유키以同行者的訂房資料核對姓名與聯絡欄位，完成自己的入住登記。\n유키: 안녕하세요. 친구가 예약했어요. 예약 이름은 애니예요.\n住宿櫃檯人員: 예약 카드 좀 보여 주세요.\n유키: 여기 있어요. 저도 같이 왔어요.\n住宿櫃檯人員: 네, 확인했습니다. 연락처는 여기 적힌 이메일이 맞습니까?\n유키: 네, 맞아요. 친구 이메일이에요.\n住宿櫃檯人員: 알겠습니다. 체크인됐습니다.\n유키: 감사합니다.\n\n## D3\n地點與情境：週六下午，마이클在水原住宿入口大廳向櫃檯人員出示虛構訂房卡。\n這段要完成的事：마이클回答櫃檯的正式確認，核對訂房姓名和聯絡方式，完成入住登記。\n住宿櫃檯人員: 어서 오세요. 예약하셨습니까?\n마이클: 네, 예약했어요. 여기 카드예요.\n住宿櫃檯人員: 예약하신 이름이 어떻게 되세요?\n마이클: 마이클이에요.\n住宿櫃檯人員: 네, 예약 확인했습니다. 여기 적힌 번호로 연락드리면 됩니까?\n마이클: 네, 그 번호로 전화해 주세요.\n住宿櫃檯人員: 알겠습니다. 체크인됐습니다.\n마이클: 감사합니다.\n\n## 本課要教的說法出現在哪\n\n- 正式敬體陳述：V/A-습니다/ㅂ니다：D1、D3「네, 예약 확인했습니다.」；D2「네, 확인했습니다.」；D1、D2、D3「알겠습니다.」；D2、D3「체크인됐습니다.」\n- 正式敬體疑問：V/A-습니까/ㅂ니까?〔是非詢問〕：D1「연락은 카드에 있는 이메일로 드리면 됩니까?」；D2「연락처는 여기 적힌 이메일이 맞습니까?」；D3「예약하셨습니까?」「여기 적힌 번호로 연락드리면 됩니까?」\n\n### 初版翻譯\n\n## D1\n地點與情境：週六下午，애니抵達水原住宿櫃檯，出示虛構訂房卡。\n這段要完成的事：애니告知已有訂房，核對訂房姓名和卡上的聯絡方式。\n애니: 你好，我有訂房。這是預訂卡。\n住宿櫃檯人員: 您好，請問預訂的大名是？\n애니: 我是 Annie。\n住宿櫃檯人員: 好的，已確認預訂。用卡片上的 Email 聯絡您可以嗎？\n애니: 好的，請寄到那個 Email。\n住宿櫃檯人員: 好的，這就為您辦理入住。\n애니: 謝謝。\n\n## D2\n地點與情境：週六下午，유키在水原住宿櫃檯出示同行者的虛構訂房卡。\n這段要完成的事：유키以同行者的訂房資料核對姓名與聯絡欄位，完成自己的入住登記。\n유키: 你好，是我朋友訂的。預訂名字是 Annie。\n住宿櫃檯人員: 請出示一下預訂卡。\n유키: 在這裡，我們是一起來的。\n住宿櫃檯人員: 好的，已確認。聯絡方式是這裡寫的 Email 沒錯嗎？\n유키: 對，沒錯，是我朋友的 Email。\n住宿櫃檯人員: 好的，已經辦好入住了。\n유키: 謝謝。\n\n## D3\n地點與情境：週六下午，마이클在水原住宿入口大廳向櫃檯人員出示虛構訂房卡。\n這段要完成的事：마이클回答櫃檯的正式確認，核對訂房姓名和聯絡方式，完成入住登記。\n住宿櫃檯人員: 歡迎光臨，請問有訂房嗎？\n마이클: 有，我有訂房。這是卡片。\n住宿櫃檯人員: 請問預訂的大名是？\n마이클: 是 Michael。\n住宿櫃檯人員: 好的，已確認預訂。用這裡寫的號碼聯絡您可以嗎？\n마이클: 好，請打那個號碼給我。\n住宿櫃檯人員: 好的，已經辦好入住了。\n마이클: 謝謝。\n\n---\n\n## 第 37 課\n\n課程 ID：`ko.a1.l037`\n\n**本課目標**\n\n> 能依簡短住宿說明詢問房間樓層與位置，逐位確認房號，並問清早餐開始和結束時間。\n\n### 對話\n\n## D1\n地點與情境：週六入住後，水原住宿櫃檯；애니的虛構住宿卡標示房間在三樓，出電梯後往右，走廊最後一間。\n這段要完成的事：애니確認房間樓層與走廊位置，知道怎麼找到自己的房間。\n애니: 제 방은 몇 층이에요?\n住宿櫃檯人員: 카드에 보시면 삼 층이에요.\n애니: 엘리베이터에서 내려서 어디로 가요?\n住宿櫃檯人員: 오른쪽으로 가세요. 맨 끝에 있는 방이에요.\n애니: 오른쪽 맨 끝이요?\n住宿櫃檯人員: 네, 맞아요.\n애니: 네, 감사합니다. 올라갈게요.\n\n## D2\n地點與情境：週六傍晚，水原住宿走廊；유키與마이클拿著各自的虛構住宿卡，站在302與303號房門前。\n這段要完成的事：兩人逐位核對各自住宿卡與門牌上的房號，確認找到正確的房間。\n유키: 제 카드에는 삼, 공, 이예요. 여기 맞아요?\n마이클: 문에도 삼, 공, 이예요. 맞아요.\n유키: 좋아요. 마이클 씨 방은요?\n마이클: 삼, 공, 삼이에요. 바로 옆이네요.\n유키: 여기 문에도 삼, 공, 삼이에요.\n마이클: 네, 카드하고 같아요. 제 방은 여기예요.\n\n## D3\n地點與情境：週日上午，水原住宿早餐區入口；虛構住宿卡標示早餐時段為上午七點至九點。\n這段要完成的事：애니確認早餐開始與結束時間，決定吃早餐後的出發時間。\n애니: 이 카드에 아침 식사 시간이 있어요. 일곱 시부터예요?\n住宿櫃檯人員: 네, 아침 일곱 시에 시작해요.\n애니: 몇 시에 끝나요?\n住宿櫃檯人員: 아홉 시에 끝나요.\n애니: 그럼 여덟 시에 먹고 나갈게요.\n住宿櫃檯人員: 네, 여덟 시에 오시면 돼요.\n애니: 감사합니다. 그때 올게요.\n\n## 本課要教的說法出現在哪\n- 몇 층이에요?：D1，「제 방은 몇 층이에요?」\n- 어디로 가요?：D1，「엘리베이터에서 내려서 어디로 가요?」\n- 方向與位置：D1，「오른쪽으로 가세요. 맨 끝에 있는 방이에요.」\n- 逐位確認房號：D2，「문에도 삼, 공, 이예요. 맞아요.」\n- 부터：D3，「일곱 시부터예요?」\n- 開始與結束時間：D3，「아침 일곱 시에 시작해요.」「아홉 시에 끝나요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週六入住後，水原住宿櫃檯；애니的虛構住宿卡標示房間在三樓，出電梯後往右，走廊最後一間。\n這段要完成的事：애니確認房間樓層與走廊位置，知道怎麼找到自己的房間。\n애니: 我的房間在幾樓？\n住宿櫃檯人員: 看卡片上面是三樓。\n애니: 出了電梯之後要往哪裡走？\n住宿櫃檯人員: 請往右邊走，走到底的那間就是。\n애니: 右邊走到底嗎？\n住宿櫃檯人員: 對，沒錯。\n애니: 好的，謝謝，那我上去了。\n\n## D2\n地點與情境：週六傍晚，水原住宿走廊；유키與마이클拿著各自的虛構住宿卡，站在302與303號房門前。\n這段要完成的事：兩人逐位核對各自住宿卡與門牌上的房號，確認找到正確的房間。\n유키: 我的卡片上寫三、零、二，是這裡沒錯嗎？\n마이클: 門上也是三、零、二，沒錯。\n유키: 太好了。那麥可你的房間呢？\n마이클: 是三、零、三，就在隔壁呢。\n유키: 這裡門上也是三、零、三。\n마이클: 對，跟卡片上一樣。我的房間是這間。\n\n## D3\n地點與情境：週日上午，水原住宿早餐區入口；虛構住宿卡標示早餐時段為上午七點至九點。\n這段要完成的事：애니確認早餐開始與結束時間，決定吃早餐後的出發時間。\n애니: 這張卡上有寫早餐時間，是從七點開始嗎？\n住宿櫃檯人員: 是的，早上七點開始。\n애니: 幾點結束呢？\n住宿櫃檯人員: 九點結束。\n애니: 那我八點吃完再出門。\n住宿櫃檯人員: 好的，八點過來就可以。\n애니: 謝謝，那我到時候再過來。\n\n---\n\n## 第 38 課\n\n課程 ID：`ko.a1.l038`\n\n**本課目標**\n\n> 能詢問住宿是否有指定設施，並聽懂簡短的有／沒有回答。\n\n### 對話\n\n## D1\n地點與情境：水原住宿櫃檯，週六入住後，유키拿著設施清單向櫃檯詢問。\n這段要完成的事：유키確認住宿沒有洗衣間，當晚無法在住宿內洗衣。\n住宿櫃檯人員: 어떤 시설을 찾으십니까?\n유키: 세탁실이 있어요? 오늘 저녁에 빨래하고 싶어요.\n住宿櫃檯人員: 죄송하지만 세탁실은 없어요.\n유키: 아, 알겠어요. 감사합니다.\n\n## D2\n地點與情境：水原住宿大廳，週六傍晚，애니看過設施圖卡後向櫃檯確認。\n這段要完成的事：애니確認住宿沒有游泳池。\n애니: 저기요, 여기 수영장이 있어요?\n住宿櫃檯人員: 아니요, 수영장은 없어요.\n애니: 네, 알겠어요. 감사합니다.\n\n## D3\n地點與情境：水原住宿公共空間，週日早餐前，마이클向櫃檯人員詢問電梯。\n這段要完成的事：마이클確認住宿有電梯。\n마이클: 여기 엘리베이터가 있어요?\n住宿櫃檯人員: 네, 있어요.\n마이클: 아, 다행이에요. 감사합니다.\n\n## 本課要教的說法出現在哪\n- 正式敬體疑問：疑問詞＋…＋V/A-습니까/ㅂ니까?：D1，「어떤 시설을 찾으십니까?」\n\n### 初版翻譯\n\n## D1\n地點與情境：水原住宿櫃檯，週六入住後，유키拿著設施清單向櫃檯詢問。\n這段要完成的事：유키確認住宿沒有洗衣間，當晚無法在住宿內洗衣。\n住宿櫃檯人員: 請問您在找什麼設施呢？\n유키: 請問有洗衣間嗎？我今天晚上想洗衣服。\n住宿櫃檯人員: 不好意思，我們沒有洗衣間。\n유키: 啊，好的。謝謝。\n\n## D2\n地點與情境：水原住宿大廳，週六傍晚，애니看過設施圖卡後向櫃檯確認。\n這段要完成的事：애니確認住宿沒有游泳池。\n애니: 不好意思，請問這裡有游泳池嗎？\n住宿櫃檯人員: 沒有，沒有游泳池。\n애니: 好，我知道了。謝謝。\n\n## D3\n地點與情境：水原住宿公共空間，週日早餐前，마이클向櫃檯人員詢問電梯。\n這段要完成的事：마이클確認住宿有電梯。\n마이클: 請問這裡有電梯嗎？\n住宿櫃檯人員: 有的。\n마이클: 啊，太好了。謝謝。\n\n---\n\n## 第 39 課\n\n課程 ID：`ko.a1.l039`\n\n**本課目標**\n\n> 向服務人員指出手機、平板或電腦的一個明顯問題，讓對方知道是哪個設備。\n\n### 對話\n\n## D1\n地點與情境：週六晚間，水原住宿櫃檯；애니依虛構設備圖卡扮演手機畫面無法顯示的情境。\n這段要完成的事：애니指出自己的手機及畫面問題，讓櫃檯辨認設備與狀況。\n애니: 저기요, 제 휴대폰 좀 봐 주세요.\n住宿櫃檯人員: 네, 어떤 문제가 있어요?\n애니: 화면이 안 나와요.\n住宿櫃檯人員: 이 휴대폰이요? 화면이 까맣네요.\n애니: 네, 맞아요.\n\n## D2\n地點與情境：週六晚間，水原住宿交誼空間；마이클依虛構圖卡指出窗邊無法開機的平板。\n這段要完成的事：마이클說明平板無法開機，並讓櫃檯確認是哪台設備。\n마이클: 저기요, 저 태블릿이 안 켜져요.\n住宿櫃檯人員: 창가에 있는 태블릿 말씀이세요?\n마이클: 네, 저거예요.\n住宿櫃檯人員: 네, 알겠어요. 저 태블릿이 안 켜지는 거군요.\n\n## D3\n地點與情境：週一傍晚，麻浦多文化中心設備服務桌；유키依虛構圖卡提出電腦畫面出現線條的問題。\n這段要完成的事：유키指出電腦及畫面狀況，讓值班人員辨認並受理。\n유키: 이 컴퓨터 좀 봐 주세요.\n電子設備服務人員: 네, 어떤 문제가 있어요?\n유키: 화면에 줄이 있어요.\n電子設備服務人員: 아, 이 컴퓨터 화면에 줄이 보이네요. 접수할게요.\n유키: 네, 고마워요.\n\n## 本課要教的說法出現在哪\n- 無新文法，複習請求協助：D1「저기요, 제 휴대폰 좀 봐 주세요.」；D3「이 컴퓨터 좀 봐 주세요.」\n- 複習否定說法：D1「화면이 안 나와요.」；D2「저기요, 저 태블릿이 안 켜져요.」\n- 複習指出設備與描述狀況：D2「네, 저거예요.」；D3「화면에 줄이 있어요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：週六晚間，水原住宿櫃檯；애니依虛構設備圖卡扮演手機畫面無法顯示的情境。\n這段要完成的事：애니指出自己的手機及畫面問題，讓櫃檯辨認設備與狀況。\n애니: 不好意思，請幫我看一下我的手機。\n住宿櫃檯人員: 好的，請問有什麼問題嗎？\n애니: 螢幕沒有畫面。\n住宿櫃檯人員: 是這支手機嗎？螢幕是黑的呢。\n애니: 對，沒錯。\n\n## D2\n地點與情境：週六晚間，水原住宿交誼空間；마이클依虛構圖卡指出窗邊無法開機的平板。\n這段要完成的事：마이클說明平板無法開機，並讓櫃檯確認是哪台設備。\n마이클: 不好意思，那台平板開不了機。\n住宿櫃檯人員: 您是指窗邊的那台平板嗎？\n마이클: 對，就是那台。\n住宿櫃檯人員: 好的，我知道了。是那台平板開不了機啊。\n\n## D3\n地點與情境：週一傍晚，麻浦多文化中心設備服務桌；유키依虛構圖卡提出電腦畫面出現線條的問題。\n這段要完成的事：유키指出電腦及畫面狀況，讓值班人員辨認並受理。\n유키: 請幫我看一下這台電腦。\n電子設備服務人員: 好的，請問有什麼問題嗎？\n유키: 螢幕上有線條。\n電子設備服務人員: 啊，這台電腦螢幕上確實看得到線條呢。我幫您受理。\n유키: 好的，謝謝。\n\n---\n\n## 第 40 課\n\n課程 ID：`ko.a1.l040`\n\n**本課目標**\n\n> 聽不清楚或沒懂時表明困難，請對方重複或慢說，得到回應後繼續。\n\n### 對話\n\n## D1\n地點與情境：週日退房前，水原住宿櫃檯；애니拿著退房提示卡確認鑰匙歸還位置。\n這段要完成的事：애니請櫃檯重說歸還位置，聽懂後交還鑰匙並完成退房。\n住宿櫃檯人員: 열쇠는 문 옆 상자에 넣어 주세요.\n애니: 잘 모르겠어요. 다시 말해 주실 수 있어요?\n住宿櫃檯人員: 네. 저기 문 옆에 상자가 있어요. 거기에 열쇠를 넣어 주세요.\n애니: 아, 저 상자요? 지금 넣을게요.\n住宿櫃檯人員: 네, 고마워요. 체크아웃은 끝났어요.\n애니: 감사합니다. 안녕히 계세요.\n\n## D2\n地點與情境：週日返程前，水原車站售票大廳；售票員依虛構返程資訊卡說明出發時間。\n這段要完成的事：마이클請售票員慢說沒聽清楚的時間，再確認返回首爾的班次。\n水原車站售票員: 서울 가는 기차는 두 시 이십 분에 출발해요.\n마이클: 시간을 잘 못 들었어요. 조금 천천히 말해 주실 수 있어요?\n水原車站售票員: 네. 두 시, 이십 분이에요.\n마이클: 아, 두 시 이십 분이요. 그 기차표 한 장 주세요.\n水原車站售票員: 네, 서울 가는 두 시 이십 분 기차표 한 장이에요.\n마이클: 네, 맞아요. 감사합니다.\n\n## D3\n地點與情境：週一傍晚，麻浦多文化中心設備服務桌；服務人員正在說明受理單上的叫號資訊。\n這段要完成的事：유키請服務人員重複受理號碼，聽懂後繼續核對受理單上的設備編號。\n電子設備服務人員: 접수 번호는 십이 번이에요. 이 번호로 불러 드릴게요.\n유키: 잘 못 들었어요. 다시 한번 말해 주세요.\n電子設備服務人員: 십이 번이에요.\n유키: 아, 십이 번이요.\n電子設備服務人員: 네. 이제 접수증에 있는 컴퓨터 번호를 확인해 주실 수 있어요?\n유키: 네. 삼 번, 맞아요.\n電子設備服務人員: 확인됐어요. 잠시만 기다려 주세요.\n\n## 本課要教的說法出現在哪\n- V-(으)ㄹ 수 있다：D1，다시 말해 주실 수 있어요?\n- V-(으)ㄹ 수 있다：D2，조금 천천히 말해 주실 수 있어요?\n- V-(으)ㄹ 수 있다：D3，이제 접수증에 있는 컴퓨터 번호를 확인해 주실 수 있어요?\n\n### 初版翻譯\n\n## D1\n地點與情境：週日退房前，水原住宿櫃檯；애니拿著退房提示卡確認鑰匙歸還位置。\n這段要完成的事：애니請櫃檯重說歸還位置，聽懂後交還鑰匙並完成退房。\n住宿櫃檯人員: 請把鑰匙放進門旁邊的箱子裡。\n애니: 我不太清楚，可以請您再說一次嗎？\n住宿櫃檯人員: 好的。那邊門旁邊有個箱子，請把鑰匙放進那裡。\n애니: 啊，那個箱子嗎？我現在放進去。\n住宿櫃檯人員: 好的，謝謝您。退房手續已經完成了。\n애니: 謝謝。再見。\n\n## D2\n地點與情境：週日返程前，水原車站售票大廳；售票員依虛構返程資訊卡說明出發時間。\n這段要完成的事：마이클請售票員慢說沒聽清楚的時間，再確認返回首爾的班次。\n水原車站售票員: 往首爾的火車兩點二十分出發。\n마이클: 我剛剛沒聽清楚時間，可以請您說慢一點嗎？\n水原車站售票員: 好的。是兩點、二十分。\n마이클: 啊，兩點二十分。請給我一張那班車的票。\n水原車站售票員: 好的，一張去首爾、兩點二十分的火車票。\n마이클: 好的，沒錯。謝謝。\n\n## D3\n地點與情境：週一傍晚，麻浦多文化中心設備服務桌；服務人員正在說明受理單上的叫號資訊。\n這段要完成的事：유키請服務人員重複受理號碼，聽懂後繼續核對受理單上的設備編號。\n電子設備服務人員: 受理號碼是十二號，等等會叫這個號碼。\n유키: 我沒聽清楚，請再說一次。\n電子設備服務人員: 是十二號。\n유키: 啊，十二號。\n電子設備服務人員: 好的。現在可以請您確認一下受理單上的電腦編號嗎？\n유키: 好的。是三號，沒錯。\n電子設備服務人員: 確認好了。請稍等一下。\n\n---\n\n## 第 41 課\n\n課程 ID：`ko.a1.l041`\n\n**本課目標**\n\n> 告訴服務人員自己遺失了一件熟悉的物品，並說出一個特徵，方便對方幫忙尋找。\n\n### 對話\n\n## D1\n地點與情境：返首爾後的週二下午，麻浦區立圖書館櫃檯；마이클依虛構失物卡練習求助。\n這段要完成的事：마이클說明遺失了藍色雨傘、正在尋找，請櫃檯協助確認。\n마이클: 저기요, 우산을 잃어버렸어요. 지금 찾고 있어요.\n圖書館櫃檯人員: 무슨 색이에요?\n마이클: 파란색이에요.\n圖書館櫃檯人員: 네, 여기 들어온 우산이 있는지 확인해 볼게요.\n마이클: 감사합니다. 찾으면 저한테 알려 주세요.\n圖書館櫃檯人員: 네, 잠깐만 기다려 주세요.\n\n## D2\n地點與情境：週四讀書會前，麻浦區立圖書館入口服務桌；애니依另一張虛構失物卡練習求助。\n這段要完成的事：애니說明遺失了有貓咪圖案的錢包、正在尋找，讓櫃檯受理詢問。\n애니: 저기요, 지갑을 잃어버렸어요.\n圖書館櫃檯人員: 지갑에 어떤 특징이 있어요?\n애니: 고양이 그림이 있어요. 지금 찾고 있어요.\n圖書館櫃檯人員: 네, 고양이 그림이 있는 지갑이요. 확인해 볼게요.\n애니: 네, 부탁해요.\n圖書館櫃檯人員: 잠깐만 기다려 주세요.\n\n## D3\n地點與情境：週六下午，麻浦區立圖書館借還書區旁；유키依獨立練習卡演練失物求助。\n這段要完成的事：유키說明遺失了紅色筆記本、正在尋找，請櫃檯幫忙查看。\n유키: 저기요, 공책을 잃어버렸어요. 지금 찾고 있어요.\n圖書館櫃檯人員: 공책은 무슨 색이에요?\n유키: 빨간색이에요. 같이 찾아 주실 수 있어요?\n圖書館櫃檯人員: 네, 제가 이쪽 책상부터 볼게요.\n유키: 감사합니다. 저는 의자 쪽을 볼게요.\n圖書館櫃檯人員: 네, 찾으면 저한테 말씀해 주세요.\n\n## 本課要教的說法出現在哪\n- 接受者與對人指向：人에게／한테／께／보고：D1「찾으면 저한테 알려 주세요.」；D3「네, 찾으면 저한테 말씀해 주세요.」\n- 活動進行中：V-고 있다：D1、D2、D3「지금 찾고 있어요.」\n\n### 初版翻譯\n\n## D1\n地點與情境：返首爾後的週二下午，麻浦區立圖書館櫃檯；마이클依虛構失物卡練習求助。\n這段要完成的事：마이클說明遺失了藍色雨傘、正在尋找，請櫃檯協助確認。\n마이클: 不好意思，我把雨傘弄丟了。我現在正在找。\n圖書館櫃檯人員: 是什麼顏色的呢？\n마이클: 是藍色的。\n圖書館櫃檯人員: 好的，我幫您確認一下這裡有沒有送過來的雨傘。\n마이클: 謝謝。如果找到的話，請通知我一聲。\n圖書館櫃檯人員: 好的，請稍等一下。\n\n## D2\n地點與情境：週四讀書會前，麻浦區立圖書館入口服務桌；애니依另一張虛構失物卡練習求助。\n這段要完成的事：애니說明遺失了有貓咪圖案的錢包、正在尋找，讓櫃檯受理詢問。\n애니: 不好意思，我把錢包弄丟了。\n圖書館櫃檯人員: 錢包有什麼特徵嗎？\n애니: 上面有貓咪圖案。我現在正在找。\n圖書館櫃檯人員: 好的，是有貓咪圖案的錢包對吧。我幫您確認一下。\n애니: 好的，麻煩您了。\n圖書館櫃檯人員: 請稍等一下。\n\n## D3\n地點與情境：週六下午，麻浦區立圖書館借還書區旁；유키依獨立練習卡演練失物求助。\n這段要完成的事：유키說明遺失了紅色筆記本、正在尋找，請櫃檯幫忙查看。\n유키: 不好意思，我把筆記本弄丟了。我現在正在找。\n圖書館櫃檯人員: 筆記本是什麼顏色的呢？\n유키: 是紅色的。可以請您一起幫忙找嗎？\n圖書館櫃檯人員: 好的，我先找這邊的桌子。\n유키: 謝謝。那我找椅子那邊。\n圖書館櫃檯人員: 好的，如果找到的話請跟我說一聲。\n\n---\n"}]</script>
<script>
(function(){
"use strict";
const units=JSON.parse(document.getElementById("content-data").textContent);
const tabs=document.getElementById("unit-tabs"),viewer=document.getElementById("viewer");
const search=document.getElementById("search"),jump=document.getElementById("jump");
const count=document.getElementById("count"),empty=document.getElementById("no-results");
let active=0;
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function inline(s){
 let out=esc(s),saved=[];
 out=out.replace(/\x60([^\x60]+)\x60/g,function(_,code){let key="@@CODE"+saved.length+"@@";saved.push("<code>"+code+"</code>");return key;});
 out=out.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>");
 saved.forEach(function(x,i){out=out.replace("@@CODE"+i+"@@",x);});
 return out;
}
function render(md){
 const lines=md.split(/\r?\n/),out=[];let i=0,translated=false;
 function closeTranslated(){if(translated){out.push("</div>");translated=false;}}
 while(i<lines.length){
  const raw=lines[i],s=raw.trim();
  if(!s){i++;continue;}
  const h=s.match(/^(#{1,6})\s+(.+)$/);
  if(h){
   const level=h[1].length,title=h[2].trim();
   if(level===2&&(/^第\s*\d+\s*課/.test(title)||title.indexOf("本課要教的說法出現在哪")===0))closeTranslated();
   if(level===3&&title.indexOf("初版翻譯")===0){out.push("<h3 class=\"translation-title\">"+inline(title)+"</h3><div class=\"translation\">");translated=true;i++;continue;}
   out.push("<h"+level+">"+inline(title)+"</h"+level+">");i++;continue;
  }
  if(/^---+$/.test(s)){out.push("<hr>");i++;continue;}
  if(/^>/.test(s)){const q=[];while(i<lines.length&&/^\s*>/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,""));i++;}out.push("<blockquote><p>"+q.map(inline).join("<br>")+"</p></blockquote>");continue;}
  const lm=s.match(/^([-*]|\d+\.)\s+(.+)$/);
  if(lm){const ordered=/^\d+\./.test(lm[1]),items=[];while(i<lines.length){const m=lines[i].trim().match(/^([-*]|\d+\.)\s+(.+)$/);if(!m||/^\d+\./.test(m[1])!==ordered)break;items.push("<li>"+inline(m[2])+"</li>");i++;}out.push("<"+(ordered?"ol":"ul")+">"+items.join("")+"</"+(ordered?"ol":"ul")+">");continue;}
  const p=[];while(i<lines.length&&lines[i].trim()&&!/^\s*#{1,6}\s+/.test(lines[i])&&!/^\s*>/.test(lines[i])&&!/^\s*([-*]|\d+\.)\s+/.test(lines[i])&&!/^\s*---+\s*$/.test(lines[i])){p.push(lines[i].trim());i++;}
  if(p.length)out.push("<p>"+p.map(inline).join("<br>")+"</p>");
 }
 closeTranslated();return out.join("\n");
}
function split(md){
 const ms=Array.from(md.matchAll(/^## 第\s*(\d+)\s*課[^\n]*$/gm));
 if(!ms.length)return {intro:md,lessons:[]};
 return {intro:md.slice(0,ms[0].index),lessons:ms.map(function(m,n){return {number:Number(m[1]),markdown:md.slice(m.index,n+1<ms.length?ms[n+1].index:md.length)};})};
}
function show(index){
 active=index;const u=units[index],parts=split(u.markdown);
 Array.from(tabs.children).forEach(function(b,n){b.setAttribute("aria-selected",n===index?"true":"false");b.tabIndex=n===index?0:-1;});
 let html="<div class=\"unit-head\"><h2>"+u.name+" <span style=\"color:#68716b;font-weight:500\">· "+u.range+"</span></h2><a class=\"source\" href=\""+esc(u.source)+"\" target=\"_blank\" rel=\"noopener\">查看原始 Markdown ↗</a></div>";
 html+="<section class=\"intro prose\">"+render(parts.intro)+"</section>";
 parts.lessons.forEach(function(l,n){html+="<article class=\"lesson prose\" id=\"lesson-"+index+"-"+n+"\">"+render(l.markdown)+"</article>";});
 viewer.innerHTML=html;
 jump.innerHTML="<option value=\"\">跳到課程…</option>"+parts.lessons.map(function(l,n){return "<option value=\"lesson-"+index+"-"+n+"\">L"+l.number+" · 第 "+l.number+" 課</option>";}).join("");
 filter();
}
function filter(){
 const q=search.value.trim().toLocaleLowerCase(),intro=viewer.querySelector(".intro");
 const introOk=!q||intro.textContent.toLocaleLowerCase().indexOf(q)!==-1;intro.hidden=!introOk;
 const cards=Array.from(viewer.querySelectorAll(".lesson"));let shown=0;
 cards.forEach(function(card){const ok=!q||card.textContent.toLocaleLowerCase().indexOf(q)!==-1;card.hidden=!ok;if(ok)shown++;});
 count.textContent=q?shown+" / "+cards.length+" 課":"共 "+cards.length+" 課";
 empty.style.display=q&&!introOk&&shown===0?"block":"none";
 Array.from(jump.options).forEach(function(o){if(o.value){const target=document.getElementById(o.value);o.hidden=!!q&&target?target.hidden:false;}});
}
units.forEach(function(u,n){const b=document.createElement("button");b.className="tab";b.type="button";b.setAttribute("role","tab");b.setAttribute("aria-selected",n===0?"true":"false");b.textContent=u.name+" · "+u.range;b.addEventListener("click",function(){show(n);});tabs.appendChild(b);});
search.addEventListener("input",filter);
jump.addEventListener("change",function(){if(jump.value){const target=document.getElementById(jump.value);if(target)target.scrollIntoView({behavior:"smooth",block:"start"});}});
tabs.addEventListener("keydown",function(e){if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;const next=(active+(e.key==="ArrowRight"?1:-1)+units.length)%units.length;show(next);tabs.children[next].focus();});
show(0);
})();
</script>
